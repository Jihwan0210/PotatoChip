name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # CI: 테스트 게이트. 실패하면 deploy 가 아예 돌지 않는다.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - run: chmod +x ./gradlew

      - run: ./gradlew test --no-daemon

      # 실패 원인을 액션 화면에서 바로 보려면 리포트가 필요하다
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-report
          path: build/reports/tests/test

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 이미지 빌드 + Docker Hub push (빌드는 러너에서 = EC2 메모리 안전)
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USER }}/potatochip:latest

      # 2. EC2에 ssh → pull → 재실행 (설정은 .env 주입, 업로드는 호스트 볼륨 유지)
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # .env 없으면 기존 컨테이너 살려둔 채 중단 (docker rm 후 run 실패 = 서비스 다운 방지)
            test -f /home/ubuntu/.env || { echo "ERROR: /home/ubuntu/.env 없음"; exit 1; }
            docker pull ${{ secrets.DOCKERHUB_USER }}/potatochip:latest
            docker rm -f potatochip || true
            docker run -d --name potatochip --restart unless-stopped \
              -p 127.0.0.1:8080:8080 \
              --env-file /home/ubuntu/.env \
              -v /home/ubuntu/uploads:/app/uploads \
              ${{ secrets.DOCKERHUB_USER }}/potatochip:latest
            docker image prune -f
