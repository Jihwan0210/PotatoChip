# 테스트 전용 설정 - CI 러너에는 운영 설정이 없으므로 여기서 전부 충족시킨다.
# 실제 키는 절대 넣지 않는다. 외부 호출을 하지 않는 테스트이므로 더미값으로 충분하다.

spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.sql.init.mode=never

# FileService 구현체가 프로파일로 갈린다 (local=LocalFileService, prod=S3FileService)
# 운영도 local 로 동작하므로 테스트도 맞춘다
spring.profiles.active=local

# HS256 - Keys.hmacShaKeyFor(secret.getBytes()) 이므로 32자 이상 필요
jwt.secret=test-only-secret-not-a-real-key-0123456789abcdef
jwt.expiration=3600000

# spring-ai-starter-model-anthropic 자동설정이 기동 시 요구함
spring.ai.anthropic.api-key=dummy

# spring-cloud-starter-aws 2.2.x - 지정하지 않으면 EC2 메타데이터를 조회하다 실패한다
cloud.aws.region.static=ap-northeast-2
cloud.aws.stack.auto=false
cloud.aws.s3.bucket=dummy-bucket

kakao.rest-api-key=dummy
kakao.pay.admin-key=dummy
kakao.pay.cid=TC0ONETIME
kakao.pay.ready-url=http://localhost/dummy/ready
kakao.pay.approve-url=http://localhost/dummy/approve
kakao.pay.approval-redirect=http://localhost/dummy/approval
kakao.pay.cancel-redirect=http://localhost/dummy/cancel
kakao.pay.fail-redirect=http://localhost/dummy/fail
