<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>못난이 농작물</title>
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet"/>
    <link href="css/style.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="nav :: nav"></div>

<div style="background:#fff;border-bottom:1.5px solid var(--sand);padding:28px 5% 20px;display:flex;align-items:center;justify-content:space-between;margin-top:60px">
    <div style="font-family:Gaegu,cursive;font-size:1.7rem;font-weight:700;color:var(--dark)">장바구니 🛒</div>
    <span style="font-size:.8rem;color:var(--muted)" id="itemCount">0개 상품</span>
</div>

<div style="padding:28px 5%" id="cartData">
    <div class="cart-layout">

        <!-- 좌측: 상품 목록 -->
        <div id="cartList">

            <!-- 비로그인 안내 -->
            <div id="loginGuide" style="text-align:center;padding:60px 20px;color:var(--muted)">
                <div style="font-size:3rem;margin-bottom:12px">🔒</div>
                <div style="font-family:Gaegu,cursive;font-size:1.1rem;color:var(--mid);margin-bottom:8px">로그인이 필요한 서비스예요</div>
                <div style="font-size:.8rem;margin-bottom:20px">장바구니를 이용하시려면 로그인 해주세요.</div>
                <button onclick="location.href='/login'"
                        style="background:var(--green);color:#fff;border:none;border-radius:10px;padding:10px 24px;font-size:.9rem;cursor:pointer;font-weight:700">
                    로그인 페이지로 이동하기 →
                </button>
            </div>

            <!-- 판매자 계정 안내 -->
            <div id="sellerGuide" style="display:none;text-align:center;padding:60px 20px;color:var(--muted)">
                <div style="font-size:3rem;margin-bottom:12px">🚫</div>
                <div style="font-family:Gaegu,cursive;font-size:1.1rem;color:var(--mid);margin-bottom:8px">
                    판매자 계정으로는 구매가 불가능합니다
                </div>
                <div style="font-size:.8rem;margin-bottom:20px">
                    구매를 원하시면 구매자 계정을 이용해주세요.
                </div>
            </div>


            <!-- 로그인 시 노출 -->
            <div id="cartItems" style="display:none">

                <!-- 장바구니 비었을 때 -->
                <div id="emptyCart" style="display:none;text-align:center;padding:60px 20px;color:var(--muted)">
                    <div style="font-size:3rem;margin-bottom:12px">🛒</div>
                    <div style="font-family:Gaegu,cursive;font-size:1.1rem;color:var(--mid);margin-bottom:8px">장바구니가 비어있어요</div>
                    <div style="font-size:.8rem;margin-bottom:20px">마켓에서 마음에 드는 상품을 담아보세요!</div>
                    <button onclick="location.href='/market'"
                            style="background:var(--green);color:#fff;border:none;border-radius:10px;padding:10px 24px;font-size:.9rem;cursor:pointer">
                        마켓 가기 →
                    </button>
                </div>

                <!-- 픽업 가능 섹션 -->
                <div id="pickupSection" style="display:none;margin-bottom:8px">
                    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
                        <span style="font-size:.78rem;font-weight:700;color:var(--green)">📍 픽업 가능 상품</span>
                        <div style="flex:1;height:1px;background:var(--gl)"></div>
                    </div>
                    <div id="pickupList"></div>
                </div>

                <!-- 배송 전용 섹션 -->
                <div id="deliverySection" style="display:none;margin-bottom:8px">
                    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;margin-top:16px">
                        <span style="font-size:.78rem;font-weight:700;color:var(--muted)">🚚 배송 전용 상품 (픽업 불가)</span>
                        <div style="flex:1;height:1px;background:var(--sand)"></div>
                    </div>
                    <div id="deliveryList"></div>
                </div>

                <input type="hidden" id="cartTotal" value="0"/>
            </div>
        </div>

        <!-- 우측: 주문 요약 -->
        <div class="cart-sum" id="cartSummary">
            <div class="cs-title">💰 주문 요약</div>

            <div class="cs-row">
                <span>상품 금액</span>
                <span class="v" id="cs-tot">0원</span>
            </div>

            <div class="cs-row">
                <span>할인</span>
                <span class="v" id="cs-disc" style="color:var(--green)">-0원</span>
            </div>

            <div style="font-size:.72rem;font-weight:500;color:var(--mid);margin:10px 0 6px">배송 방법</div>
            <div class="del-opts">
                <div class="del-opt on" onclick="selD(this,0)">
                    <input checked="" name="del" type="radio"/>
                    <div style="flex:1"><div class="del-ti">🚚 일반 배송</div><div class="del-su">2~3일</div></div>
                    <div class="del-pr">무료</div>
                </div>
                <div class="del-opt" onclick="selD(this,3000)">
                    <input name="del" type="radio"/>
                    <div style="flex:1"><div class="del-ti">⚡ 당일 배송</div><div class="del-su">오전 11시 전</div></div>
                    <div class="del-pr">3,000원</div>
                </div>
                <div class="del-opt" id="pickupOpt" onclick="selPickup(this)">
                    <input name="del" type="radio"/>
                    <div style="flex:1"><div class="del-ti">📍 농장 픽업</div><div class="del-su">무료</div></div>
                    <div class="del-pr" style="color:var(--green)">무료</div>
                </div>
            </div>

            <div class="cs-row">
                <span>배송비</span>
                <span class="v" id="cs-ship">무료</span>
            </div>

            <div class="pt-row">
                <input class="pt-in" id="ptIn" max="2000" min="0"
                       placeholder="포인트 사용 (보유: 2,000P)" type="number"/>
                <button class="btn-pt" onclick="applyPt()">사용</button>
            </div>

            <div class="cs-row">
                <span style="color:var(--muted)">포인트</span>
                <span id="cs-pt" style="color:var(--green)">-0원</span>
            </div>

            <div class="cs-row total">
                <span>최종 금액</span>
                <span class="v" id="cs-fin">0원</span>
            </div>

            <div class="ben-badge" id="cartPoints">🌿 이번 구매로 0P 적립 예정!</div>
            <button class="btn-order" id="btnOrder" onclick="goToOrder()">결제하기 →</button>
        </div>

    </div>
</div>

<div th:replace="footer :: footer"></div>
<script src="js/app.js"></script>
<script>
    const token = sessionStorage.getItem('token') || localStorage.getItem('token');
    const role = localStorage.getItem('role') || sessionStorage.getItem('role');
    var sf = 0, pd = 0;
    var selectedDeliveryType = 'delivery';      // 현재 선택된 배송 타입
    var selectedDeliveryFee  = 0;               // 현재 선택된 배송비
    var selectedDeliveryLabel = '🚚 일반 배송'; // 현재 선택된 배송 라벨

    if (!token || !role) {
        document.getElementById('loginGuide').style.display = 'block';
        document.getElementById('cartItems').style.display = 'none';
    } else if (role === 'SELLER') {
        document.getElementById('loginGuide').style.display = 'none';
        document.getElementById('sellerGuide').style.display = 'block';
        document.getElementById('cartItems').style.display = 'none';
    } else {
        document.getElementById('loginGuide').style.display = 'none';
        document.getElementById('cartItems').style.display = 'block';

        fetch('/cart/data', {
            headers: { 'Authorization': 'Bearer ' + token }
        })
            .then(res => {
                if (res.status === 401) {
                    document.getElementById('loginGuide').style.display = 'block';
                    document.getElementById('cartItems').style.display = 'none';
                    return null;
                }
                return res.json();
            })
            .then(cart => {
                if (!cart) return;
                renderCart(cart);
                recalcTotal();
            });
    }

    function renderCart(cart) {
        if (!cart.items || cart.items.length === 0) {
            document.getElementById('emptyCart').style.display = 'block';
            document.getElementById('itemCount').textContent = '0개 상품';
            return;
        }

        cart.items.forEach(item => {
            cItems[item.productId] = {
                up: Number(item.price),
                qty: item.quantity,
                ogPrice: Number(item.price)
            };
        });


        document.getElementById('itemCount').textContent = cart.items.length + '개 상품';
        document.getElementById('cartTotal').value = cart.items.length;

        const pickupItems = cart.items.filter(i => i.isPickupAvailable);
        const deliveryItems = cart.items.filter(i => !i.isPickupAvailable);

        if (pickupItems.length > 0) {
            document.getElementById('pickupSection').style.display = 'block';
            pickupItems.forEach(item => {
                document.getElementById('pickupList').appendChild(createItemRow(item, true));
            });
        }

        if (deliveryItems.length > 0) {
            document.getElementById('deliverySection').style.display = 'block';
            deliveryItems.forEach(item => {
                document.getElementById('deliveryList').appendChild(createItemRow(item, false));
            });
        }
    }

    function createItemRow(item, isPickup) {
        const div = document.createElement('div');
        div.setAttribute('data-product-id', item.productId);
        div.setAttribute('data-unit-price', Number(item.price));
        div.setAttribute('data-pickup', isPickup);
        div.style.cssText = 'display:flex;align-items:center;gap:12px;padding:16px;background:#fff;border:1.5px solid var(--sand);border-radius:12px;margin-bottom:10px';

        div.innerHTML = `
  <input type="checkbox" id="check-${item.productId}" checked onchange="onCheckChange()"
    style="width:16px;height:16px;accent-color:var(--green);flex-shrink:0;cursor:pointer">

  <img src="${item.thumbnailUrl || 'https://placehold.co/64x64?text=🥔'}" alt=""
    style="width:64px;height:64px;object-fit:cover;border-radius:8px;flex-shrink:0">

  <div style="flex:1;min-width:0">
    <div style="font-size:.85rem;font-weight:700;color:var(--dark);margin-bottom:2px;
                white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
      ${item.productName}
    </div>
    <div style="font-size:.78rem;color:var(--muted);margin-bottom:8px">
      ${Number(item.price).toLocaleString()}원 / 개
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <button onclick="decreaseQty(${item.productId})"
        style="width:24px;height:24px;border:1px solid var(--sand);border-radius:6px;
               background:#fff;cursor:pointer;font-size:.9rem;line-height:1">−</button>
      <span id="qty-${item.productId}"
        style="min-width:20px;text-align:center;font-size:.85rem;font-weight:700">
        ${item.quantity}
      </span>
      <button onclick="increaseQty(${item.productId})"
        style="width:24px;height:24px;border:1px solid var(--sand);border-radius:6px;
               background:#fff;cursor:pointer;font-size:.9rem;line-height:1">+</button>
    </div>
  </div>

  <div style="text-align:right;flex-shrink:0">
    <div id="subtotal-${item.productId}"
      style="font-size:.9rem;font-weight:700;color:var(--dark);margin-bottom:8px">
      ${(Number(item.price) * item.quantity).toLocaleString()}원
    </div>
    <button onclick="removeItem(${item.productId})"
      style="font-size:.72rem;color:var(--muted);background:none;border:none;
             cursor:pointer;text-decoration:underline">
      삭제
    </button>
  </div>
`;
        return div;
    }

    function recalcTotal() {
        var tot = 0;
        document.querySelectorAll('[data-product-id]').forEach(function(row) {
            var productId = row.dataset.productId;
            var chk = document.getElementById('check-' + productId);
            if (!chk || !chk.checked) return;
            var unitPrice = parseInt(row.dataset.unitPrice) || 0;
            var qtyEl = document.getElementById('qty-' + productId);
            var qty = parseInt(qtyEl ? qtyEl.textContent : 0) || 0;
            tot += unitPrice * qty;
        });
        var fin = Math.max(0, tot + sf - pd);
        var et = document.getElementById('cs-tot');
        var ef = document.getElementById('cs-fin');
        var pts = document.getElementById('cartPoints');
        if (et) et.textContent = tot.toLocaleString() + '원';
        if (ef) ef.textContent = fin.toLocaleString() + '원';
        if (pts) pts.textContent = '🌿 이번 구매로 ' + Math.floor(fin / 100) + 'P 적립 예정!';
    }

    function onCheckChange() { recalcTotal(); }

    // ── 배송 선택 시 로컬 변수도 함께 갱신 ──────────────────────────────
    // app.js의 selD/selPickup을 페이지별로 덮어씌웁니다.
    function selD(el, fee) {
        document.querySelectorAll('.del-opt').forEach(function(d) {
            d.classList.remove('on');
            d.querySelector('input').checked = false;
        });
        el.classList.add('on');
        el.querySelector('input').checked = true;
        sf = fee;
        selectedDeliveryFee = fee;

        var tiEl = el.querySelector('.del-ti');
        selectedDeliveryLabel = tiEl ? tiEl.textContent.trim() : '🚚 일반 배송';

        // 픽업이면 pickup, 당일이면 express, 나머지는 delivery
        if (selectedDeliveryLabel.includes('픽업')) {
            selectedDeliveryType = 'pickup';
        } else if (selectedDeliveryLabel.includes('당일')) {
            selectedDeliveryType = 'express';
        } else {
            selectedDeliveryType = 'delivery';
        }

        var es = document.getElementById('cs-ship');
        if (es) es.textContent = fee ? fee.toLocaleString() + '원' : '무료';
        recalcTotal();
    }

    function selPickup(el) {
        var hasNonPickup = false;
        document.querySelectorAll('[data-product-id]').forEach(function(row) {
            var productId = row.dataset.productId;
            var chk = document.getElementById('check-' + productId);
            var isPickup = row.dataset.pickup === 'true';
            if (chk && chk.checked && !isPickup) hasNonPickup = true;
        });
        if (hasNonPickup) {
            alert('⚠️ 농장 픽업이 불가능한 상품이 포함되어 있어요!\n픽업 불가 상품의 체크를 해제하거나 배송 방법을 변경해주세요.');
            return;
        }
        selD(el, 0);
    }

    // ── 결제하기: 배송 선택 정보를 sessionStorage에 저장 후 이동 ─────────
    function goToOrder() {
        var checkedIds = [];
        document.querySelectorAll('[data-product-id]').forEach(function(row) {
            var productId = row.dataset.productId;
            var chk = document.getElementById('check-' + productId);
            if (chk && chk.checked) checkedIds.push(String(productId));
        });

        if (checkedIds.length === 0) {
            alert('주문할 상품을 선택해주세요.');
            return;
        }
        sessionStorage.setItem('selectedProductIds',   JSON.stringify(checkedIds));
        sessionStorage.setItem('selectedDeliveryType',  selectedDeliveryType);
        sessionStorage.setItem('selectedDeliveryFee',   selectedDeliveryFee);
        sessionStorage.setItem('selectedDeliveryLabel', selectedDeliveryLabel);

        var token = localStorage.getItem('token') || sessionStorage.getItem('token');
        location.href = '/orders?token=' + (token || '');
    }


    function increaseQty(productId) {
        var qtyEl = document.getElementById('qty-' + productId);
        var current = parseInt(qtyEl ? qtyEl.textContent : 1) || 1;
        updateQty(productId, current + 1);
    }

    function decreaseQty(productId) {
        var qtyEl = document.getElementById('qty-' + productId);
        var current = parseInt(qtyEl ? qtyEl.textContent : 1) || 1;
        if (current <= 1) return;
        updateQty(productId, current - 1);
    }

    var updateLock = false;
    async function updateQty(productId, newQty) {
        if (newQty < 1 || updateLock) return;
        updateLock = true;
        try {
            const res = await fetch(`/cart/items/${productId}?quantity=${newQty}`, {
                method: 'PATCH',
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (res.ok) {
                var qtyEl = document.getElementById('qty-' + productId);
                if (qtyEl) qtyEl.textContent = newQty;
                var row = document.querySelector('[data-product-id="' + productId + '"]');
                var unitPrice = parseInt(row ? row.dataset.unitPrice : 0) || 0;
                var subtotalEl = document.getElementById('subtotal-' + productId);
                if (subtotalEl) subtotalEl.textContent = (unitPrice * newQty).toLocaleString() + '원';
                recalcTotal();
            }
        } catch (e) {
            console.error('요청 오류:', e);
        } finally {
            updateLock = false;
        }
    }

    async function removeItem(productId) {
        try {
            const res = await fetch(`/cart/items/${productId}`, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (res.ok) {
                var row = document.querySelector('[data-product-id="' + productId + '"]');
                if (row) row.remove();

                // 섹션 비었으면 숨기기
                if (document.getElementById('pickupList').children.length === 0)
                    document.getElementById('pickupSection').style.display = 'none';
                if (document.getElementById('deliveryList').children.length === 0)
                    document.getElementById('deliverySection').style.display = 'none';

                // 둘 다 비었으면 빈 메시지
                if (document.querySelectorAll('[data-product-id]').length === 0)
                    document.getElementById('emptyCart').style.display = 'block';

                recalcTotal();
            }
        } catch (e) {
            console.error('요청 오류:', e);
        }
    }
</script>
</body>
</html>
