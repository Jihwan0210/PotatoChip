<!DOCTYPE html>
<html lang="ko"><head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>못난이 농작물</title>
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet"/>
    <link href="css/style.css" rel="stylesheet"/>
</head><body>
<div th:replace="nav :: nav"></div>
<div style="background:#fff;border-bottom:1.5px solid var(--sand);padding:28px 5% 20px;display:flex;align-items:center;justify-content:space-between">
    <div style="font-family:Gaegu,cursive;font-size:1.7rem;font-weight:700;color:var(--dark)">장바구니 🛒</div>
    <span style="font-size:.8rem;color:var(--muted)"
          th:text="${cart.items != null ? cart.items.size() : 0} + '개 상품'"></span>
</div>
<div style="padding:28px 5%">
    <div class="cart-layout">

        <!-- ▼ 좌측: 상품 목록 영역 -->
        <div id="cartList">

            <!-- 비로그인 안내 (기본 노출, 로그인 시 JS로 숨김) -->
            <div id="loginGuide" style="text-align:center;padding:60px 20px;color:var(--muted)">
                <div style="font-size:3rem;margin-bottom:12px">🔒</div>
                <div style="font-family:Gaegu,cursive;font-size:1.1rem;color:var(--mid);margin-bottom:8px">로그인이 필요한 서비스예요</div>
                <div style="font-size:.8rem;margin-bottom:20px">장바구니를 이용하시려면 로그인 해주세요.</div>
                <button onclick="location.href='/login'"
                        style="background:var(--green);color:#fff;border:none;border-radius:10px;padding:10px 24px;font-size:.9rem;cursor:pointer;font-weight:700">
                    로그인 페이지로 이동하기 →
                </button>
            </div>

            <!-- 로그인 시 노출 (JS로 display:block) -->
            <div id="cartItems" style="display:none">

                <!-- 비어있을 때 -->
                <div th:if="${cart.items == null or cart.items.isEmpty()}"
                     style="text-align:center;padding:60px 20px;color:var(--muted)">
                    <div style="font-size:3rem;margin-bottom:12px">🛒</div>
                    <div style="font-family:Gaegu,cursive;font-size:1.1rem;color:var(--mid);margin-bottom:8px">장바구니가 비어있어요</div>
                    <div style="font-size:.8rem;margin-bottom:20px">마켓에서 마음에 드는 상품을 담아보세요!</div>
                    <button onclick="location.href='/market'"
                            style="background:var(--green);color:#fff;border:none;border-radius:10px;padding:10px 24px;font-size:.9rem;cursor:pointer">
                        마켓 가기 →
                    </button>
                </div>

                <!-- 아이템 목록 -->
                <div th:each="item : ${cart.items}"
                     style="display:flex;align-items:center;gap:12px;padding:16px;background:#fff;border:1.5px solid var(--sand);border-radius:12px;margin-bottom:10px">
                    <!-- 썸네일 -->
                    <div style="width:60px;height:60px;border-radius:10px;background:var(--beige2);overflow:hidden;flex-shrink:0">
                        <img th:if="${item.thumbnailUrl != null and !item.thumbnailUrl.isEmpty()}"
                             th:src="${item.thumbnailUrl}"
                             style="width:100%;height:100%;object-fit:cover"/>
                        <div th:unless="${item.thumbnailUrl != null and !item.thumbnailUrl.isEmpty()}"
                             style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:1.5rem">🥬</div>
                    </div>

                    <!-- 상품 정보 -->
                    <div style="flex:1;min-width:0">
                        <div style="font-size:.82rem;color:var(--green);margin-bottom:2px" th:text="${item.origin}"></div>
                        <div style="font-size:.88rem;font-weight:600;color:var(--dark)" th:text="${item.productName}"></div>
                        <div style="font-size:.78rem;color:var(--muted)"
                             th:text="${#numbers.formatInteger(item.price, 3, 'COMMA')} + '원'"></div>
                    </div>

                    <!-- 수량 조절 -->
                    <div style="display:flex;align-items:center;border:1.5px solid var(--sand);border-radius:8px;overflow:hidden">
                        <button th:onclick="|updateQty(${item.productId}, ${item.quantity} - 1)|"
                                style="width:30px;height:30px;border:none;background:#fff;cursor:pointer;font-size:.9rem">−</button>
                        <span th:text="${item.quantity}"
                              style="width:32px;text-align:center;font-size:.84rem;font-weight:700"></span>
                        <button th:onclick="|updateQty(${item.productId}, ${item.quantity} + 1)|"
                                style="width:30px;height:30px;border:none;background:#fff;cursor:pointer;font-size:.9rem">+</button>
                    </div>

                    <!-- 소계 -->
                    <div style="font-size:.88rem;font-weight:700;color:var(--dark);min-width:70px;text-align:right"
                         th:text="${#numbers.formatInteger(item.price * item.quantity, 3, 'COMMA')} + '원'"></div>

                    <!-- 삭제 -->
                    <button th:onclick="|removeItem(${item.productId})|"
                            style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.1rem;flex-shrink:0">✕</button>
                </div>

                <!-- 총액 스크립트용 hidden -->
                <input type="hidden" id="cartTotal"
                       th:value="${cart.items != null ? cart.items.size() : 0}"/>

            </div> <!-- /#cartItems -->
        </div> <!-- /#cartList -->

        <!-- ▼ 우측: 주문 요약 (항상 노출) -->
        <div class="cart-sum" id="cartSummary">
            <div class="cs-title">💰 주문 요약</div>

            <div class="cs-row">
                <span>상품 금액</span>
                <span class="v" id="cs-tot"
                      th:text="${#numbers.formatDecimal(totalPrice, 3, 'COMMA', 0, 'POINT')} + '원'"></span>
            </div>

            <div class="cs-row">
                <span>할인</span>
                <span class="v" id="cs-disc" style="color:var(--green)">-0원</span>
            </div>

            <div style="font-size:.72rem;font-weight:500;color:var(--mid);margin:10px 0 6px">배송 방법</div>
            <div class="del-opts">
                <div class="del-opt on" onclick="selD(this,0)"><input checked="" name="del" type="radio"/><div style="flex:1"><div class="del-ti">🚚 일반 배송</div><div class="del-su">2~3일</div></div><div class="del-pr">무료</div></div>
                <div class="del-opt" onclick="selD(this,3000)"><input name="del" type="radio"/><div style="flex:1"><div class="del-ti">⚡ 당일 배송</div><div class="del-su">오전 11시 전</div></div><div class="del-pr">3,000원</div></div>
                <div class="del-opt" onclick="selD(this,0)"><input name="del" type="radio"/><div style="flex:1"><div class="del-ti">📍 농장 픽업</div><div class="del-su">무료</div></div><div class="del-pr" style="color:var(--green)">무료</div></div>
            </div>

            <div class="cs-row">
                <span>배송비</span>
                <span class="v" id="cs-ship">무료</span>
            </div>

            <div class="pt-row">
                <input class="pt-in" id="ptIn" max="2000" min="0" placeholder="포인트 사용 (보유: 2,000P)" type="number"/>
                <button class="btn-pt" onclick="applyPt()">사용</button>
            </div>

            <div class="cs-row">
                <span style="color:var(--muted)">포인트</span>
                <span id="cs-pt" style="color:var(--green)">-0원</span>
            </div>

            <div class="cs-row total">
                <span>최종 금액</span>
                <span class="v" id="cs-fin"
                      th:text="${#numbers.formatDecimal(totalPrice, 3, 'COMMA', 0, 'POINT')} + '원'"></span>
            </div>

            <div class="ben-badge" id="cartPoints">🌿 이번 구매로 0P 적립 예정!</div>
            <button class="btn-order" id="btnOrder" onclick="doOrder()">결제하기 →</button>
        </div> <!-- /#cartSummary -->

    </div> <!-- /.cart-layout -->
</div>
<div th:replace="footer :: footer"></div>
<script>
    // 로그인 여부 확인 (마켓 페이지와 동일한 패턴)
    const role = localStorage.getItem('role') || sessionStorage.getItem('role');
    if (role) {
        document.getElementById('loginGuide').style.display = 'none';
        document.getElementById('cartItems').style.display = 'block';
    }

    // 수량 변경
    async function updateQty(productId, newQty) {
        if (newQty < 1) return;
        try {
            const res = await fetch(`/cart/items/${productId}?quantity=${newQty}`, { method: 'PATCH' });
            if (res.ok) {
                location.reload();
            } else {
                console.error('수량 변경 실패:', res.status);
            }
        } catch (e) {
            console.error('요청 오류:', e);
        }
    }

    // 삭제
    async function removeItem(productId) {
        try {
            const res = await fetch(`/cart/items/${productId}`, { method: 'DELETE' });
            if (res.ok) {
                location.reload();
            } else {
                console.error('삭제 실패:', res.status);
            }
        } catch (e) {
            console.error('요청 오류:', e);
        }
    }
</script>
<script src="js/app.js"></script></body></html>
