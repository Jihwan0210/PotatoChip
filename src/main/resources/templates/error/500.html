<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>잠시 문제가 생겼어요 | 못난이 농작물</title>
  <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet"/>
  <link th:href="@{/css/style.css}" href="/css/style.css" rel="stylesheet"/>
  <style>
    .err-page{min-height:100vh;padding-top:64px;background:linear-gradient(160deg,var(--beige2) 0%,var(--beige3) 48%,var(--gp) 100%);display:flex;flex-direction:column}
    .err-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:60px 6%}
    .err-card{background:var(--white);border:1.5px solid var(--beige);border-radius:22px;padding:44px 36px;max-width:460px;width:100%;text-align:center}
    .err-emoji{font-size:3.2rem;margin-bottom:10px}
    .err-code{font-size:.68rem;color:var(--green);letter-spacing:2px;font-weight:700;margin-bottom:6px}
    .err-title{font-family:'Gaegu',cursive;font-size:2rem;font-weight:700;color:var(--dark);margin-bottom:10px}
    .err-desc{color:var(--light);font-size:.86rem;line-height:1.75;margin-bottom:26px}
    .err-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
    .err-btn{padding:11px 20px;border-radius:11px;font-size:.86rem;font-weight:600;cursor:pointer;border:1.5px solid var(--beige);background:#fff;color:var(--dark);text-decoration:none}
    .err-btn.primary{background:var(--green);border-color:var(--green);color:#fff}
  </style>
</head>
<body>
<div th:replace="~{nav :: nav}"></div>
<div class="err-page">
  <div class="err-wrap">
    <div class="err-card">
      <div class="err-emoji">🚜</div>
      <div class="err-code">500 SERVER ERROR</div>
      <div class="err-title">잠시 문제가 생겼어요</div>
      <p class="err-desc">서버에서 처리 중 오류가 났어요.<br/>잠시 후 다시 시도해 주세요.</p>
      <div class="err-btns">
        <a class="err-btn primary" th:href="@{/}">홈으로 가기</a>
        <a class="err-btn" href="javascript:history.back()">이전 페이지</a>
      </div>
    </div>
  </div>
  <div th:replace="~{footer :: footer}"></div>
</div>
</body>
</html>
