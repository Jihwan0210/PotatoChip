<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>못난이 농작물</title>
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div th:replace="nav :: nav"></div>

<!-- 마켓 헤더 -->
<div style="background:#fff;border-bottom:1.5px solid var(--sand);padding:28px 5% 0;margin-top:64px">
    <div style="font-size:.65rem;color:var(--green);letter-spacing:1px;font-weight:500;margin-bottom:6px">Market</div>
    <div style="font-family:Gaegu,cursive;font-size:1.7rem;font-weight:700;color:var(--dark);margin-bottom:14px">못난이 마켓 🌿</div>

    <!-- 검색바 -->
    <div style="display:flex;align-items:center;gap:8px;max-width:600px;margin-bottom:14px">
        <select id="mktSearchType" style="border:1.5px solid var(--sand);border-radius:8px;padding:9px 10px;font-size:.78rem;color:var(--mid);background:#fff;font-family:inherit;cursor:pointer;outline:none">
            <option value="all"    th:selected="${searchType == 'all'}">전체</option>
            <option value="name"   th:selected="${searchType == 'name'}">상품명</option>
            <option value="farm"   th:selected="${searchType == 'farm'}">원산지</option>
            <option value="region" th:selected="${searchType == 'region'}">농장 위치</option>
        </select>
        <div style="flex:1;display:flex;align-items:center;gap:8px;background:var(--beige2);border:1.5px solid var(--sand);border-radius:10px;padding:9px 14px">
            <span style="font-size:.85rem;color:var(--muted)">🔍</span>
            <input id="mktSearch" th:value="${keyword}" onkeydown="if(event.key==='Enter')doMktSearch()" placeholder="상품명, 농장명, 지역으로 검색..." style="flex:1;border:none;outline:none;font-size:.82rem;color:var(--dark);background:transparent;font-family:inherit"/>
            <span id="mktSearchClear" onclick="clearMktSearch()" style="font-size:.85rem;color:var(--muted);cursor:pointer;display:none">×</span>
        </div>
        <button onclick="doMktSearch()" style="background:var(--green);color:#fff;border:none;border-radius:10px;padding:9px 18px;font-size:.8rem;font-weight:500;cursor:pointer;font-family:inherit;white-space:nowrap">검색</button>
    </div>
    <!-- 카테고리 탭 (3개) -->
    <div style="display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:-1.5px">
        <div id="mkt-tab-0" onclick="switchMktTab(0)" style="padding:12px 0;text-align:center;border-bottom:2px solid var(--green);font-size:.8rem;font-weight:500;color:var(--dark);cursor:pointer">전체 상품</div>
        <div id="mkt-tab-1" onclick="switchMktTab(1)" style="padding:12px 0;text-align:center;font-size:.8rem;color:var(--muted);cursor:pointer">AI 추천</div>
        <div id="mkt-tab-2" onclick="openRecPopup()" style="padding:12px 0;text-align:center;font-size:.8rem;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px">🔥 인기상품추천</div>
    </div>
</div>

<!-- 인기상품추천 팝업 -->
<div id="recPopup" style="display:none;position:fixed;bottom:100px;right:100px;width:420px;height:460px;min-width:320px;min-height:300px;max-width:90vw;max-height:82vh;background:#fff;border:1.5px solid var(--sand);border-radius:16px;box-shadow:0 12px 40px rgba(42,30,6,.16);z-index:9990;overflow:hidden;resize:both">
    <div id="recPopupHeader" style="background:linear-gradient(135deg,var(--green),#5A9A30);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;cursor:move;user-select:none">
        <div>
            <div style="font-size:1rem;font-weight:700;color:#fff;font-family:Gaegu,cursive">🔥 인기상품 추천</div>
            <div style="font-size:.76rem;color:rgba(255,255,255,.86);margin-top:3px;font-weight:600">주문수 · 찜수 · 리뷰수 · 평점 · 최신등록순 기반</div>
        </div>
        <span class="rec-popup-close" onclick="closeRecPopup()" style="cursor:pointer;color:rgba(255,255,255,.85);font-size:1.2rem;line-height:1">✕</span>
    </div>
    <div style="padding:14px 16px;max-height:calc(100% - 112px);overflow:auto">
        <div style="font-size:.86rem;font-weight:700;color:var(--amber);margin-bottom:12px;display:flex;align-items:center;gap:6px">🔥 지금 인기 있는 상품</div>
        <div id="popularRecommendationList" style="min-height:80px">
            <div style="font-size:.74rem;color:var(--muted);padding:12px 0;text-align:center">인기상품을 불러오는 중...</div>
        </div>
    </div>
    <div style="padding:0 14px 12px">
        <button onclick="location.href='/market';closeRecPopup();" style="width:100%;background:var(--green);color:#fff;border:none;border-radius:9px;padding:9px;font-size:.82rem;font-weight:600;cursor:pointer">마켓 전체 보기 →</button>
    </div>
</div>

<!-- 필터 -->
<div id="mktFilterBar" class="mkt-bar" style="display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none">
    <div class="mf" th:classappend="${category == '' or category == '전체'} ? ' on'" onclick="mktF(this)">전체</div>
    <div class="mf" th:classappend="${category == '채소'} ? ' on'" onclick="mktF(this)">채소 🥦</div>
    <div class="mf" th:classappend="${category == '과일'} ? ' on'" onclick="mktF(this)">과일 🍎</div>
    <div class="mf" th:classappend="${category == '곡류'} ? ' on'" onclick="mktF(this)">곡류 🌾</div>
    <div class="mf" th:classappend="${category == '버섯'} ? ' on'" onclick="mktF(this)">버섯 🍄</div>
    <div class="mf" th:classappend="${category == '뿌리채소'} ? ' on'" onclick="mktF(this)">뿌리채소 🥕</div>
    <div class="mf" th:classappend="${category == '기한임박'} ? ' on'" onclick="mktF(this)" style="background:#fff5ef;color:#D05018;border-color:#f5c8a8">⏰ 기한임박</div>
</div>

<!-- ======= 탭 0: 전체 상품 ======= -->
<div id="mkt-content-0" style="padding:22px 5%">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px">
        <span class="pgrid-count" style="font-size:.76rem;color:var(--muted)">총 <strong style="color:var(--dark)" th:text="${totalElements}"></strong>개 상품</span>
        <!-- 정렬 버튼 -->
        <div style="display:flex;align-items:center;gap:8px">
            <div style="display:flex;gap:0;border:1.5px solid var(--sand);border-radius:8px;overflow:hidden">
                <div id="sort-btn-popular"   onclick="setSort('popular')"   style="font-size:.74rem;cursor:pointer;padding:5px 11px;border-right:1px solid var(--sand);border-radius:6px 0 0 6px;font-weight:700;color:var(--green);background:var(--gp)">인기순</div>
                <div id="sort-btn-discount"  onclick="setSort('discount')"  style="font-size:.74rem;cursor:pointer;padding:5px 11px;border-right:1px solid var(--sand);color:var(--muted)">할인율순</div>
                <div id="sort-btn-price"     onclick="setSort('price')"     style="font-size:.74rem;cursor:pointer;padding:5px 11px;border-right:1px solid var(--sand);color:var(--muted)">가격순</div>
                <div id="sort-btn-newest"    onclick="setSort('newest')"    style="font-size:.74rem;cursor:pointer;padding:5px 11px;color:var(--muted);border-radius:0 6px 6px 0">최신순</div>
            </div>
            <button id="registerBtn"
                    style="display:none;font-size:.74rem;cursor:pointer;padding:5px 11px;border:1px solid var(--green);background:var(--green);color:#fff;border-radius:6px;font-weight:700"
                    th:onclick="|location.href='@{/market/create}'|">
                + 상품등록
            </button>
            <button id="myProductsBtn"
                    style="display:none;font-size:.74rem;cursor:pointer;padding:5px 11px;border:1px solid var(--green);background:#fff;color:var(--green);border-radius:6px;font-weight:700"
                    onclick="toggleMyProducts()">
                내 상품
            </button>
        </div>
        <script th:inline="javascript">
            const role = localStorage.getItem('role') || sessionStorage.getItem('role');
            if (role === 'SELLER') {
                document.getElementById('registerBtn').style.display = 'inline-block';
                document.getElementById('myProductsBtn').style.display = 'inline-block';
            }

            // 현재 sellerId 파라미터가 있으면 "내 상품" 버튼 활성화 표시
            (function() {
                var url = new URL(window.location.href);
                var sellerEmailParam = url.searchParams.get('sellerEmail');
                var btn = document.getElementById('myProductsBtn');
                if (sellerEmailParam && btn) {
                    btn.style.background = 'var(--green)';
                    btn.style.color = '#fff';
                    btn.textContent = '내 상품 ✓';
                }
            })();

            function toggleMyProducts() {
                const token = localStorage.getItem('token') || sessionStorage.getItem('token');
                const url = new URL(window.location.href);

                if (url.searchParams.get('sellerEmail')) {
                    url.searchParams.delete('sellerEmail');
                } else {
                    if (!token) { alert('로그인 후 이용해주세요'); return; }
                    const payload = JSON.parse(atob(token.split('.')[1]));
                    const myEmail = payload.sub; // JWT sub = "222" (email)
                    url.searchParams.set('sellerEmail', myEmail);
                }
                url.searchParams.set('page', '0');
                window.location.href = url.toString();
            }
        </script>
    </div>

    <!-- 상품 그리드 -->
    <div class="pgrid" id="productGrid">
        <div class="pc2"
             th:each="product : ${products}"
             th:data-category="${product.category}"
             th:data-price="${product.discountPrice != null ? product.discountPrice : product.price}"
             th:data-discount="${product.discountPrice != null ? (product.price - product.discountPrice) * 100 / product.price : 0}"
             th:data-id="${product.id}"
             th:onclick="|location.href='@{/market/detail(id=${product.id})}'|"
             style="cursor:pointer">
            <div class="pc2-thumb gn" style="position:relative;overflow:hidden">
                <div class="pbdg">
                    <span class="pbdg-t pbdg-new">New</span>
                    <span class="pbdg-t pbdg-soon" th:if="${product.soonExpired}">⏰ 기한임박</span>
                </div>
                <div class="plk" onclick="event.stopPropagation();toggleW(this)">🤍</div>
                <img th:if="${product.thumbnailUrl != null and !product.thumbnailUrl.isEmpty()}"
                     th:src="${product.thumbnailUrl}"
                     alt="상품 이미지"
                     style="width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0;border-radius:inherit"/>
                <span th:unless="${product.thumbnailUrl != null and !product.thumbnailUrl.isEmpty()}">🥔</span>
            </div>
            <div class="pc2-body">
                <div class="pc2-farm" th:text="${product.origin}"></div>
                <div class="pc2-nm" th:text="${product.name}"></div>
                <div class="pc2-pr">
                    <span class="pc2-disc"
                          th:if="${product.discountPrice != null}"
                          th:with="rate=${(product.price - product.discountPrice) * 100 / product.price}"
                          th:text="'-' + ${#numbers.formatInteger(rate, 1, 'DEFAULT')} + '%'"></span>
                    <span class="pc2-price"
                          th:if="${product.discountPrice != null}"
                          th:text="${#numbers.formatInteger(product.discountPrice, 3, 'COMMA')} + '원'"></span>
                    <span class="pc2-price"
                          th:unless="${product.discountPrice != null}"
                          th:text="${#numbers.formatInteger(product.price, 3, 'COMMA')} + '원'"></span>
                    <span class="pc2-og"
                          th:if="${product.discountPrice != null}"
                          th:text="${#numbers.formatInteger(product.price, 3, 'COMMA')} + '원'"></span>
                </div>
                <div class="pc2-meta">
                    <span>📦 재고 <span th:text="${product.stockQuantity}"></span></span>
                    <span th:if="${product.isPickupAvailable}">· 픽업 가능</span>
                </div>
                <!-- 상세보기 버튼 -->
                <button class="btn-add"
                        th:onclick="|event.stopPropagation();location.href='@{/market/detail(id=${product.id})}'|">
                    🔍 상세보기
                </button>
            </div>
        </div>
    </div>

    <!-- 페이지네이션 -->
    <div class="mpg" style="margin-top:32px">
        <th:block th:if="${currentPage > 0}">
            <a th:href="@{/market(page=${currentPage - 1}, category=${category}, keyword=${keyword}, sort=${sort}, sellerId=${sellerId})}" class="mp-b">‹</a>
        </th:block>
        <th:block th:unless="${currentPage > 0}">
            <span class="mp-b" style="color:var(--muted);pointer-events:none;cursor:default">‹</span>
        </th:block>

        <a th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
           th:href="@{/market(page=${i}, category=${category}, keyword=${keyword}, sort=${sort}, sellerId=${sellerId})}"
           th:text="${i + 1}"
           th:class="${i == currentPage} ? 'mp-b on' : 'mp-b'"></a>

        <th:block th:if="${currentPage + 1 < totalPages}">
            <a th:href="@{/market(page=${currentPage + 1}, category=${category}, keyword=${keyword}, sort=${sort}, sellerId=${sellerId})}" class="mp-b">›</a>
        </th:block>
        <th:block th:unless="${currentPage + 1 < totalPages}">
            <span class="mp-b" style="color:var(--muted);pointer-events:none;cursor:default">›</span>
        </th:block>
    </div>
</div>

<!-- ======= 탭 1: AI 추천 ======= -->
<div id="mkt-content-1" style="display:none;padding:28px 5%;max-width:1240px;margin:0 auto">
    <div style="background:linear-gradient(135deg,var(--gp),#f0fce8);border:1.5px solid var(--gl);border-radius:16px;padding:20px 24px;margin-bottom:22px;display:flex;align-items:center;gap:16px">
        <div style="width:44px;height:44px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0">🤖</div>
        <div>
            <div style="font-family:Gaegu,cursive;font-size:1rem;font-weight:700;color:var(--green);margin-bottom:3px">AI 상품 추천</div>
            <div style="font-size:.78rem;color:var(--mid)">구매 이력 기반 추천 상품과 AI 추천 이유를 보여드려요</div>
        </div>
    </div>
    <div id="aiRecommendationGrid" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px">
        <div style="grid-column:1/-1;text-align:center;color:var(--muted);font-size:.82rem;padding:26px 0">AI 추천 상품을 불러오는 중...</div>
    </div>
</div>

<div th:replace="footer :: footer"></div>

<script src="/js/product/product.js"></script>
<script src="/js/app.js"></script>
<script>
    // ===== 추천 API 공통 =====
    var aiRecommendationsLoaded = false;
    var popularRecommendationsLoaded = false;

    function getRecommendationToken() {
        return localStorage.getItem('token') || sessionStorage.getItem('token') || '';
    }

    function getLoginUserId() {
        var storedUserId = localStorage.getItem('userId')
            || sessionStorage.getItem('userId')
            || localStorage.getItem('id')
            || sessionStorage.getItem('id');

        if (storedUserId && !isNaN(Number(storedUserId))) {
            return Number(storedUserId);
        }

        var token = getRecommendationToken();
        if (!token || token.split('.').length < 2) {
            return null;
        }

        try {
            var payload = JSON.parse(atob(token.split('.')[1]));
            var tokenUserId = payload.userId || payload.id || payload.memberId || payload.user_id;
            if (tokenUserId && !isNaN(Number(tokenUserId))) {
                return Number(tokenUserId);
            }
        } catch (e) {
            return null;
        }

        return null;
    }

    function getOrCreateRecommendationSessionId() {
        var sessionId = localStorage.getItem('recommendationSessionId')
            || sessionStorage.getItem('recommendationSessionId');

        if (!sessionId) {
            sessionId = 'mkt-' + Date.now() + '-' + Math.random().toString(36).substring(2, 10);
            localStorage.setItem('recommendationSessionId', sessionId);
        }

        return sessionId;
    }

    function buildRecommendationTarget() {
        var userId = getLoginUserId();
        if (userId) {
            return {
                query: '?userId=' + encodeURIComponent(userId),
                body: { userId: userId, sessionId: null }
            };
        }

        var sessionId = getOrCreateRecommendationSessionId();
        return {
            query: '?sessionId=' + encodeURIComponent(sessionId),
            body: { userId: null, sessionId: sessionId }
        };
    }

    function fetchRecommendationJson(url, options) {
        options = options || {};
        options.headers = options.headers || {};
        options.headers['Accept'] = 'application/json';

        var token = getRecommendationToken();
        if (token) {
            options.headers['Authorization'] = 'Bearer ' + token;
        }

        return fetch(url, options).then(function(response) {
            if (!response.ok) {
                throw new Error('추천 API 호출 실패: ' + response.status);
            }
            return response.json();
        });
    }

    function escapeHtml(value) {
        return String(value == null ? '' : value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function getRecommendationEmoji(category) {
        if (category === '과일') return '🍎';
        if (category === '곡류') return '🌾';
        if (category === '버섯') return '🍄';
        if (category === '뿌리채소') return '🥕';
        if (category === '채소') return '🥦';
        return '🌿';
    }

    function renderAiRecommendations(items) {
        var grid = document.getElementById('aiRecommendationGrid');
        if (!grid) return;

        if (!items || items.length === 0) {
            grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--muted);font-size:.82rem;padding:26px 0">아직 추천 상품이 없습니다.</div>';
            return;
        }

        grid.innerHTML = items.map(function(item) {
            var detailUrl = '/market/detail?id=' + encodeURIComponent(item.productId);
            var thumb = item.thumbnailUrl
                ? '<img src="' + escapeHtml(item.thumbnailUrl) + '" alt="상품 이미지" style="width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0;border-radius:inherit"/>'
                : '<span>' + getRecommendationEmoji(item.productCategory) + '</span>';

            var reason = item.reason || '구매 이력을 바탕으로 추천된 상품이에요.';

            return ''
                + '<div class="pc2" onclick="location.href=\'' + detailUrl + '\'" style="cursor:pointer;display:flex;flex-direction:column;min-height:420px">'
                + '  <div class="pc2-thumb gn" style="position:relative;overflow:hidden;height:180px;flex-shrink:0">'
                + '    <div class="pbdg"><span class="pbdg-t pbdg-new">AI픽</span></div>'
                + '    <div class="plk" onclick="event.stopPropagation();toggleW(this)">🤍</div>'
                +      thumb
                + '  </div>'
                + '  <div class="pc2-body" style="display:flex;flex-direction:column;flex:1">'
                + '    <div class="pc2-farm">' + escapeHtml(item.productCategory || '추천 상품') + '</div>'
                + '    <div class="pc2-nm">' + escapeHtml(item.productName || '상품명 없음') + '</div>'
                +      renderRecommendationPriceHtml(item)
                + '    <button class="btn-add" onclick="event.stopPropagation();location.href=\'' + detailUrl + '\'">🔍 상세보기</button>'
                + '    <div onclick="event.stopPropagation()" style="margin-top:12px;background:#fff;border-top:1px dashed var(--sand);padding-top:10px;font-size:.74rem;color:var(--mid);line-height:1.55">'
                + '      <div style="font-weight:700;color:var(--green);font-family:Gaegu,cursive;font-size:.88rem;margin-bottom:3px">🤖 이 상품을 추천한 이유</div>'
                + '      <div>' + escapeHtml(reason) + '</div>'
                + '    </div>'
                + '  </div>'
                + '</div>';
        }).join('');
    }

    function renderRecommendationPriceHtml(item) {
        var price = Number(item.productDiscountPrice || item.discountPrice || item.discountedPrice || item.productPrice || item.price || 0);
        var originalPrice = Number(item.productPrice || item.originalPrice || item.price || 0);
        var hasDiscount = originalPrice > 0 && price > 0 && originalPrice > price;

        if (!price) {
            return '<div class="pc2-pr" style="margin-top:7px"><span class="pc2-price">가격 확인</span></div>';
        }

        var discountRate = hasDiscount ? Math.round((1 - price / originalPrice) * 100) : 0;

        return ''
            + '<div class="pc2-pr" style="margin-top:7px">'
            + (hasDiscount ? '<span class="pc2-disc">-' + discountRate + '%</span>' : '')
            + '<span class="pc2-price">' + formatRecommendationPrice(price) + '원</span>'
            + (hasDiscount ? '<span class="pc2-og">' + formatRecommendationPrice(originalPrice) + '원</span>' : '')
            + '</div>';
    }

    function formatRecommendationPrice(value) {
        return Number(value || 0).toLocaleString('ko-KR');
    }

    function renderPopularRecommendations(items) {
        var list = document.getElementById('popularRecommendationList');
        if (!list) return;

        if (!items || items.length === 0) {
            list.innerHTML = '<div style="font-size:.78rem;color:var(--muted);padding:14px 0;text-align:center">인기상품이 없습니다.</div>';
            return;
        }

        var visibleItems = items.slice(0, 6);

        list.innerHTML = visibleItems.map(function(item, index) {
            var detailUrl = '/market/detail?id=' + encodeURIComponent(item.productId);
            var image = item.thumbnailUrl
                ? '<img src="' + escapeHtml(item.thumbnailUrl) + '" alt="상품 이미지" style="width:100%;height:100%;object-fit:cover;border-radius:10px"/>'
                : getRecommendationEmoji(item.productCategory);
            var border = index === visibleItems.length - 1 ? '' : 'border-bottom:1px solid var(--sand);';

            return ''
                + '<div onclick="location.href=\'' + detailUrl + '\'" style="display:flex;gap:12px;padding:12px 0;' + border + 'cursor:pointer;align-items:center">'
                + '  <div style="width:54px;height:54px;border-radius:11px;background:linear-gradient(145deg,var(--gp),var(--gl));display:flex;align-items:center;justify-content:center;font-size:1.35rem;flex-shrink:0;overflow:hidden">' + image + '</div>'
                + '  <div style="flex:1;min-width:0">'
                + '    <div style="font-size:.72rem;color:var(--green);font-weight:700;margin-bottom:2px">인기상품 추천</div>'
                + '    <div style="font-size:.86rem;font-weight:700;color:var(--dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + escapeHtml(item.productName || '상품명 없음') + '</div>'
                +      renderPopularRecommendationPriceHtml(item)
                + '  </div>'
                + '  <div style="font-size:.82rem;color:var(--amber);font-weight:800;flex-shrink:0">#' + escapeHtml(item.rankOrder || index + 1) + '</div>'
                + '</div>';
        }).join('');
    }

    function renderPopularRecommendationPriceHtml(item) {
        var price = Number(item.productDiscountPrice || item.discountPrice || item.discountedPrice || item.productPrice || item.price || 0);
        var originalPrice = Number(item.productPrice || item.originalPrice || item.price || 0);
        var hasDiscount = originalPrice > 0 && price > 0 && originalPrice > price;

        if (!price) {
            return '<div style="font-size:.78rem;color:var(--amber);font-weight:800;margin-top:4px">가격 확인</div>';
        }

        var discountRate = hasDiscount ? Math.round((1 - price / originalPrice) * 100) : 0;

        return ''
            + '<div style="display:flex;align-items:baseline;gap:6px;margin-top:4px;flex-wrap:wrap">'
            + (hasDiscount ? '<span style="font-size:.72rem;color:var(--amber);font-weight:900">-' + discountRate + '%</span>' : '')
            + '<span style="font-size:.84rem;color:var(--amber);font-weight:900">' + formatRecommendationPrice(price) + '원</span>'
            + (hasDiscount ? '<span style="font-size:.68rem;color:var(--muted);text-decoration:line-through">' + formatRecommendationPrice(originalPrice) + '원</span>' : '')
            + '</div>';
    }

    function loadAiRecommendations() {
        var grid = document.getElementById('aiRecommendationGrid');
        if (!grid) return;

        if (aiRecommendationsLoaded) return;
        aiRecommendationsLoaded = true;
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--muted);font-size:.82rem;padding:26px 0">AI 추천 상품을 불러오는 중...</div>';

        var target = buildRecommendationTarget();

        fetchRecommendationJson('/api/ai/recommendations/ai' + target.query)
            .then(function(items) {
                if (items && items.length > 0) return items;

                return fetchRecommendationJson('/api/ai/recommendations/generate/ai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(target.body)
                });
            })
            .then(renderAiRecommendations)
            .catch(function(error) {
                aiRecommendationsLoaded = false;
                grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--muted);font-size:.82rem;padding:26px 0">AI 추천을 불러오지 못했습니다.</div>';
                console.error(error);
            });
    }

    function loadPopularRecommendations() {
        var list = document.getElementById('popularRecommendationList');
        if (!list) return;

        if (popularRecommendationsLoaded) return;
        popularRecommendationsLoaded = true;
        list.innerHTML = '<div style="font-size:.74rem;color:var(--muted);padding:12px 0;text-align:center">인기상품을 불러오는 중...</div>';

        fetchRecommendationJson('/api/ai/recommendations/popular')
            .then(function(items) {
                if (items && items.length > 0) return items;

                return fetchRecommendationJson('/api/ai/recommendations/generate/popular', {
                    method: 'POST'
                });
            })
            .then(renderPopularRecommendations)
            .catch(function(error) {
                popularRecommendationsLoaded = false;
                list.innerHTML = '<div style="font-size:.74rem;color:var(--muted);padding:12px 0;text-align:center">인기상품을 불러오지 못했습니다.</div>';
                console.error(error);
            });
    }

    // ===== 탭 전환 =====
    function switchMktTab(n) {
        for (var i = 0; i < 2; i++) {
            var t = document.getElementById('mkt-tab-' + i);
            var c = document.getElementById('mkt-content-' + i);
            if (t) { t.style.borderBottom = 'none'; t.style.color = 'var(--muted)'; t.style.fontWeight = '400'; }
            if (c) c.style.display = 'none';
        }

        var el = document.getElementById('mkt-tab-' + n);
        var ct = document.getElementById('mkt-content-' + n);
        var filterBar = document.getElementById('mktFilterBar');

        if (el) { el.style.borderBottom = '2px solid var(--green)'; el.style.color = 'var(--dark)'; el.style.fontWeight = '500'; }
        if (ct) ct.style.display = 'block';
        if (filterBar) filterBar.style.display = n === 0 ? 'flex' : 'none';

        if (n === 1) {
            loadAiRecommendations();
        }
    }

    // ===== 정렬 =====
    function setSort(type) {
        ['popular','discount','price','newest'].forEach(function(t) {
            var btn = document.getElementById('sort-btn-' + t);
            if (btn) { btn.style.fontWeight = '400'; btn.style.color = 'var(--muted)'; btn.style.background = ''; }
        });

        var active = document.getElementById('sort-btn-' + type);
        if (active) { active.style.fontWeight = '700'; active.style.color = 'var(--green)'; active.style.background = 'var(--gp)'; }

        var url = new URL(window.location.href);
        url.searchParams.set('sort', type);
        url.searchParams.set('page', '0');
        window.location.href = url.toString();
    }

    // 페이지 로드 시 현재 sort 파라미터로 버튼 활성화
    (function() {
        var url = new URL(window.location.href);
        var sort = url.searchParams.get('sort') || 'popular';
        ['popular','discount','price','newest'].forEach(function(t) {
            var b = document.getElementById('sort-btn-' + t);
            if (!b) return;
            if (t === sort) {
                b.style.fontWeight = '700';
                b.style.color = 'var(--green)';
                b.style.background = 'var(--gp)';
            } else {
                b.style.fontWeight = '400';
                b.style.color = 'var(--muted)';
                b.style.background = '';
            }
        });
    })();

    // ===== 인기상품추천 팝업 =====
    function openRecPopup() {
        var popup = document.getElementById('recPopup');
        if (!popup) return;

        popup.style.display = 'block';
        loadPopularRecommendations();
    }

    function closeRecPopup() {
        var popup = document.getElementById('recPopup');
        if (popup) popup.style.display = 'none';
    }

    (function initRecPopupDrag() {
        var popup = document.getElementById('recPopup');
        var header = document.getElementById('recPopupHeader');

        if (!popup || !header) {
            return;
        }

        var dragging = false;
        var offsetX = 0;
        var offsetY = 0;

        header.addEventListener('mousedown', function(event) {
            if (event.target && event.target.classList && event.target.classList.contains('rec-popup-close')) {
                return;
            }

            dragging = true;

            var rect = popup.getBoundingClientRect();
            offsetX = event.clientX - rect.left;
            offsetY = event.clientY - rect.top;

            popup.style.left = rect.left + 'px';
            popup.style.top = rect.top + 'px';
            popup.style.right = 'auto';
            popup.style.bottom = 'auto';

            document.body.style.userSelect = 'none';
        });

        document.addEventListener('mousemove', function(event) {
            if (!dragging) {
                return;
            }

            var maxLeft = window.innerWidth - popup.offsetWidth;
            var maxTop = window.innerHeight - popup.offsetHeight;

            var nextLeft = Math.min(Math.max(event.clientX - offsetX, 8), Math.max(maxLeft - 8, 8));
            var nextTop = Math.min(Math.max(event.clientY - offsetY, 8), Math.max(maxTop - 8, 8));

            popup.style.left = nextLeft + 'px';
            popup.style.top = nextTop + 'px';
        });

        document.addEventListener('mouseup', function() {
            dragging = false;
            document.body.style.userSelect = '';
        });
    })();
</script>
</body>
</html>
