<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>못난이 농작물</title>
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/product/market.css">
</head>
<body>

<div th:replace="nav :: nav"></div>

<!-- 마켓 헤더 -->
<div class="mkt-header">
    <div class="mkt-header-label">Market</div>
    <div class="mkt-header-title">못난이 마켓 🌿</div>

    <!-- 검색바 -->
    <div class="mkt-search-wrap">
        <select id="mktSearchType" class="mkt-search-select">
            <option value="all"    th:selected="${searchType == 'all'}">전체</option>
            <option value="name"   th:selected="${searchType == 'name'}">상품명</option>
            <option value="farm"   th:selected="${searchType == 'farm'}">원산지</option>
            <option value="region" th:selected="${searchType == 'region'}">농장 위치</option>
        </select>
        <div class="mkt-search-inner">
            <span class="mkt-search-icon">🔍</span>
            <input id="mktSearch" th:value="${keyword}" onkeydown="if(event.key==='Enter')doMktSearch()" placeholder="상품명, 농장명, 지역으로 검색..."/>
            <span id="mktSearchClear" onclick="clearMktSearch()">×</span>
        </div>
        <button onclick="doMktSearch()" class="mkt-search-btn">검색</button>
    </div>
    <!-- 카테고리 탭 (3개) -->
    <div class="mkt-tabs">
        <div id="mkt-tab-0" onclick="switchMktTab(0)" style="padding:12px 0;text-align:center;border-bottom:2px solid var(--green);font-size:.8rem;font-weight:500;color:var(--dark);cursor:pointer">전체 상품</div>
        <div id="mkt-tab-1" onclick="switchMktTab(1)" style="padding:12px 0;text-align:center;font-size:.8rem;color:var(--muted);cursor:pointer">AI 추천</div>
        <div id="mkt-tab-2" onclick="openRecPopup()" style="padding:12px 0;text-align:center;font-size:.8rem;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px">✨ 맞춤추천</div>
    </div>
</div>

<!-- 인기상품추천 팝업 -->
<div id="recPopup" style="display:none;position:fixed;bottom:100px;right:100px;width:420px;height:460px;min-width:320px;min-height:300px;max-width:90vw;max-height:82vh;background:#fff;border:1.5px solid var(--sand);border-radius:16px;box-shadow:0 12px 40px rgba(42,30,6,.16);z-index:9990;overflow:hidden;resize:both">
    <div id="recPopupHeader" style="background:linear-gradient(135deg,var(--green),#5A9A30);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;cursor:move;user-select:none">
        <div>
            <div style="font-size:1rem;font-weight:700;color:#fff;font-family:Gaegu,cursive">🔥 인기상품 추천</div>
            <div style="font-size:.76rem;color:rgba(255,255,255,.86);margin-top:3px;font-weight:600">주문수 · 찜수 · 리뷰수 · 평점 · 최신등록순 기반</div>
        </div>
        <span class="rec-popup-close" onclick="closeRecPopup()" style="cursor:pointer;color:rgba(255,255,255,.85);font-size:1.2rem;line-height:1">✕</span>
    </div>
    <div style="padding:14px 16px;max-height:calc(100% - 112px);overflow:auto">
        <div style="font-size:.86rem;font-weight:700;color:var(--amber);margin-bottom:12px;display:flex;align-items:center;gap:6px">🔥 지금 인기 있는 상품</div>
        <div id="popularRecommendationList" style="min-height:80px">
            <div style="font-size:.74rem;color:var(--muted);padding:12px 0;text-align:center">인기상품을 불러오는 중...</div>
        </div>
    </div>
    <div style="padding:0 14px 12px">
        <button onclick="location.href='/market';closeRecPopup();" style="width:100%;background:var(--green);color:#fff;border:none;border-radius:9px;padding:9px;font-size:.82rem;font-weight:600;cursor:pointer">전체 추천 상품 보기 →</button>
    </div>
</div>

<!-- 필터 -->
<div class="mkt-bar" style="display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none">
    <div class="mf" th:classappend="${category == '' or category == '전체'} ? ' on'" onclick="mktF(this)">전체</div>
    <div class="mf" th:classappend="${category == '채소'} ? ' on'" onclick="mktF(this)">채소 🥦</div>
    <div class="mf" th:classappend="${category == '과일'} ? ' on'" onclick="mktF(this)">과일 🍎</div>
    <div class="mf" th:classappend="${category == '곡류'} ? ' on'" onclick="mktF(this)">곡류 🌾</div>
    <div class="mf" th:classappend="${category == '버섯'} ? ' on'" onclick="mktF(this)">버섯 🍄</div>
    <div class="mf" th:classappend="${category == '뿌리채소'} ? ' on'" onclick="mktF(this)">뿌리채소 🥕</div>
    <div class="mf" th:classappend="${category == '기한임박'} ? ' on'" onclick="mktF(this)" style="background:#fff5ef;color:#D05018;border-color:#f5c8a8">⏰ 기한임박</div>
</div>

<!-- ======= 탭 0: 전체 상품 ======= -->
<div id="mkt-content-0" style="padding:22px 5%">
    <div class="mkt-list-header">
        <span class="pgrid-count">총 <strong style="color:var(--dark)" th:text="${totalElements}"></strong>개 상품</span>
        <!-- 정렬 버튼 -->
        <div style="display:flex;align-items:center;gap:8px">
            <div class="mkt-sort-group">
                <div id="sort-btn-popular"  class="mkt-sort-btn" onclick="setSort('popular')">인기순</div>
                <div id="sort-btn-discount" class="mkt-sort-btn"        onclick="setSort('discount')">할인율순</div>
                <div id="sort-btn-price"    class="mkt-sort-btn"        onclick="setSort('price')">가격순</div>
                <div id="sort-btn-newest"   class="mkt-sort-btn"        onclick="setSort('newest')">최신순</div>
            </div>
            <button id="registerBtn"
                    style="display:none;font-size:.90rem;cursor:pointer;padding:5px 11px;border:1px solid var(--green);background:var(--green);color:#fff;border-radius:6px;font-weight:700"
                    th:onclick="|location.href='@{/market/create}'|">
                + 상품등록
            </button>
            <button id="myProductsBtn"
                    style="display:none;font-size:.90rem;cursor:pointer;padding:5px 11px;border:1px solid var(--green);background:#fff;color:var(--green);border-radius:6px;font-weight:700"
                    onclick="toggleMyProducts()">
                내 상품
            </button>
        </div>
    </div>

    <!-- 상품 그리드 -->
    <div class="pgrid" id="productGrid">
        <div class="pc2"
             th:each="product : ${products}"
             th:data-category="${product.category}"
             th:data-price="${product.discountPrice != null ? product.discountPrice : product.price}"
             th:data-discount="${product.discountPrice != null ? (product.price - product.discountPrice) * 100 / product.price : 0}"
             th:data-id="${product.id}"
             th:onclick="|location.href='@{/market/detail(id=${product.id})}'|"
             style="cursor:pointer">
            <div class="pc2-thumb gn" style="position:relative;overflow:hidden">
                <div class="pbdg">
                    <span class="pbdg-t pbdg-new">New</span>
                    <span class="pbdg-t pbdg-soon" th:if="${product.soonExpired}">⏰ 기한임박</span>
                </div>
                <div class="plk" onclick="event.stopPropagation();toggleW(this)">🤍</div>
                <img th:if="${product.thumbnailUrl != null and !product.thumbnailUrl.isEmpty()}"
                     th:src="${product.thumbnailUrl}"
                     alt="상품 이미지"
                     style="width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0;border-radius:inherit"/>
                <span th:unless="${product.thumbnailUrl != null and !product.thumbnailUrl.isEmpty()}">🥔</span>
            </div>
            <div class="pc2-body">
                <div class="pc2-farm" th:text="${product.origin}"></div>
                <div class="pc2-nm" th:text="${product.name}"></div>
                <div class="pc2-pr">
                    <span class="pc2-disc"
                          th:if="${product.discountPrice != null}"
                          th:with="rate=${(product.price - product.discountPrice) * 100 / product.price}"
                          th:text="'-' + ${#numbers.formatInteger(rate, 1, 'DEFAULT')} + '%'"></span>
                    <span class="pc2-price"
                          th:if="${product.discountPrice != null}"
                          th:text="${#numbers.formatInteger(product.discountPrice, 3, 'COMMA')} + '원'"></span>
                    <span class="pc2-price"
                          th:unless="${product.discountPrice != null}"
                          th:text="${#numbers.formatInteger(product.price, 3, 'COMMA')} + '원'"></span>
                    <span class="pc2-og"
                          th:if="${product.discountPrice != null}"
                          th:text="${#numbers.formatInteger(product.price, 3, 'COMMA')} + '원'"></span>
                </div>
                <div class="pc2-meta">
                    <span>📦 재고 <span th:text="${product.stockQuantity}"></span></span>
                    <span th:if="${product.isPickupAvailable}">· 픽업 가능</span>
                </div>
                <!-- 상세보기 버튼 -->
                <button class="btn-add"
                        th:onclick="|event.stopPropagation();location.href='@{/market/detail(id=${product.id})}'|">
                    🔍 상세보기
                </button>
            </div>
        </div>
    </div>

    <!-- 페이지네이션 -->
    <div class="mpg" style="margin-top:32px">
        <th:block th:if="${currentPage > 0}">
            <a th:href="@{/market(page=${currentPage - 1}, category=${category}, keyword=${keyword}, sort=${sort}, sellerId=${sellerId})}" class="mp-b">‹</a>
        </th:block>
        <th:block th:unless="${currentPage > 0}">
            <span class="mp-b" style="color:var(--muted);pointer-events:none;cursor:default">‹</span>
        </th:block>

        <th:block th:if="${totalPages > 0}">
            <a th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
               th:href="@{/market(page=${i}, category=${category}, keyword=${keyword}, sort=${sort}, sellerId=${sellerId})}"
               th:text="${i + 1}"
               th:class="${i == currentPage} ? 'mp-b on' : 'mp-b'"></a>
        </th:block>

        <th:block th:if="${currentPage + 1 < totalPages}">
            <a th:href="@{/market(page=${currentPage + 1}, category=${category}, keyword=${keyword}, sort=${sort}, sellerId=${sellerId})}" class="mp-b">›</a>
        </th:block>
        <th:block th:unless="${currentPage + 1 < totalPages}">
            <span class="mp-b" style="color:var(--muted);pointer-events:none;cursor:default">›</span>
        </th:block>
    </div>
</div>

<!-- ======= 탭 1: AI 추천 ======= -->
<div id="mkt-content-1" style="display:none;padding:28px 5%;max-width:1240px;margin:0 auto">
    <div style="background:linear-gradient(135deg,var(--gp),#f0fce8);border:1.5px solid var(--gl);border-radius:16px;padding:20px 24px;margin-bottom:22px;display:flex;align-items:center;gap:16px">
        <div style="width:44px;height:44px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0">🤖</div>
        <div>
            <div style="font-family:Gaegu,cursive;font-size:1rem;font-weight:700;color:var(--green);margin-bottom:3px">AI 상품 추천</div>
            <div style="font-size:.78rem;color:var(--mid)">구매 이력 기반 추천 상품과 AI 추천 이유를 보여드려요</div>
        </div>
    </div>
    <div id="aiRecommendationGrid" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px">
        <div style="grid-column:1/-1;text-align:center;color:var(--muted);font-size:.82rem;padding:26px 0">AI 추천 상품을 불러오는 중...</div>
    </div>
</div>

<div th:replace="footer :: footer"></div>

<script src="/js/product/product.js"></script>
<script src="/js/app.js"></script>
<script src="/js/product/market.js"></script>

</body>
</html>
