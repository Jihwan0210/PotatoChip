<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 등록</title>

    <link rel="stylesheet" href="/css/product/create.css">

</head>

<body>

<div class="create-wrap">

    <div class="create-top">

        <div class="create-badge">
            🌾 판매자 전용
        </div>

        <div class="create-title">
            못난이 농산물 상품 등록
        </div>

        <div class="create-sub">
            신선한 농산물을 등록하고 소비자들에게 직접 판매해보세요.
        </div>

    </div>

    <div class="create-grid">

        <!-- 왼쪽 등록 폼 -->
        <div class="create-card">

            <form th:action="@{/market/create}"
                  method="post"
                  enctype="multipart/form-data">

                <div class="form-group">
                    <label>상품명</label>

                    <input type="text"
                           name="name"
                           class="form-input"
                           placeholder="예: 못난이 감자 3kg"
                           required>
                </div>

                <div class="form-group">
                    <label>카테고리</label>

                    <select name="category"
                            class="form-select"
                            required>

                        <option value="">카테고리 선택</option>
                        <option value="채소">채소</option>
                        <option value="과일">과일</option>
                        <option value="곡류">곡류</option>
                        <option value="버섯">버섯</option>

                    </select>
                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label>판매 가격</label>

                        <input type="number"
                               name="price"
                               class="form-input"
                               placeholder="12000"
                               oninput="updateDiscountPreview()"
                               required>
                    </div>

                    <div class="form-group">
                        <label>할인율 (%)</label>
                        <input type="number"
                               id="discountRateInput"
                               class="form-input"
                               min="0" max="99"
                               placeholder="예: 20"
                               oninput="this.value = Math.min(Math.max(this.value, 0), 99); updateDiscountPreview()">
                        <input type="hidden" name="discountPrice" id="discountPriceHidden">
                        <div style="font-size:.72rem;color:var(--muted);margin-top:4px">※ 할인율은 99%까지 적용됩니다</div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>할인 시작일</label>
                            <input type="date"
                                   name="discountStartAt"
                                   class="form-input">
                        </div>
                        <div class="form-group">
                            <label>할인 종료일</label>
                            <input type="date"
                                   name="discountEndAt"
                                   class="form-input">
                        </div>
                    </div>
                    <div id="discountDateHint" style="font-size:.75rem;color:var(--muted);margin-top:4px;display:block">
                        💡 할인율 입력 시 날짜를 설정할 수 있습니다.
                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label>원산지</label>

                        <input type="text"
                               name="origin"
                               class="form-input"
                               placeholder="예: 강원 홍천"
                               required>
                    </div>

                    <div class="form-group">
                        <label>재고 수량</label>

                        <input type="number"
                               name="stockQuantity"
                               class="form-input"
                               placeholder="100"
                               required>
                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label>유통기한</label>

                        <input type="date"
                               name="expiryDate"
                               class="form-input"
                               required>
                    </div>

                    <div class="form-group">
                        <label>픽업 가능 여부</label>

                        <select name="isPickupAvailable"
                                class="form-select"
                                id="pickupSelect">

                            <option value="true">가능</option>
                            <option value="false">불가능</option>

                        </select>
                    </div>

                </div>

                <div id="pickupDetail" style="display:none;">

                    <div class="form-group">
                        <label>픽업 주소</label>
                        <div style="display:flex; gap:8px;">
                            <input type="text"
                                   id="pickupAddressInput"
                                   name="address"
                                   class="form-input"
                                   placeholder="주소 검색 버튼을 눌러주세요"
                                   readonly>
                            <button type="button"
                                    class="btn-cancel"
                                    onclick="searchAddress()">
                                주소 검색
                            </button>
                        </div>
                    </div>

                    <div id="kakaoMap" style="width:100%; height:250px; border-radius:12px; margin-bottom:12px;"></div>

                    <input type="hidden" id="latitudeInput" name="latitude">
                    <input type="hidden" id="longitudeInput" name="longitude">

                    <div class="form-group">
                        <label>운영 시간</label>
                        <input type="text"
                               name="operatingHours"
                               class="form-input"
                               placeholder="예: 평일 09:00 ~ 18:00">
                    </div>

                </div>

                <div class="form-group">

                    <label>상품 설명</label>

                    <textarea name="description"
                              class="form-textarea"
                              placeholder="상품 특징, 배송 정보 등을 입력해주세요."></textarea>

                </div>

                <div class="form-group">

                    <label>대표 이미지</label>

                    <!-- ✅ AI 토글 -->
                    <div style="display:flex; align-items:center; justify-content:space-between;
                                background:#f0fdf4; border:1.5px solid #bbf7d0; border-radius:10px;
                                padding:10px 14px; margin-bottom:10px;">
                        <span style="font-size:.85rem; font-weight:600; color:#16a34a;">
                            🤖 AI 사진 분석으로 상품명 · 설명 자동완성
                        </span>
                        <label style="position:relative; width:42px; height:24px; cursor:pointer; display:inline-block;">
                            <input type="checkbox" id="aiToggle" checked style="opacity:0; width:0; height:0;">
                            <span id="toggleSlider" style="position:absolute; inset:0; background:#4caf50; border-radius:99px; transition:.2s;">
                                <span id="toggleThumb" style="position:absolute; left:3px; top:3px; width:18px; height:18px;
                                      background:#fff; border-radius:50%; transition:.2s; display:block; transform:translateX(18px);"></span>
                            </span>
                        </label>
                    </div>

                    <label class="thumb-upload">

                        <div class="thumb-icon">
                            📦
                        </div>

                        <div class="thumb-title">
                            이미지 업로드
                        </div>

                        <div class="thumb-sub">
                            JPG, PNG 파일 업로드 가능
                        </div>

                        <input type="file"
                               name="thumbnailFile"
                               accept="image/*"
                               hidden>

                    </label>

                    <div id="aiAnalyzeHint" style="font-size:.75rem;color:var(--green);margin-top:6px"></div>

                    <div class="form-group">

                        <label>상세 이미지</label>

                        <label class="thumb-upload">

                            <div class="thumb-icon">
                                🖼️
                            </div>

                            <div class="thumb-title">
                                상세 이미지 업로드
                            </div>

                            <div class="thumb-sub">
                                JPG, PNG 파일 여러 장 업로드 가능
                            </div>

                            <!-- ✅ id 추가 -->
                            <input type="file"
                                   name="imageFiles"
                                   id="detailImageInput"
                                   accept="image/*"
                                   multiple
                                   hidden>

                        </label>

                        <!-- ✅ 상세이미지 프리뷰 그리드 -->
                        <div id="detailPreviewGrid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(90px,1fr));
                             gap:8px; margin-top:10px;"></div>

                    </div>

                </div>

                <div class="submit-row">

                    <button type="button"
                            class="btn-cancel"
                            onclick="history.back()">

                        취소

                    </button>
                    <input type="hidden" name="sellerEmail" id="sellerEmailInput"/>
                    <script>
                        document.getElementById('sellerEmailInput').value =
                            sessionStorage.getItem('email') || localStorage.getItem('email');
                    </script>
                    <button type="submit"
                            class="btn-submit2">

                        상품 등록하기

                    </button>

                </div>

            </form>

        </div>

        <!-- ✅ 오른쪽 미리보기 - sticky 추가 -->
        <div class="create-card preview-card" style="position:sticky; top:24px;">

            <div class="preview-top">
                <img id="thumbPreview" style="display:none;width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0;border-radius:0"/>
                🥔

                <div class="preview-badge">
                    미리보기
                </div>

            </div>

            <div class="preview-body">

                <div class="preview-origin">
                    강원 홍천 · 감자 농가
                </div>

                <div class="preview-name">
                    못난이 감자 3kg
                </div>

                <div class="preview-price">

                    <div class="preview-discount">
                        -30%
                    </div>

                    <div class="preview-main">
                        7,000원
                    </div>

                </div>

                <div class="preview-desc">
                    크기는 조금 달라도 맛과 신선함은 그대로인
                    친환경 못난이 감자 상품입니다.
                </div>

                <div class="preview-meta">

                    <div class="preview-chip">
                        🥔 채소
                    </div>

                    <div class="preview-chip">
                        📦 재고 100개
                    </div>

                    <div class="preview-chip">
                        🚚 픽업 가능
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script>
    // 할인 미리보기
    function updateDiscountPreview() {
        const price = Number(document.querySelector('[name=price]').value);
        const rate  = Number(document.getElementById('discountRateInput').value);
        const previewMain     = document.querySelector('.preview-main');
        const previewDiscount = document.querySelector('.preview-discount');
        const hiddenDiscount  = document.getElementById('discountPriceHidden');
        if (!price) return;
        if (rate > 0 && rate <= 99) {
            const discounted = Math.round(price * (1 - rate / 100));
            previewDiscount.textContent = `-${rate}%`;
            previewMain.textContent     = discounted.toLocaleString() + '원';
            hiddenDiscount.value        = discounted;
        } else {
            previewDiscount.textContent = '-30%';
            previewMain.textContent     = price.toLocaleString() + '원';
            hiddenDiscount.value        = '';
        }
    }

    // ✅ AI 토글 슬라이더 동기화
    const aiToggle = document.getElementById('aiToggle');
    const slider   = document.getElementById('toggleSlider');
    const thumb    = document.getElementById('toggleThumb');

    function syncToggleStyle() {
        if (aiToggle.checked) {
            slider.style.background = '#4caf50';
            thumb.style.transform   = 'translateX(18px)';
        } else {
            slider.style.background = '#ccc';
            thumb.style.transform   = 'translateX(0)';
        }
    }

    aiToggle.addEventListener('change', function () {
        syncToggleStyle();
        const hint = document.getElementById('aiAnalyzeHint');
        if (!this.checked) {
            hint.textContent = '🔕 AI 자동완성이 꺼져 있어요. 직접 입력해주세요.';
        } else {
            hint.textContent = '';
        }
    });

    // ✅ 대표이미지 - AI 분석 토글 연동
    document.querySelector('input[name="thumbnailFile"]').addEventListener('change', function (e) {
        const file = e.target.files[0];
        if (!file) return;
        if (aiToggle.checked) analyzeProductImage(file);
    });

    function analyzeProductImage(file) {
        const nameInput = document.querySelector('input[name="name"]');
        const descInput = document.querySelector('textarea[name="description"]');
        const hint = document.getElementById('aiAnalyzeHint');
        hint.textContent = '🤖 AI가 사진 보고 분석 중이에요...';
        const formData = new FormData();
        formData.append('image', file);
        fetch('/market/api/analyze-image', { method: 'POST', body: formData })
            .then(function (res) { return res.json(); })
            .then(function (data) {
                if (data.name) {
                    nameInput.value = data.name;
                    nameInput.dispatchEvent(new Event('input'));
                }
                if (data.description) {
                    descInput.value = data.description;
                    descInput.dispatchEvent(new Event('input'));
                }
                hint.textContent = '✅ AI가 채워준 거예요, 꼭 확인하고 수정해주세요!';
            })
            .catch(function () {
                hint.textContent = '⚠️ 분석 실패했어요, 직접 입력해주세요.';
            });
    }

    // ✅ 상세이미지 프리뷰
    let detailFiles = [];

    document.getElementById('detailImageInput').addEventListener('change', function (e) {
        Array.from(e.target.files).forEach(function (file) {
            const idx = detailFiles.length;
            detailFiles.push(file);
            const reader = new FileReader();
            reader.onload = function (ev) {
                const grid = document.getElementById('detailPreviewGrid');
                const div  = document.createElement('div');
                div.dataset.index = idx;
                div.style.cssText = 'position:relative; aspect-ratio:1; border-radius:8px; overflow:hidden; border:1.5px solid #e0e0e0;';
                div.innerHTML =
                    '<img src="' + ev.target.result + '" style="width:100%;height:100%;object-fit:cover;">' +
                    '<button type="button" onclick="removeDetail(this,' + idx + ')" ' +
                    'style="position:absolute;top:3px;right:3px;background:rgba(0,0,0,.55);' +
                    'color:#fff;border:none;border-radius:50%;width:20px;height:20px;' +
                    'font-size:.7rem;cursor:pointer;">✕</button>';
                grid.appendChild(div);
            };
            reader.readAsDataURL(file);
        });
        this.value = '';
    });

    function removeDetail(btn, idx) {
        detailFiles[idx] = null;
        btn.closest('[data-index]').remove();
        const dt = new DataTransfer();
        detailFiles.filter(function(f){ return f !== null; }).forEach(function(f){ dt.items.add(f); });
        document.getElementById('detailImageInput').files = dt.files;
    }
</script>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=050995b6d6375c46a4dee1a7b3e53aa4&libraries=services"></script>
<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script src="/js/product/create.js"></script>
</body>
</html>
