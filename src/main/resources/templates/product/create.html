<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 등록</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .create-wrap{
            min-height:100vh;
            background:var(--beige2);
            padding:110px 7% 80px;
        }
        .create-top{
            margin-bottom:30px;
        }
        .create-badge{
            display:inline-flex;
            align-items:center;
            gap:6px;
            background:var(--gp);
            color:var(--green);
            padding:6px 14px;
            border-radius:999px;
            font-size:.74rem;
            font-weight:700;
            margin-bottom:14px;
        }
        .create-title{
            font-family:'Gaegu',cursive;
            font-size:2.5rem;
            color:var(--dark);
            font-weight:700;
            margin-bottom:10px;
        }
        .create-sub{
            font-size:.9rem;
            color:var(--mid);
            line-height:1.7;
        }
        .create-grid{
            display:grid;
            grid-template-columns:1.1fr .9fr;
            gap:24px;
            align-items:start;
        }
        .create-card{
            background:#fff;
            border:1.5px solid var(--beige);
            border-radius:24px;
            padding:28px;
            box-shadow:0 8px 30px rgba(42,30,6,.05);
        }
        .form-group{
            margin-bottom:18px;
        }
        .form-group label{
            display:block;
            margin-bottom:7px;
            font-size:.78rem;
            font-weight:700;
            color:var(--mid);
        }
        .form-input,
        .form-select,
        .form-textarea{
            width:100%;
            padding:13px 15px;
            border:1.5px solid var(--beige);
            border-radius:12px;
            background:#fff;
            font-family:inherit;
            font-size:.84rem;
            color:var(--dark);
            outline:none;
            transition:.2s;
        }
        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus{
            border-color:var(--green);
        }
        .form-textarea{
            resize:none;
            min-height:140px;
        }
        .form-row{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:14px;
        }
        .thumb-upload{
            height:240px;
            border:2px dashed var(--gl);
            border-radius:20px;
            background:var(--gp);
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            text-align:center;
            cursor:pointer;
            transition:.2s;
        }
        .thumb-upload:hover{
            border-color:var(--green);
            background:#f5fbe9;
        }
        .thumb-icon{
            font-size:3.5rem;
            margin-bottom:10px;
        }
        .thumb-title{
            font-size:.9rem;
            font-weight:700;
            color:var(--dark);
        }
        .thumb-sub{
            margin-top:5px;
            font-size:.72rem;
            color:var(--muted);
        }
        .submit-row{
            display:flex;
            justify-content:flex-end;
            gap:10px;
            margin-top:12px;
        }
        .btn-cancel{
            border:none;
            background:var(--beige);
            color:var(--mid);
            border-radius:12px;
            padding:13px 22px;
            font-weight:700;
            cursor:pointer;
        }
        .btn-submit2{
            border:none;
            background:var(--green);
            color:#fff;
            border-radius:12px;
            padding:13px 28px;
            font-weight:700;
            cursor:pointer;
            box-shadow:0 6px 18px rgba(123,191,69,.25);
            transition:.2s;
        }
        .btn-submit2:hover{
            background:#5d9f2e;
        }
        .preview-card{
            overflow:hidden;
            padding:0;
        }
        .preview-top{
            height:250px;
            background:linear-gradient(145deg,var(--gp),var(--gl));
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:5rem;
            position:relative;
        }
        .preview-badge{
            position:absolute;
            top:14px;
            left:14px;
            background:var(--green);
            color:#fff;
            font-size:.68rem;
            padding:4px 10px;
            border-radius:8px;
            font-weight:700;
        }
        .preview-body{
            padding:22px;
        }
        .preview-origin{
            font-size:.7rem;
            color:var(--muted);
            margin-bottom:5px;
        }
        .preview-name{
            font-size:1.1rem;
            font-weight:700;
            color:var(--dark);
            margin-bottom:12px;
        }
        .preview-price{
            display:flex;
            align-items:baseline;
            gap:7px;
            margin-bottom:10px;
        }
        .preview-discount{
            color:#D05018;
            font-size:.88rem;
            font-weight:700;
        }
        .preview-main{
            font-size:1.45rem;
            font-weight:700;
            color:var(--dark);
        }
        .preview-desc{
            font-size:.82rem;
            color:var(--mid);
            line-height:1.7;
            margin-bottom:18px;
        }
        .preview-meta{
            display:flex;
            flex-wrap:wrap;
            gap:8px;
        }
        .preview-chip{
            background:var(--gp);
            color:var(--green);
            padding:5px 10px;
            border-radius:999px;
            font-size:.68rem;
            font-weight:700;
        }
        @media(max-width:960px){
            .create-grid{
                grid-template-columns:1fr;
            }
        }
    </style>
</head>
<body>

<div th:replace="nav :: nav"></div>

<div class="create-wrap">
    <div class="create-top">
        <div class="create-badge">🌾 판매자 전용</div>
        <div class="create-title">못난이 농산물 상품 등록</div>
        <div class="create-sub">신선한 농산물을 등록하고 소비자들에게 직접 판매해보세요.</div>
    </div>

    <div class="create-grid">
        <!-- 왼쪽 등록 폼 -->
        <div class="create-card">
            <form th:action="@{/market/create}" method="post" enctype="multipart/form-data">
                <div class="form-group">
                    <label>상품명</label>
                    <input type="text" name="name" class="form-input" placeholder="예: 못난이 감자 3kg" required>
                </div>
                <div class="form-group">
                    <label>카테고리</label>
                    <select name="category" class="form-select" required>
                        <option value="">카테고리 선택</option>
                        <option value="채소">채소</option>
                        <option value="과일">과일</option>
                        <option value="곡류">곡류</option>
                        <option value="버섯">버섯</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>판매 가격</label>
                        <input type="number" name="price" class="form-input" placeholder="12000" required>
                    </div>
                    <div class="form-group">
                        <label>할인 가격</label>
                        <input type="number" name="discountPrice" class="form-input" placeholder="8900">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>원산지</label>
                        <input type="text" name="origin" class="form-input" placeholder="예: 강원 홍천" required>
                    </div>
                    <div class="form-group">
                        <label>재고 수량</label>
                        <input type="number" name="stockQuantity" class="form-input" placeholder="100" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>유통기한</label>
                        <input type="date" name="expiryDate" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label>픽업 가능 여부</label>
                        <select name="isPickupAvailable" class="form-select">
                            <option value="true">가능</option>
                            <option value="false">불가능</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>상품 설명</label>
                    <textarea name="description" class="form-textarea" placeholder="상품 특징, 배송 정보 등을 입력해주세요."></textarea>
                </div>
                <div class="form-group">
                    <label>대표 이미지</label>
                    <label class="thumb-upload">
                        <div class="thumb-icon">📦</div>
                        <div class="thumb-title">이미지 업로드</div>
                        <div class="thumb-sub">JPG, PNG 파일 업로드 가능</div>
                        <input type="file" name="thumbnailFile" accept="image/*" hidden>
                    </label>
                </div>
                <div class="submit-row">
                    <button type="button" class="btn-cancel" onclick="history.back()">취소</button>
                    <button type="submit" class="btn-submit2">상품 등록하기</button>
                </div>
            </form>
        </div>

        <!-- 오른쪽 미리보기 -->
        <div class="create-card preview-card">
            <div class="preview-top">
                🥔
                <div class="preview-badge">미리보기</div>
            </div>
            <div class="preview-body">
                <div class="preview-origin">강원 홍천 · 감자 농가</div>
                <div class="preview-name">못난이 감자 3kg</div>
                <div class="preview-price">
                    <div class="preview-discount">-30%</div>
                    <div class="preview-main">7,000원</div>
                </div>
                <div class="preview-desc">크기는 조금 달라도 맛과 신선함은 그대로인 친환경 못난이 감자 상품입니다.</div>
                <div class="preview-meta">
                    <div class="preview-chip">🥔 채소</div>
                    <div class="preview-chip">📦 재고 100개</div>
                    <div class="preview-chip">🚚 픽업 가능</div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="footer :: footer"></div>
</body>
</html>
