<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 수정 | 못난이 농작물</title>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <style>
        /* ── 페이지 ── */
        .cr-page { padding-top: 64px; min-height: 100vh; background: var(--beige2); }

        /* ── 히어로 (edit = amber 포인트) ── */
        .cr-hero {
            background: var(--dark);
            padding: 50px 7% 48px;
            position: relative; overflow: hidden;
        }
        .cr-hero-ring1 {
            position: absolute; top: -60px; right: 6%;
            width: 220px; height: 220px;
            border: 40px solid rgba(255,255,255,.04); border-radius: 50%;
        }
        .cr-hero-ring2 {
            position: absolute; bottom: -80px; right: 22%;
            width: 160px; height: 160px;
            border: 30px solid rgba(200,136,10,.1); border-radius: 50%;
        }
        .cr-hero-deco {
            position: absolute; right: 8%; top: 50%;
            transform: translateY(-50%);
            font-size: 7.5rem; opacity: .08;
            pointer-events: none; user-select: none;
        }
        .cr-hero-inner { position: relative; z-index: 1; max-width: 560px; }
        .cr-hero-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(200,136,10,.2);
            border: 1px solid rgba(200,136,10,.4);
            color: #f5c050;
            padding: 5px 14px; border-radius: 999px;
            font-size: .72rem; font-weight: 700; margin-bottom: 16px;
        }
        .cr-hero-title {
            font-family: 'Gaegu', cursive;
            font-size: clamp(2rem, 4vw, 2.9rem);
            font-weight: 700; color: #fff;
            line-height: 1.18; margin-bottom: 12px;
        }
        .cr-hero-sub { font-size: .88rem; color: rgba(255,255,255,.6); line-height: 1.7; }

        /* ── 본문 그리드 ── */
        .cr-content { padding: 32px 7% 80px; }
        .cr-grid {
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 24px; align-items: start;
        }

        /* ── 스텝 카드 ── */
        .cr-step {
            background: #fff;
            border-radius: 20px;
            border: 1.5px solid var(--beige);
            box-shadow: 0 4px 22px rgba(42,30,6,.05);
            margin-bottom: 16px; overflow: hidden;
        }
        .cr-step-hd {
            display: flex; align-items: center; gap: 14px;
            padding: 18px 24px;
            background: var(--beige3);
            border-bottom: 1.5px solid var(--beige);
        }
        .cr-num {
            width: 32px; height: 32px; border-radius: 50%;
            background: var(--amber); color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: .84rem; font-weight: 700; flex-shrink: 0;
        }
        .cr-step-ttl { font-weight: 700; font-size: .92rem; color: var(--dark); }
        .cr-step-bd { padding: 22px 24px; }

        /* ── 폼 요소 ── */
        .fg { margin-bottom: 16px; }
        .fg:last-child { margin-bottom: 0; }
        .fg > label {
            display: block; margin-bottom: 7px;
            font-size: .76rem; font-weight: 700; color: var(--mid);
        }
        .fi, .fs, .fta {
            width: 100%; padding: 12px 14px;
            border: 1.5px solid var(--beige);
            border-radius: 11px; background: #fff;
            font-family: inherit; font-size: .84rem;
            color: var(--dark); outline: none;
            transition: border-color .2s;
        }
        .fi:focus, .fs:focus, .fta:focus { border-color: var(--amber); }
        .fta { resize: none; min-height: 130px; }
        .frow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .hint { font-size: .72rem; color: var(--muted); margin-top: 4px; }

        /* ── 대표 이미지 업로드 ── */
        .img-upload {
            border: 2px dashed var(--gl);
            border-radius: 16px; background: var(--gp);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center; cursor: pointer;
            transition: border-color .2s, background .2s;
            padding: 24px 20px; gap: 6px;
        }
        .img-upload:hover { border-color: var(--green); background: #edfad8; }
        .img-upload-icon { font-size: 2.6rem; }
        .img-upload-ttl { font-size: .88rem; font-weight: 700; color: var(--dark); }
        .img-upload-sub { font-size: .7rem; color: var(--muted); }

        /* ── 픽업 박스 ── */
        .pickup-box {
            background: var(--gp); border: 1.5px solid var(--gl);
            border-radius: 14px; padding: 16px 18px; margin-top: 4px;
        }
        .pickup-box .fg { margin-bottom: 14px; }
        .pickup-box .fg:last-child { margin-bottom: 0; }

        /* ── 맵 플레이스홀더 ── */
        .map-ph {
            width: 100%; height: 220px; border-radius: 12px; margin-bottom: 12px;
            background: var(--beige3); border: 2px dashed var(--beige);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 10px; text-align: center;
        }

        /* ── 상세 이미지 그리드 ── */
        .img-grid {
            display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px;
        }
        .img-exist {
            position: relative; display: block;
            width: 100px; height: 100px;
            border-radius: 10px; overflow: hidden;
            border: 2px solid var(--beige); cursor: pointer;
            transition: border-color .2s; flex-shrink: 0;
        }
        .img-exist:has(.del-chk:checked) { border-color: #D05018; }
        .img-exist img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .del-chk { display: none; }
        .del-mark {
            position: absolute; inset: 0;
            background: rgba(200,30,20,.6); color: #fff;
            font-size: .72rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center; gap: 4px;
            opacity: 0; transition: opacity .2s;
        }
        .img-exist:hover .del-mark { opacity: 1; }
        .del-chk:checked ~ .del-mark { opacity: 1; background: rgba(200,30,20,.82); }
        .img-new-preview {
            position: relative; width: 100px; height: 100px;
            border-radius: 10px; overflow: hidden;
            border: 2px solid var(--gl); flex-shrink: 0;
        }
        .img-new-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .img-add-btn {
            width: 100px; height: 100px; border-radius: 10px;
            border: 2px dashed var(--gl); background: var(--gp);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            cursor: pointer; gap: 5px; flex-shrink: 0;
            transition: border-color .2s, background .2s;
        }
        .img-add-btn:hover { border-color: var(--green); background: #edfad8; }
        .img-add-btn .add-ico { font-size: 1.6rem; }
        .img-add-btn .add-lbl { font-size: .7rem; color: var(--muted); }

        /* ── 버튼 ── */
        .btn-row { display: flex; justify-content: flex-end; gap: 10px; padding-top: 4px; }
        .btn-back {
            border: none; background: var(--beige); color: var(--mid);
            border-radius: 12px; padding: 13px 22px;
            font-weight: 700; cursor: pointer; font-family: inherit;
            font-size: .86rem; transition: background .2s;
        }
        .btn-back:hover { background: #ede7da; }
        .btn-reg {
            border: none; background: var(--amber); color: #fff;
            border-radius: 12px; padding: 13px 28px;
            font-weight: 700; cursor: pointer; font-family: inherit;
            font-size: .86rem; letter-spacing: .02em;
            box-shadow: 0 6px 20px rgba(200,136,10,.28);
            transition: background .2s, transform .1s;
        }
        .btn-reg:hover { background: #a06e08; }
        .btn-reg:active { transform: scale(.97); }
        .btn-addr {
            border: 1.5px solid var(--amber); background: #fff; color: var(--amber);
            border-radius: 10px; padding: 12px 16px;
            font-weight: 700; cursor: pointer; font-family: inherit;
            font-size: .82rem; white-space: nowrap; transition: background .2s;
        }
        .btn-addr:hover { background: #fffbf0; }

        /* ── 미리보기 패널 ── */
        .cr-preview-wrap { position: sticky; top: 82px; }
        .cr-preview-lbl {
            font-size: .72rem; font-weight: 700; color: var(--muted);
            letter-spacing: .06em; text-transform: uppercase;
            margin-bottom: 10px; padding-left: 4px;
        }
        .cr-preview-card {
            background: #fff; border-radius: 20px;
            border: 1.5px solid var(--beige);
            box-shadow: 0 4px 22px rgba(42,30,6,.07); overflow: hidden;
        }
        .pv-img {
            height: 220px;
            background: linear-gradient(145deg, var(--gp), var(--gl));
            display: flex; align-items: center; justify-content: center;
            font-size: 5rem; position: relative;
        }
        .pv-live-tag {
            position: absolute; top: 12px; right: 12px;
            background: var(--amber); color: #fff;
            font-size: .62rem; font-weight: 700;
            padding: 3px 9px; border-radius: 6px;
        }
        .pv-body { padding: 20px; }
        .pv-origin { font-size: .7rem; color: var(--muted); margin-bottom: 5px; }
        .pv-name {
            font-family: 'Gaegu', cursive;
            font-size: 1.3rem; font-weight: 700;
            color: var(--dark); margin-bottom: 10px; line-height: 1.3;
        }
        .pv-price { display: flex; align-items: baseline; gap: 7px; margin-bottom: 10px; }
        .pv-rate { color: #D05018; font-size: .88rem; font-weight: 700; }
        .pv-main { font-size: 1.45rem; font-weight: 700; color: var(--dark); }
        .pv-desc {
            font-size: .8rem; color: var(--mid); line-height: 1.7;
            margin-bottom: 16px; display: -webkit-box;
            -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
        }
        .pv-chips { display: flex; flex-wrap: wrap; gap: 7px; }
        .pv-chip {
            background: var(--gp); color: var(--green);
            padding: 5px 10px; border-radius: 999px;
            font-size: .67rem; font-weight: 700;
        }

        /* ── 반응형 ── */
        @media (max-width: 900px) {
            .cr-grid { grid-template-columns: 1fr; }
            .cr-preview-wrap { position: static; margin-top: 8px; }
        }
        @media (max-width: 540px) {
            .frow { grid-template-columns: 1fr; }
            .cr-content { padding: 24px 5% 60px; }
            .cr-hero { padding: 40px 5% 38px; }
        }
    </style>
</head>
<body>

<div th:replace="nav :: nav"></div>

<div class="cr-page">

    <!-- ── 히어로 배너 ── -->
    <div class="cr-hero">
        <div class="cr-hero-ring1"></div>
        <div class="cr-hero-ring2"></div>
        <div class="cr-hero-deco">✏️</div>
        <div class="cr-hero-inner">
            <div class="cr-hero-badge">✏️ 상품 수정</div>
            <h1 class="cr-hero-title">못난이 농산물<br>상품 수정</h1>
            <p class="cr-hero-sub">등록된 상품 정보를 수정하세요.</p>
        </div>
    </div>

    <!-- ── 본문 ── -->
    <div class="cr-content">
        <div class="cr-grid">

            <!-- ══ 왼쪽: 수정 폼 ══ -->
            <form th:action="@{/market/edit/{id}(id=${product.id})}"
                  method="post" enctype="multipart/form-data">

                <!-- ① 기본 정보 -->
                <div class="cr-step">
                    <div class="cr-step-hd">
                        <div class="cr-num">1</div>
                        <div class="cr-step-ttl">기본 정보</div>
                    </div>
                    <div class="cr-step-bd">
                        <div class="fg">
                            <label>상품명</label>
                            <input type="text" name="name" class="fi"
                                   th:value="${product.name}" required
                                   oninput="document.querySelector('.pv-name').textContent = this.value || '상품명'">
                        </div>
                        <div class="fg">
                            <label>카테고리</label>
                            <select name="category" class="fs" required onchange="updateChips()">
                                <option value="">카테고리 선택</option>
                                <option value="채소"     th:selected="${product.category == '채소'}">채소</option>
                                <option value="과일"     th:selected="${product.category == '과일'}">과일</option>
                                <option value="곡류"     th:selected="${product.category == '곡류'}">곡류</option>
                                <option value="버섯"     th:selected="${product.category == '버섯'}">버섯</option>
                                <option value="뿌리채소"  th:selected="${product.category == '뿌리채소'}">뿌리채소</option>
                            </select>
                        </div>
                        <div class="fg">
                            <label>상품 설명</label>
                            <textarea name="description" class="fta"
                                      th:text="${product.description}"
                                      oninput="document.querySelector('.pv-desc').textContent = this.value"></textarea>
                        </div>
                    </div>
                </div>

                <!-- ② 가격 정보 -->
                <div class="cr-step">
                    <div class="cr-step-hd">
                        <div class="cr-num">2</div>
                        <div class="cr-step-ttl">가격 정보</div>
                    </div>
                    <div class="cr-step-bd">
                        <div class="frow">
                            <div class="fg">
                                <label>판매 가격 (원)</label>
                                <input type="number" name="price" id="priceInput" class="fi"
                                       th:value="${#numbers.formatInteger(product.price, 0)}"
                                       oninput="updateDiscountPreview()" required>
                            </div>
                            <div class="fg">
                                <label>할인율 (%)</label>
                                <input type="number" id="discountRateInput" class="fi"
                                       min="0" max="99" placeholder="예: 20"
                                       th:value="${discountRate}"
                                       oninput="this.value=Math.min(Math.max(this.value,0),99); updateDiscountPreview()">
                                <input type="hidden" name="discountPrice" id="discountPriceHidden"
                                       th:value="${product.discountPrice != null} ? ${#numbers.formatInteger(product.discountPrice, 0)} : ''">
                                <div class="hint">최대 99%까지 적용됩니다</div>
                            </div>
                        </div>
                        <div class="frow" style="margin-top:4px">
                            <div class="fg">
                                <label>할인 시작일</label>
                                <input type="date" name="discountStartAt" class="fi"
                                       th:value="${product.discountStartAt}">
                            </div>
                            <div class="fg">
                                <label>할인 종료일</label>
                                <input type="date" name="discountEndAt" class="fi"
                                       th:value="${product.discountEndAt}">
                            </div>
                        </div>
                        <div class="hint">💡 할인율 입력 시 기간을 함께 설정해주세요.</div>
                    </div>
                </div>

                <!-- ③ 상품 세부 -->
                <div class="cr-step">
                    <div class="cr-step-hd">
                        <div class="cr-num">3</div>
                        <div class="cr-step-ttl">상품 세부</div>
                    </div>
                    <div class="cr-step-bd">
                        <div class="frow">
                            <div class="fg">
                                <label>원산지</label>
                                <input type="text" name="origin" class="fi"
                                       th:value="${product.origin}" required
                                       oninput="document.querySelector('.pv-origin').textContent = this.value">
                            </div>
                            <div class="fg">
                                <label>재고 수량 (개)</label>
                                <input type="number" name="stockQuantity" class="fi"
                                       th:value="${product.stockQuantity}" required
                                       oninput="updateChips()">
                            </div>
                        </div>
                        <div class="frow">
                            <div class="fg">
                                <label>유통기한</label>
                                <input type="date" name="expiryDate" class="fi"
                                       th:value="${product.expiryDate}" required>
                            </div>
                            <div class="fg">
                                <label>픽업 가능 여부</label>
                                <select name="isPickupAvailable" class="fs"
                                        id="pickupSelect"
                                        onchange="togglePickup(); updateChips()">
                                    <option value="true"  th:selected="${product.isPickupAvailable == true}">가능</option>
                                    <option value="false" th:selected="${product.isPickupAvailable == false}">불가능</option>
                                </select>
                            </div>
                        </div>

                        <!-- 픽업 상세 -->
                        <div id="pickupDetail" style="display:none;" class="pickup-box">
                            <div class="fg">
                                <label>픽업 주소</label>
                                <div style="display:flex;gap:8px;">
                                    <input type="text" id="pickupAddressInput" name="address" class="fi"
                                           th:value="${product.address}" readonly
                                           placeholder="주소 검색 버튼을 눌러주세요">
                                    <button type="button" class="btn-addr" onclick="searchAddress()">주소 검색</button>
                                </div>
                            </div>

                            <!-- 맵 플레이스홀더 / 실제 지도 -->
                            <div id="mapPlaceholder"
                                 style="width:100%;height:220px;border-radius:12px;margin-bottom:12px;
                                        background:var(--beige3);border:2px dashed var(--beige);
                                        display:flex;flex-direction:column;align-items:center;
                                        justify-content:center;gap:10px;text-align:center;">
                                <div style="font-size:3rem;opacity:.6">🗺️</div>
                                <div style="font-size:.88rem;font-weight:700;color:var(--mid)">주소를 입력해주세요</div>
                                <div style="font-size:.74rem;color:var(--muted)">위 주소 검색 버튼을 눌러주세요</div>
                            </div>
                            <div id="kakaoMap"
                                 style="width:100%;height:220px;border-radius:12px;margin-bottom:12px;display:none;"></div>

                            <input type="hidden" id="latitudeInput"  name="latitude"  th:value="${product.latitude}">
                            <input type="hidden" id="longitudeInput" name="longitude" th:value="${product.longitude}">
                            <div class="fg">
                                <label>운영 시간</label>
                                <input type="text" name="operatingHours" class="fi"
                                       th:value="${product.operatingHours}"
                                       placeholder="예: 평일 09:00 ~ 18:00">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ④ 이미지 관리 -->
                <div class="cr-step">
                    <div class="cr-step-hd">
                        <div class="cr-num">4</div>
                        <div class="cr-step-ttl">이미지 관리</div>
                    </div>
                    <div class="cr-step-bd">

                        <!-- 대표 이미지 -->
                        <div class="fg">
                            <label>대표 이미지 (변경 시에만 업로드)</label>
                            <label class="img-upload" for="thumbFile">
                                <div class="img-upload-icon">📦</div>
                                <div class="img-upload-ttl">새 대표 이미지 업로드</div>
                                <div class="img-upload-sub">업로드 시에만 교체됩니다 · JPG, PNG 가능</div>
                                <input type="file" id="thumbFile" name="thumbnailFile" accept="image/*" hidden>
                            </label>
                        </div>

                        <!-- 상세 이미지 (기존 + 추가 통합 그리드) -->
                        <div class="fg">
                            <label>상세 이미지 <span style="font-weight:400;color:var(--muted)">(올리면 삭제 / ➕으로 추가)</span></label>
                            <div class="img-grid" id="imageGrid">
                                <!-- 기존 이미지 -->
                                <label class="img-exist" th:each="image : ${product.images}">
                                    <img th:src="${image.uuid}" alt="상세 이미지">
                                    <input type="checkbox" class="del-chk" name="deleteImageIds" th:value="${image.id}">
                                    <div class="del-mark">🗑️ 삭제</div>
                                </label>
                                <!-- 추가 버튼 -->
                                <label class="img-add-btn" for="newImageFiles">
                                    <span class="add-ico">➕</span>
                                    <span class="add-lbl">이미지 추가</span>
                                </label>
                            </div>
                            <input type="file" id="newImageFiles" name="imageFiles" accept="image/*" multiple hidden>
                        </div>
                    </div>
                </div>

                <!-- ── 버튼 ── -->
                <div class="btn-row">
                    <button type="button" class="btn-back" onclick="history.back()">취소</button>
                    <button type="submit" class="btn-reg">✏️ 상품 수정하기</button>
                </div>

            </form>

            <!-- ══ 오른쪽: 미리보기 ══ -->
            <div class="cr-preview-wrap">
                <div class="cr-preview-lbl">실시간 미리보기</div>
                <div class="cr-preview-card">
                    <div class="pv-img">
                        <img id="thumbPreview"
                             th:src="${product.thumbnailUrl}"
                             th:style="${product.thumbnailUrl != null} ? 'display:block;width:100%;height:100%;object-fit:cover;position:absolute;inset:0;border-radius:0' : 'display:none;width:100%;height:100%;object-fit:cover;position:absolute;inset:0;border-radius:0'"/>
                        🥔
                        <div class="pv-live-tag">미리보기</div>
                    </div>
                    <div class="pv-body">
                        <div class="pv-origin" th:text="${product.origin}">원산지</div>
                        <div class="pv-name" th:text="${product.name}">상품명</div>
                        <div class="pv-price">
                            <div class="pv-rate"></div>
                            <div class="pv-main" th:text="${#numbers.formatInteger(product.price, 0)} + '원'">가격</div>
                        </div>
                        <div class="pv-desc" th:text="${product.description}">설명</div>
                        <div class="pv-chips" id="pvChips">
                            <div class="pv-chip" th:text="'🥬 ' + ${product.category}">카테고리</div>
                            <div class="pv-chip" th:text="'📦 재고 ' + ${product.stockQuantity} + '개'">재고</div>
                            <div class="pv-chip" th:text="${product.isPickupAvailable} ? '🚚 픽업 가능' : '픽업 불가'">픽업</div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Thymeleaf inline: 기존 좌표 JS 변수로 전달 -->
<script th:inline="javascript">
    var initLat = [[${product.latitude}]];
    var initLng = [[${product.longitude}]];
</script>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=050995b6d6375c46a4dee1a7b3e53aa4&libraries=services"></script>
<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script>
    // 할인 미리보기
    function updateDiscountPreview() {
        var price  = Number(document.getElementById('priceInput').value);
        var rate   = Number(document.getElementById('discountRateInput').value);
        var pvMain = document.querySelector('.pv-main');
        var pvRate = document.querySelector('.pv-rate');
        var hidden = document.getElementById('discountPriceHidden');
        if (!price) return;
        if (rate > 0 && rate <= 99) {
            var discounted = Math.round(price * (1 - rate / 100));
            pvRate.textContent = '-' + rate + '%';
            pvMain.textContent = discounted.toLocaleString() + '원';
            hidden.value       = discounted;
        } else {
            pvRate.textContent = '';
            pvMain.textContent = price.toLocaleString() + '원';
            hidden.value       = '';
        }
    }

    // 미리보기 칩 업데이트
    var catEmoji = { '채소':'🥬','과일':'🍎','곡류':'🌾','버섯':'🍄','뿌리채소':'🥕' };
    function updateChips() {
        var cat    = document.querySelector('[name=category]').value;
        var stock  = document.querySelector('[name=stockQuantity]').value;
        var pickup = document.getElementById('pickupSelect').value === 'true';
        document.getElementById('pvChips').innerHTML =
            '<div class="pv-chip">' + (catEmoji[cat] || '🥔') + ' ' + (cat || '채소') + '</div>' +
            '<div class="pv-chip">📦 재고 ' + (stock || 0) + '개</div>' +
            (pickup ? '<div class="pv-chip">🚚 픽업 가능</div>'
                    : '<div class="pv-chip" style="color:var(--muted)">픽업 불가</div>');
    }

    // 픽업 섹션 show/hide
    function togglePickup() {
        var show = document.getElementById('pickupSelect').value === 'true';
        document.getElementById('pickupDetail').style.display = show ? 'block' : 'none';
    }

    // 지도 인스턴스 (한 번만 생성)
    var _map = null;
    var _marker = null;

    function showMap(lat, lng) {
        document.getElementById('mapPlaceholder').style.display = 'none';
        var container = document.getElementById('kakaoMap');
        container.style.display = 'block';
        var latlng = new kakao.maps.LatLng(lat, lng);
        if (!_map) {
            _map    = new kakao.maps.Map(container, { center: latlng, level: 3 });
            _marker = new kakao.maps.Marker({ map: _map, position: latlng });
        } else {
            _map.setCenter(latlng);
            _marker.setPosition(latlng);
        }
    }

    // 주소 검색
    function searchAddress() {
        new daum.Postcode({
            oncomplete: function (data) {
                document.getElementById('pickupAddressInput').value = data.roadAddress;
                var geocoder = new kakao.maps.services.Geocoder();
                geocoder.addressSearch(data.roadAddress, function (result, status) {
                    if (status === kakao.maps.services.Status.OK) {
                        var lat = result[0].y;
                        var lng = result[0].x;
                        document.getElementById('latitudeInput').value  = lat;
                        document.getElementById('longitudeInput').value = lng;
                        showMap(lat, lng);
                    }
                });
            }
        }).open();
    }

    // 대표 이미지 변경 미리보기
    document.getElementById('thumbFile').addEventListener('change', function (e) {
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function (ev) {
            var img = document.getElementById('thumbPreview');
            img.src = ev.target.result;
            img.style.display = 'block';
            document.querySelector('.pv-img').childNodes.forEach(function (n) {
                if (n.nodeType === 3) n.textContent = '';
            });
        };
        reader.readAsDataURL(file);
    });

    // 새 상세 이미지 미리보기 (그리드 통합)
    document.getElementById('newImageFiles').addEventListener('change', function () {
        document.querySelectorAll('.img-new-preview').forEach(function (el) { el.remove(); });
        var addBtn = document.querySelector('.img-add-btn');
        var grid   = document.getElementById('imageGrid');
        Array.from(this.files).forEach(function (file) {
            var reader = new FileReader();
            reader.onload = function (e) {
                var div = document.createElement('div');
                div.className = 'img-new-preview';
                var img = document.createElement('img');
                img.src = e.target.result;
                div.appendChild(img);
                grid.insertBefore(div, addBtn);
            };
            reader.readAsDataURL(file);
        });
    });

    // 즉시 실행
    updateDiscountPreview();
    togglePickup();

    // 기존 좌표가 있으면 지도 바로 초기화 (이벤트 없이 직접 호출)
    if (initLat && initLng) {
        showMap(initLat, initLng);
    }
</script>
</body>
</html>
