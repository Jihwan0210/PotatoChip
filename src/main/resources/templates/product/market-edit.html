<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 수정</title>
    <link rel="stylesheet" href="/css/product/create.css">
    <style>
        .image-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 6px;
        }
        .existing-image-label {
            position: relative;
            display: block;
            width: 100px;
            height: 100px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid var(--beige);
            cursor: pointer;
            transition: border-color .2s;
            flex-shrink: 0;
        }
        .existing-image-label:has(.delete-checkbox:checked) {
            border-color: #D05018;
        }
        .existing-image-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .delete-checkbox { display: none; }
        .delete-mark {
            position: absolute;
            inset: 0;
            background: rgba(200, 30, 20, .6);
            color: #fff;
            font-size: .72rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            opacity: 0;
            transition: opacity .2s;
        }
        .existing-image-label:hover .delete-mark { opacity: 1; }
        .delete-checkbox:checked ~ .delete-mark {
            opacity: 1;
            background: rgba(200, 30, 20, .82);
        }
        .new-preview-item {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid var(--gl);
            flex-shrink: 0;
        }
        .new-preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .image-add-btn {
            width: 100px;
            height: 100px;
            border-radius: 10px;
            border: 2px dashed var(--gl);
            background: var(--gp);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            gap: 5px;
            flex-shrink: 0;
            transition: border-color .2s, background .2s;
        }
        .image-add-btn:hover {
            border-color: var(--green);
            background: #f5fbe9;
        }
        .image-add-btn span:first-child { font-size: 1.6rem; }
        .image-add-btn span:last-child  { font-size: .7rem; color: var(--muted); }
    </style>
</head>
<body>

<div class="create-wrap">

    <div class="create-top">
        <div class="create-badge">🌾 판매자 전용</div>
        <div class="create-title">못난이 농산물 상품 수정</div>
        <div class="create-sub">상품 정보를 수정하세요.</div>
    </div>

    <div class="create-grid">
        <div class="create-card">

            <form th:action="@{/market/edit/{id}(id=${product.id})}"
                  method="post"
                  enctype="multipart/form-data">

                <div class="form-group">
                    <label>상품명</label>
                    <input type="text" name="name" class="form-input"
                           th:value="${product.name}" required>
                </div>

                <div class="form-group">
                    <label>카테고리</label>
                    <select name="category" class="form-select" required>
                        <option value="">카테고리 선택</option>
                        <option value="채소"    th:selected="${product.category == '채소'}">채소</option>
                        <option value="과일"    th:selected="${product.category == '과일'}">과일</option>
                        <option value="곡류"    th:selected="${product.category == '곡류'}">곡류</option>
                        <option value="버섯"    th:selected="${product.category == '버섯'}">버섯</option>
                        <option value="뿌리채소" th:selected="${product.category == '뿌리채소'}">뿌리채소</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>판매 가격</label>
                        <input type="number" name="price" id="priceInput" class="form-input"
                               th:value="${#numbers.formatInteger(product.price, 0)}"
                               oninput="updateDiscountPreview()" required>
                    </div>
                    <div class="form-group">
                        <label>할인율 (%)</label>
                        <input type="number" id="discountRateInput" class="form-input"
                               min="0" max="99" placeholder="예: 20"
                               th:value="${discountRate}"
                               oninput="this.value = Math.min(Math.max(this.value, 0), 99); updateDiscountPreview()">
                        <input type="hidden" name="discountPrice" id="discountPriceHidden"
                               th:value="${product.discountPrice != null} ? ${#numbers.formatInteger(product.discountPrice, 0)} : ''">
                        <div style="font-size:.72rem;color:var(--muted);margin-top:4px">※ 할인율은 99%까지 적용됩니다</div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>할인 시작일</label>
                            <input type="date" name="discountStartAt" class="form-input"
                                   th:value="${product.discountStartAt}">
                        </div>
                        <div class="form-group">
                            <label>할인 종료일</label>
                            <input type="date" name="discountEndAt" class="form-input"
                                   th:value="${product.discountEndAt}">
                        </div>
                    </div>
                    <div id="discountDateHint" style="font-size:.75rem;color:var(--muted);margin-top:4px;display:block">
                        💡 할인율 입력 시 날짜를 설정할 수 있습니다.
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>원산지</label>
                        <input type="text" name="origin" class="form-input"
                               th:value="${product.origin}" required>
                    </div>
                    <div class="form-group">
                        <label>재고 수량</label>
                        <input type="number" name="stockQuantity" class="form-input"
                               th:value="${product.stockQuantity}" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>유통기한</label>
                        <input type="date" name="expiryDate" class="form-input"
                               th:value="${product.expiryDate}" required>
                    </div>
                    <div class="form-group">
                        <label>픽업 가능 여부</label>
                        <select name="isPickupAvailable" class="form-select" id="pickupSelect">
                            <option value="true"  th:selected="${product.isPickupAvailable == true}">가능</option>
                            <option value="false" th:selected="${product.isPickupAvailable == false}">불가능</option>
                        </select>
                    </div>
                </div>

                <div id="pickupDetail" style="display:none;">
                    <div class="form-group">
                        <label>픽업 주소</label>
                        <div style="display:flex;gap:8px;">
                            <input type="text" id="pickupAddressInput" name="address" class="form-input"
                                   th:value="${product.address}" readonly>
                            <button type="button" class="btn-cancel" onclick="searchAddress()">주소 검색</button>
                        </div>
                    </div>
                    <div id="kakaoMap" style="width:100%;height:250px;border-radius:12px;margin-bottom:12px;"></div>
                    <input type="hidden" id="latitudeInput" name="latitude" th:value="${product.latitude}">
                    <input type="hidden" id="longitudeInput" name="longitude" th:value="${product.longitude}">
                    <div class="form-group">
                        <label>운영 시간</label>
                        <input type="text" name="operatingHours" class="form-input"
                               th:value="${product.operatingHours}">
                    </div>
                </div>

                <div class="form-group">
                    <label>상품 설명</label>
                    <textarea name="description" class="form-textarea"
                              th:text="${product.description}"></textarea>
                </div>

                <div class="form-group">
                    <label>대표 이미지 (변경 시에만 업로드)</label>
                    <label class="thumb-upload">
                        <div class="thumb-icon">📦</div>
                        <div class="thumb-title">이미지 업로드</div>
                        <div class="thumb-sub">JPG, PNG 파일 업로드 가능</div>
                        <input type="file" name="thumbnailFile" accept="image/*" hidden>
                    </label>
                </div>

                <!-- 상세 이미지 (기존 + 추가 통합) -->
                <div class="form-group">
                    <label>상세 이미지 (마우스 올리면 삭제 선택 / ➕ 버튼으로 추가)</label>
                    <div class="image-grid" id="imageGrid">
                        <label class="existing-image-label" th:each="image : ${product.images}">
                            <img th:src="${image.uuid}" class="existing-image-thumb" alt="상세 이미지">
                            <input type="checkbox" class="delete-checkbox" name="deleteImageIds" th:value="${image.id}">
                            <div class="delete-mark">🗑️ 삭제</div>
                        </label>
                        <label class="image-add-btn" for="newImageFiles">
                            <span>➕</span>
                            <span>이미지 추가</span>
                        </label>
                    </div>
                    <input type="file" id="newImageFiles" name="imageFiles" accept="image/*" multiple hidden>
                </div>

                <div class="submit-row">
                    <button type="button" class="btn-cancel" onclick="history.back()">취소</button>
                    <button type="submit" class="btn-submit2">상품 수정하기</button>
                </div>

            </form>
        </div>

        <!-- 오른쪽 미리보기 -->
        <div class="create-card preview-card">
            <div class="preview-top">
                <img id="thumbPreview"
                     th:if="${product.thumbnailUrl != null and !product.thumbnailUrl.isEmpty()}"
                     th:src="${product.thumbnailUrl}"
                     style="width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0;border-radius:0"/>
                <img id="thumbPreview"
                     th:unless="${product.thumbnailUrl != null and !product.thumbnailUrl.isEmpty()}"
                     style="display:none;width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0;border-radius:0"/>
                🥔
                <div class="preview-badge">미리보기</div>
            </div>
            <div class="preview-body">
                <div class="preview-origin" th:text="${product.origin}">원산지</div>
                <div class="preview-name" th:text="${product.name}">상품명</div>
                <div class="preview-price">
                    <div class="preview-discount"></div>
                    <div class="preview-main" th:text="${#numbers.formatInteger(product.price, 0)} + '원'">가격</div>
                </div>
                <div class="preview-desc" th:text="${product.description}">설명</div>
                <div class="preview-meta">
                    <div class="preview-chip" th:text="'🥔 ' + ${product.category}">카테고리</div>
                    <div class="preview-chip" th:text="'📦 재고 ' + ${product.stockQuantity} + '개'">재고</div>
                    <div class="preview-chip" th:text="${product.isPickupAvailable} ? '🚚 픽업 가능' : '🚚 픽업 불가'">픽업</div>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=050995b6d6375c46a4dee1a7b3e53aa4&libraries=services"></script>
<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script>
    window.addEventListener('DOMContentLoaded', function () {
        updateDiscountPreview();
        if (typeof toggleDiscountDates === 'function') toggleDiscountDates();
    });

    function updateDiscountPreview() {
        const price  = Number(document.getElementById('priceInput').value);
        const rate   = Number(document.getElementById('discountRateInput').value);

        const previewMain     = document.querySelector('.preview-main');
        const previewDiscount = document.querySelector('.preview-discount');
        const hiddenDiscount  = document.getElementById('discountPriceHidden');

        if (!price) return;

        if (rate > 0 && rate < 99) {
            const discounted = Math.round(price * (1 - rate / 100));
            previewDiscount.textContent = `-${rate}%`;
            previewMain.textContent     = discounted.toLocaleString() + '원';
            hiddenDiscount.value        = discounted;
        } else {
            previewDiscount.textContent = '';
            previewMain.textContent     = price.toLocaleString() + '원';
            hiddenDiscount.value        = '';
        }
    }
</script>
<script src="/js/product/create.js"></script>
<script>
    document.getElementById('newImageFiles').addEventListener('change', function () {
        // 이전 미리보기 제거
        document.querySelectorAll('.new-preview-item').forEach(function (el) { el.remove(); });

        const addBtn = document.querySelector('.image-add-btn');
        const grid   = document.getElementById('imageGrid');

        Array.from(this.files).forEach(function (file) {
            const reader = new FileReader();
            reader.onload = function (e) {
                const div = document.createElement('div');
                div.className = 'new-preview-item';
                const img = document.createElement('img');
                img.src = e.target.result;
                div.appendChild(img);
                grid.insertBefore(div, addBtn);
            };
            reader.readAsDataURL(file);
        });
    });
</script>
</body>
</html>
