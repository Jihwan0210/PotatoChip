<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="nav" id="nav">
    <div class="logo" onclick="location.href='/'" style="cursor:pointer;display:flex;align-items:center;gap:7px">
        <img src="/images/auth/farmer_logo.png" style="height:36px;width:auto;flex-shrink:0"/>
        못<span style="color:var(--green)">난이</span> <span style="color:var(--amber)">농</span>작물
    </div>
    <ul class="nav-links">
        <li><a th:href="@{/}">홈</a></li>
        <li><a th:href="@{/market}">마켓</a></li>
        <li><a th:href="@{/ranking}">판매랭킹</a></li>
        <li><a th:href="@{/board}">게시판</a></li>
        <li><a th:href="@{/faq}">FAQ</a></li>
    </ul>
    <div class="nav-r">
        <!-- 알림 -->
        <div style="position:relative">
        <span class="n-ico" id="bellIcon" style="cursor:pointer;position:relative">🔔<span id="notificationBadge" style="display:none;position:absolute;top:-2px;right:-2px;min-width:14px;height:14px;border-radius:50%;background:#E84040;color:#fff;font-size:.55rem;font-weight:700;align-items:center;justify-content:center;border:2px solid #fff;padding:0 3px">0</span></span><div id="notificationDropdown" style="display:none;position:fixed;right:70px;top:64px;width:320px;background:#fff;border:1.5px solid var(--sand);border-radius:14px;box-shadow:0 10px 30px rgba(42,30,6,.14);z-index:99999;overflow:hidden"><div style="padding:13px 15px;border-bottom:1px solid var(--sand);font-size:.86rem;font-weight:700;color:var(--dark)">알림</div><div id="notificationList" style="max-height:360px;overflow:auto"><div style="padding:18px;text-align:center;font-size:.78rem;color:var(--muted)">알림을 불러오는 중...</div></div></div></div>
        <!-- 로그인 후: 이름 버튼 + 드롭다운 -->
        <div class="nav-user-wrap" id="nav-user-wrap" style="display:none">
            <button type="button" class="btn-nav nav-user-btn" id="nav-user-btn" onclick="toggleUserDropdown(event)">
                <span id="nav-user-name">사용자</span>
                <span class="nav-arrow">▾</span>
            </button>
            <div class="nav-dropdown" id="nav-dropdown">
                <!-- BUYER: 장바구니 -->
                <div class="nd-item" id="nd-cart" onclick="location.href='/cart'" style="display:none">
                    🛒 <span>장바구니</span>
                </div>
                <!-- 역할별 페이지 링크 -->
                <div class="nd-item" id="nd-role-page" onclick="goRolePage()">
                    <span id="nd-role-ico">👤</span>
                    <span id="nd-role-label">마이페이지</span>
                </div>
                <div class="nd-divider"></div>
                <div class="nd-item nd-logout" onclick="handleNavLogout()">🚪 로그아웃</div>
            </div>
        </div>


        <!-- 비로그인 시: 로그인 버튼 -->
        <a th:href="@{/login}" class="btn-nav" id="btn-nav-login">로그인</a>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/auth/auth.js"></script>
    <script>
        var navEventBound = false;

        function getNavCookieValue(name) {
            var cookies = document.cookie ? document.cookie.split('; ') : [];

            for (var i = 0; i < cookies.length; i++) {
                var parts = cookies[i].split('=');
                var key = decodeURIComponent(parts.shift());

                if (key === name) {
                    return decodeURIComponent(parts.join('='));
                }
            }

            return null;
        }

        function isNavTokenExpired(token) {
            var payload = parseNavJwtPayload(token);
            if (!payload || !payload.exp) return false;
            return Date.now() >= Number(payload.exp) * 1000;
        }

        function getNavToken() {
            var token = localStorage.getItem('token')
                || sessionStorage.getItem('token')
                || getNavCookieValue('jwt');

            if (token && isNavTokenExpired(token)) {
                clearNavAuthState();
                return null;
            }

            return token;
        }

        function parseNavJwtPayload(token) {
            if (!token || token.split('.').length < 2) {
                return {};
            }

            try {
                var base64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
                var json = decodeURIComponent(
                    atob(base64)
                        .split('')
                        .map(function(char) {
                            return '%' + ('00' + char.charCodeAt(0).toString(16)).slice(-2);
                        })
                        .join('')
                );

                return JSON.parse(json);
            } catch (e) {
                try {
                    return JSON.parse(atob(token.split('.')[1]));
                } catch (ignore) {
                    return {};
                }
            }
        }

        function normalizeNavRole(role) {
            var value = String(role || '').toUpperCase();

            if (value.indexOf('ROLE_') === 0) {
                value = value.substring(5);
            }

            return value;
        }

        function getNavPayload() {
            return parseNavJwtPayload(getNavToken());
        }

        function getNavRole() {
            var payload = getNavPayload();
            return normalizeNavRole(
                localStorage.getItem('role')
                || sessionStorage.getItem('role')
                || payload.role
                || payload.auth
                || payload.authority
                || ''
            );
        }

        function getNavUserName() {
            var payload = getNavPayload();

            return localStorage.getItem('name')
                || sessionStorage.getItem('name')
                || payload.name
                || payload.nickname
                || payload.username
                || payload.sub
                || payload.email
                || '사용자';
        }

        function getNavUserId() {
            var payload = getNavPayload();

            return localStorage.getItem('currentUserId')
                || sessionStorage.getItem('currentUserId')
                || payload.userId
                || payload.id
                || null;
        }

        function refreshNavUserUI() {
            var token     = getNavToken();
            var role      = getNavRole();
            var name      = getNavUserName();

            var loginBtn  = document.getElementById('btn-nav-login');
            var userWrap  = document.getElementById('nav-user-wrap');
            var userName  = document.getElementById('nav-user-name');
            var ndCart    = document.getElementById('nd-cart');
            var ndRoleIco = document.getElementById('nd-role-ico');
            var ndRoleLbl = document.getElementById('nd-role-label');

            if (!token) {
                if (loginBtn) loginBtn.style.display = '';
                if (userWrap) userWrap.style.display = 'none';
                return;
            }

            if (loginBtn) loginBtn.style.display = 'none';
            if (userWrap) userWrap.style.display = 'flex';
            if (userName) userName.textContent = name;

            if (role === 'SELLER') {
                if (ndCart) ndCart.style.display = 'none';
                if (ndRoleIco) ndRoleIco.textContent = '🌾';
                if (ndRoleLbl) ndRoleLbl.textContent = '농가 대시보드';
                return;
            }

            if (role === 'ADMIN') {
                if (ndCart) ndCart.style.display = 'none';
                if (ndRoleIco) ndRoleIco.textContent = '🛠️';
                if (ndRoleLbl) ndRoleLbl.textContent = '관리자 대시보드';
                return;
            }

            if (ndCart) ndCart.style.display = 'flex';
            if (ndRoleIco) ndRoleIco.textContent = '👤';
            if (ndRoleLbl) ndRoleLbl.textContent = '마이페이지';
        }

        function toggleUserDropdown(e) {
            if (e) e.stopPropagation();

            var dropdown = document.getElementById('nav-dropdown');
            if (dropdown) {
                dropdown.classList.toggle('open');
            }
        }

        function goRolePage() {
            var token = getNavToken();
            var role  = getNavRole();

            if (!token) {
                location.href = '/login';
                return;
            }

            if (role === 'ADMIN') {
                location.href = '/admin/dashboard';
                return;
            }

            if (role === 'SELLER') {
                location.href = '/farmer';
                return;
            }

            location.href = '/mypage';
        }

        function clearNavAuthState() {
            ['token', 'email', 'role', 'name', 'currentUserId'].forEach(function(k) {
                localStorage.removeItem(k);
                sessionStorage.removeItem(k);
            });

            // 프로젝트에서 jwt 쿠키를 같이 쓰는 경우가 있어서 로그아웃 시 화면 상태가 남지 않도록 쿠키도 만료 처리합니다.
            document.cookie = 'jwt=; Max-Age=0; path=/';
            document.cookie = 'jwt=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/';
        }

        function handleNavLogout() {
            clearNavAuthState();
            refreshNavUserUI();

            try {
                if (typeof doLogout === 'function') {
                    doLogout();
                }
            } catch (e) {}

            setTimeout(function() {
                location.href = '/login';
            }, 80);
        }

        function updateCartBadge() {
            var token = getNavToken();
            var role = getNavRole();
            var badge = document.getElementById('cartBadge');

            if (!badge) return;

            if (!token || role === 'SELLER' || role === 'ADMIN') {
                badge.style.display = 'none';
                return;
            }

            fetch('/cart/data', {
                headers: { 'Authorization': 'Bearer ' + token },
                credentials: 'same-origin'
            })
                .then(function(res) {
                    if (!res.ok) {
                        badge.style.display = 'none';
                        return null;
                    }

                    return res.json();
                })
                .then(function(data) {
                    if (!data) return;

                    var count = data.items ? data.items.length : 0;

                    if (count > 0) {
                        badge.textContent = count;
                        badge.style.display = 'flex';
                    } else {
                        badge.style.display = 'none';
                    }
                })
                .catch(function() {
                    badge.style.display = 'none';
                });
        }

        async function loadNotificationCount() {
            var token = getNavToken();
            var badge = document.getElementById('notificationBadge');

            if (!token || !badge) return;

            try {
                var response = await fetch('/api/notifications/unread-count', {
                    headers: { 'Authorization': 'Bearer ' + token },
                    credentials: 'same-origin'
                });

                if (!response.ok) return;

                var data = await response.json();
                var count = data.count || 0;

                if (count > 0) {
                    badge.textContent = count > 99 ? '99+' : count;
                    badge.style.display = 'flex';
                } else {
                    badge.style.display = 'none';
                }
            } catch (e) {}
        }

        async function toggleNotificationDropdown() {
            var dropdown = document.getElementById('notificationDropdown');

            if (!dropdown) return;

            if (dropdown.style.display === 'block') {
                dropdown.style.display = 'none';
                return;
            }

            dropdown.style.display = 'block';
            await loadNotifications();
        }

        async function loadNotifications() {
            var token = getNavToken();
            var list = document.getElementById('notificationList');

            if (!list) return;

            if (!token) {
                list.innerHTML = '<div style="padding:18px;text-align:center;font-size:.78rem;color:var(--muted)">로그인 후 알림을 확인할 수 있어요.</div>';
                return;
            }

            try {
                var response = await fetch('/api/notifications', {
                    headers: { 'Authorization': 'Bearer ' + token },
                    credentials: 'same-origin'
                });

                var data = await response.json();

                if (!response.ok || !Array.isArray(data)) {
                    list.innerHTML = '<div style="padding:18px;text-align:center;font-size:.78rem;color:var(--muted)">알림을 불러오지 못했습니다.</div>';
                    return;
                }

                if (data.length === 0) {
                    list.innerHTML = '<div style="padding:18px;text-align:center;font-size:.78rem;color:var(--muted)">새 알림이 없습니다.</div>';
                    return;
                }

                list.innerHTML = data.map(function(item) {
                    var targetUrl = escapeNotificationAttr(item.targetUrl || '');

                    return ''
                        + '<div style="position:relative;padding:13px 15px;border-bottom:1px solid var(--sand);background:' + (item.isRead ? '#fff' : 'var(--gp)') + '">'
                        + '  <button onclick="deleteNotification(' + item.id + ', event)" '
                        + '          style="position:absolute;top:8px;right:10px;border:none;background:none;color:#999;font-size:14px;cursor:pointer">✕</button>'
                        + '  <div onclick="readNotification(' + item.id + ', \'' + targetUrl + '\')" style="cursor:pointer;padding-right:18px">'
                        + '      <div style="font-size:.8rem;font-weight:700;color:var(--dark);margin-bottom:4px">' + escapeNotificationHtml(item.title) + '</div>'
                        + '      <div style="font-size:.74rem;color:var(--mid);line-height:1.5">' + escapeNotificationHtml(item.message) + '</div>'
                        + '      <div style="font-size:.66rem;color:var(--muted);margin-top:5px">' + formatNotificationDate(item.createdAt) + '</div>'
                        + '  </div>'
                        + '</div>';
                }).join('');
            } catch (e) {
                list.innerHTML = '<div style="padding:18px;text-align:center;font-size:.78rem;color:var(--muted)">알림 서버 연결 실패</div>';
            }
        }

        async function readNotification(id, targetUrl) {
            var token = getNavToken();

            if (token) {
                await fetch('/api/notifications/' + id + '/read', {
                    method: 'PATCH',
                    headers: { 'Authorization': 'Bearer ' + token },
                    credentials: 'same-origin'
                });
            }

            await loadNotificationCount();

            if (targetUrl && targetUrl !== 'null') {
                location.href = targetUrl;
            }
        }

        async function deleteNotification(id, event) {
            if (event) event.stopPropagation();

            var token = getNavToken();

            if (!token) {
                return;
            }

            try {
                var response = await fetch('/api/notifications/' + id, {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + token },
                    credentials: 'same-origin'
                });

                if (!response.ok) {
                    alert('알림 삭제 실패');
                    return;
                }

                await loadNotificationCount();
                await loadNotifications();
            } catch (e) {
                console.error(e);
            }
        }

        function escapeNotificationHtml(value) {
            return String(value == null ? '' : value)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        function escapeNotificationAttr(value) {
            return String(value == null ? '' : value)
                .replaceAll('\\', '\\\\')
                .replaceAll("'", "\\'")
                .replaceAll('\n', ' ')
                .replaceAll('\r', ' ');
        }

        function formatNotificationDate(value) {
            if (!value) return '';
            return String(value).replace('T', ' ').substring(0, 16);
        }

        function setupNavEvents() {
            if (navEventBound) return;
            navEventBound = true;

            document.addEventListener('click', function(event) {
                var userDropdown = document.getElementById('nav-dropdown');
                var notificationDropdown = document.getElementById('notificationDropdown');
                var bell = document.getElementById('bellIcon');

                if (userDropdown) {
                    userDropdown.classList.remove('open');
                }

                if (notificationDropdown && bell) {
                    if (!notificationDropdown.contains(event.target) && !bell.contains(event.target)) {
                        notificationDropdown.style.display = 'none';
                    }
                }
            });

            var bellIcon = document.getElementById('bellIcon');

            if (bellIcon) {
                bellIcon.addEventListener('click', function(event) {
                    event.preventDefault();
                    event.stopPropagation();
                    toggleNotificationDropdown();
                });
            }
        }

        function initNav() {
            refreshNavUserUI();
            setupNavEvents();
            updateCartBadge();
            loadNotificationCount();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initNav);
        } else {
            initNav();
        }
    </script>
</nav>
</body>
</html>
