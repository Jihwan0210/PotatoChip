<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="nav" id="nav">
    <div class="logo" onclick="location.href='/'" style="cursor:pointer;display:flex;align-items:center;gap:7px">
        <img src="/images/auth/farmer_logo.png" style="height:36px;width:auto;flex-shrink:0"/>
        못<span style="color:var(--green)">난이</span> <span style="color:var(--amber)">농</span>작물
    </div>
    <ul class="nav-links">
        <li><a th:href="@{/}">홈</a></li>
        <li><a th:href="@{/market}">마켓</a></li>
        <li><a th:href="@{/ranking}">판매랭킹</a></li>
        <li><a th:href="@{/board}">게시판</a></li>
        <li><a th:href="@{/faq}">FAQ</a></li>
    </ul>
    <div class="nav-r">
        <span class="n-ico" id="bellIcon" onclick="toggleNotif()" style="cursor:pointer;position:relative">🔔<span style="position:absolute;top:-2px;right:-2px;width:14px;height:14px;border-radius:50%;background:#E84040;color:#fff;font-size:.55rem;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff">2</span></span>
        <span class="n-ico" onclick="location.href='/cart'" style="cursor:pointer;position:relative">🛒<span id="cartBadge" style="position:absolute;top:-5px;right:-7px;background:var(--amber);color:#fff;font-size:.52rem;font-weight:700;min-width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0 2px;line-height:1">3</span></span>

        <!-- 로그인 시에만 보임 / 관리자 로그인시 mypage가 아닌 admin/dashboard로 이동-->
        <button type="button"
                class="n-ico"
                id="nav-mypage"
                onclick="goRolePage()"
                style="display:none;cursor:pointer;font-size:.85rem;color:var(--mid);border:none;background:transparent"
                title="마이페이지">👤</button>

        <!-- 판매자일 때만 보임 -->
        <a th:href="@{/farmer}" class="n-ico" id="nav-farmer"
           style="display:none;cursor:pointer;font-size:.85rem;color:var(--green)" title="농가 대시보드">🌾</a>

        <a th:href="@{/login}" class="btn-nav" id="btn-nav-login">로그인</a>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/auth/auth.js"></script>
    <script>
        // 로그인 상태에 따라 nav아이콘 제어
        (function() {
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            const role = localStorage.getItem('role') || sessionStorage.getItem('role') || '';
            const normalizedRole = role.toUpperCase();

            const loginButton = document.getElementById('btn-nav-login');
            const mypageButton = document.getElementById('nav-mypage');
            const farmerButton = document.getElementById('nav-farmer');

            if (!token) {
                if (mypageButton) {
                    mypageButton.style.display = 'none';
                }

                if (farmerButton) {
                    farmerButton.style.display = 'none';
                }

                if (loginButton) {
                    loginButton.textContent = '로그인';
                    loginButton.setAttribute('href', '/login');
                    loginButton.removeAttribute('onclick');
                }

                return;
            }

            if (loginButton) {
                loginButton.textContent = '로그아웃';
                loginButton.removeAttribute('href');
                loginButton.setAttribute('onclick', 'handleNavLogout()');
            }

            if (normalizedRole === 'SELLER') {
                if (farmerButton) {
                    farmerButton.style.display = 'inline-flex';
                }

                if (mypageButton) {
                    mypageButton.style.display = 'none';
                }

                return;
            }

            if (normalizedRole === 'ADMIN') {
                if (mypageButton) {
                    mypageButton.style.display = 'inline-flex';
                    mypageButton.title = '관리자 대시보드';
                    mypageButton.textContent = '🛠️';
                    mypageButton.style.color = 'var(--green)';
                }

                if (farmerButton) {
                    farmerButton.style.display = 'none';
                }

                return;
            }

            if (mypageButton) {
                mypageButton.style.display = 'inline-flex';
                mypageButton.title = '마이페이지';
                mypageButton.textContent = '👤';
                mypageButton.style.color = 'var(--mid)';
            }

            if (farmerButton) {
                farmerButton.style.display = 'none';
            }
        })();
        (function updateCartBadge() {
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            const badge = document.getElementById('cartBadge');
            if (!badge) return;

            if (!token) {
                badge.style.display = 'none';
                return;
            }

            fetch('/cart/data', {
                headers: { 'Authorization': 'Bearer ' + token }
            })
                .then(res => res.ok ? res.json() : null)
                .then(cart => {
                    const count = (cart && cart.items) ? cart.items.length : 0;
                    if (count > 0) {
                        badge.textContent = count;
                        badge.style.display = 'flex';
                    } else {
                        badge.style.display = 'none';
                    }
                })
                .catch(() => {
                    badge.style.display = 'none';
                });
        })();
        function goRolePage() {
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            const role = localStorage.getItem('role') || sessionStorage.getItem('role') || '';

            if (!token) {
                location.href = '/login';
                return;
            }

            if (role.toUpperCase() === 'ADMIN') {
                location.href = '/admin/dashboard';
                return;
            }

            location.href = '/mypage';
        }

        function handleNavLogout() {
            if (typeof doLogout === 'function') {
                doLogout();
                return;
            }

            localStorage.removeItem('token');
            localStorage.removeItem('email');
            localStorage.removeItem('role');
            localStorage.removeItem('currentUserId');

            sessionStorage.removeItem('token');
            sessionStorage.removeItem('email');
            sessionStorage.removeItem('role');
            sessionStorage.removeItem('currentUserId');

            location.href = '/login';
        }
    </script>
</nav>
</body>
</html>
