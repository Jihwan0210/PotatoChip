<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="nav" id="nav">
    <div class="logo" onclick="location.href='/'" style="cursor:pointer;display:flex;align-items:center;gap:7px">
        <img src="/images/auth/farmer_logo.png" style="height:36px;width:auto;flex-shrink:0"/>
        못<span style="color:var(--green)">난이</span> <span style="color:var(--amber)">농</span>작물
    </div>
    <ul class="nav-links">
        <li><a th:href="@{/}">홈</a></li>
        <li><a th:href="@{/market}">마켓</a></li>
        <li><a th:href="@{/ranking}">판매랭킹</a></li>
        <li><a th:href="@{/board}">게시판</a></li>
        <li><a th:href="@{/faq}">FAQ</a></li>
    </ul>
    <div class="nav-r">
        <!-- 알림 -->
        <span class="n-ico" id="bellIcon" onclick="toggleNotif()" style="cursor:pointer;position:relative">🔔<span style="position:absolute;top:-2px;right:-2px;width:14px;height:14px;border-radius:50%;background:#E84040;color:#fff;font-size:.55rem;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff">2</span></span>

        <!-- 로그인 후: 이름 버튼 + 드롭다운 -->
        <div class="nav-user-wrap" id="nav-user-wrap" style="display:none">
            <button type="button" class="btn-nav nav-user-btn" id="nav-user-btn" onclick="toggleUserDropdown(event)">
                <span id="nav-user-name">사용자</span>
                <span class="nav-arrow">▾</span>
            </button>
            <div class="nav-dropdown" id="nav-dropdown">
                <!-- BUYER: 장바구니 -->
                <div class="nd-item" id="nd-cart" onclick="location.href='/cart'" style="display:none">
                    🛒 <span>장바구니</span>
                </div>
                <!-- 역할별 페이지 링크 -->
                <div class="nd-item" id="nd-role-page" onclick="goRolePage()">
                    <span id="nd-role-ico">👤</span>
                    <span id="nd-role-label">마이페이지</span>
                </div>
                <div class="nd-divider"></div>
                <div class="nd-item nd-logout" onclick="handleNavLogout()">🚪 로그아웃</div>
            </div>
        </div>

        <!-- 비로그인 시: 로그인 버튼 -->
        <a th:href="@{/login}" class="btn-nav" id="btn-nav-login">로그인</a>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/auth/auth.js"></script>
    <script>
        (function () {
            var token     = localStorage.getItem('token')     || sessionStorage.getItem('token');
            var role      = (localStorage.getItem('role')     || sessionStorage.getItem('role')  || '').toUpperCase();
            var name      = localStorage.getItem('name')      || sessionStorage.getItem('name')  || '사용자';

            var loginBtn  = document.getElementById('btn-nav-login');
            var userWrap  = document.getElementById('nav-user-wrap');
            var userName  = document.getElementById('nav-user-name');
            var ndCart    = document.getElementById('nd-cart');
            var ndRoleIco = document.getElementById('nd-role-ico');
            var ndRoleLbl = document.getElementById('nd-role-label');

            if (!token) {
                if (loginBtn) loginBtn.style.display = '';
                if (userWrap) userWrap.style.display = 'none';
                return;
            }

            // 로그인 상태: 이름 드롭다운 표시
            if (loginBtn) loginBtn.style.display = 'none';
            if (userWrap) userWrap.style.display = 'flex';
            if (userName) userName.textContent   = name;

            if (role === 'SELLER') {
                if (ndCart)    ndCart.style.display     = 'none';
                if (ndRoleIco) ndRoleIco.textContent    = '🌾';
                if (ndRoleLbl) ndRoleLbl.textContent    = '농가 대시보드';
                return;
            }

            if (role === 'ADMIN') {
                if (ndCart)    ndCart.style.display     = 'none';
                if (ndRoleIco) ndRoleIco.textContent    = '🛠️';
                if (ndRoleLbl) ndRoleLbl.textContent    = '관리자 대시보드';
                return;
            }

            // BUYER: 드롭다운에 장바구니
            if (ndCart)  ndCart.style.display  = 'flex';
            if (ndRoleIco) ndRoleIco.textContent = '👤';
            if (ndRoleLbl) ndRoleLbl.textContent = '마이페이지';
        })();

        function toggleUserDropdown(e) {
            e.stopPropagation();
            document.getElementById('nav-dropdown').classList.toggle('open');
        }

        document.addEventListener('click', function () {
            var dd = document.getElementById('nav-dropdown');
            if (dd) dd.classList.remove('open');
        });

        function goRolePage() {
            var token = localStorage.getItem('token') || sessionStorage.getItem('token');
            var role  = (localStorage.getItem('role') || sessionStorage.getItem('role') || '').toUpperCase();
            if (!token)            { location.href = '/login'; return; }
            if (role === 'ADMIN')  { location.href = '/admin/dashboard'; return; }
            if (role === 'SELLER') { location.href = '/farmer'; return; }
            location.href = '/mypage';
        }

        function handleNavLogout() {
            if (typeof doLogout === 'function') { doLogout(); return; }
            ['token', 'email', 'role', 'name', 'currentUserId'].forEach(function (k) {
                localStorage.removeItem(k);
                sessionStorage.removeItem(k);
            });
            location.href = '/login';
        }

    </script>
</nav>
</body>
</html>
