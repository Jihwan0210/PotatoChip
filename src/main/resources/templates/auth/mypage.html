<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>못난이 농작물 - 마이페이지</title>
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" th:href="@{/css/auth/mypage.css}"/>
    <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
</head>
<body>

<div th:replace="nav :: nav"></div>

<div class="page active" id="page-mypage">
    <div class="mp-layout">

        <!-- 사이드바 -->
        <aside class="mp-sidebar">
            <div class="mp-user-box">
                <div class="mp-avatar">👤</div>
                <div class="mp-sidebar-name" id="mp-display-name">로딩 중...</div>
                <div class="mp-sidebar-email" id="mp-display-email"></div>
                <div style="display:inline-flex;align-items:center;gap:4px;background:#f0faf3;border-radius:20px;padding:4px 12px;margin-top:8px;font-size:.78rem;font-weight:700;color:var(--green)">
                    🌿 <span id="mp-display-points">0</span>P 보유
                </div>
            </div>
            <div class="mp-nav">
                <div class="mp-tab on" id="my-tab-orders"  onclick="switchMyTab('orders')">📦 주문 내역</div>
                <div class="mp-tab"    id="my-tab-wishlist" onclick="switchMyTab('wishlist')">🤍 찜 목록</div>
                <div class="mp-tab"    id="my-tab-coupon"  onclick="switchMyTab('coupon')">🎟️ 쿠폰</div>
                <div class="mp-tab"    id="my-tab-review"  onclick="switchMyTab('myreview')">✍️ 내 리뷰</div>
                <div class="mp-tab"    id="my-tab-profile" onclick="switchMyTab('profile')">⚙️ 프로필 설정</div>
            </div>
        </aside>

        <!-- 콘텐츠 -->
        <div>

            <!-- 주문 내역 -->
            <div id="mycontent-orders" style="display:block">
                <div class="mp-card">
                    <div class="mp-section-title">📦 주문 내역</div>
                    <div style="text-align:center;color:var(--muted);font-size:.84rem;padding:32px 0">주문 내역이 없어요 🌿</div>
                </div>
            </div>

            <!-- 찜 목록 -->
            <div id="mycontent-wishlist" style="display:none">
                <div class="mp-card">
                    <div class="mp-section-title">🤍 찜 목록</div>
                    <div id="wishlist-container">
                        <div class="mp-empty">로딩 중...</div>
                    </div>
                </div>
            </div>

            <!-- 쿠폰 -->
            <div id="mycontent-coupon" style="display:none">
                <div class="mp-card">
                    <div class="mp-section-title">🎟️ 쿠폰</div>
                    <div style="text-align:center;color:var(--muted);font-size:.84rem;padding:32px 0">보유한 쿠폰이 없어요 🌿</div>
                </div>
            </div>

            <!-- 내 리뷰 -->
            <div id="mycontent-myreview" style="display:none">
                <div class="mp-card">
                    <div class="mp-section-title">✍️ 내 리뷰</div>
                    <div style="text-align:center;color:var(--muted);font-size:.84rem;padding:32px 0">작성한 리뷰가 없어요 🌿</div>
                </div>
            </div>

            <!-- 프로필 설정 -->
            <div id="mycontent-profile" style="display:none">

                <!-- 기본 정보 -->
                <div class="mp-card">
                    <div class="mp-section-title">⚙️ 기본 정보</div>
                    <div class="mp-field">
                        <div>
                            <label>이름</label>
                            <input id="mp-name" type="text" readonly/>
                        </div>
                        <div>
                            <label>닉네임</label>
                            <input id="mp-nickname" type="text" readonly/>
                        </div>
                        <div>
                            <label>이메일</label>
                            <input id="mp-email" type="email" readonly/>
                        </div>
                        <div>
                            <label>전화번호</label>
                            <input id="mp-phone" type="tel" readonly/>
                        </div>
                        <div>
                            <label>주소</label>
                            <div id="mp-address-search-row" style="display:none;flex-wrap:nowrap;gap:6px;align-items:center;margin-bottom:6px">
                                <input id="mp-postcode" type="text" readonly placeholder="우편번호" style="width:110px;flex-shrink:0;background:var(--beige2);color:var(--muted)"/>
                                <button type="button" onclick="openMpAddressSearch()" style="flex-shrink:0;padding:0 14px;height:40px;background:var(--green);color:#fff;border:none;border-radius:8px;font-size:.8rem;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap">주소 검색</button>
                            </div>
                            <input id="mp-address" type="text" readonly placeholder="도로명 주소"/>
                            <input id="mp-address-detail" type="text" readonly placeholder="상세주소 (동/호수 등)" style="margin-top:6px"/>
                        </div>
                        <div class="mp-btn-row">
                            <button id="btn-edit"   class="mp-btn outline" onclick="enterEditMode()">✏️ 수정</button>
                            <button id="btn-save"   class="mp-btn green"   onclick="saveMyProfile()"  style="display:none">저장</button>
                            <button id="btn-cancel" class="mp-btn gray"    onclick="cancelEditMode()" style="display:none">취소</button>
                        </div>
                    </div>
                </div>

                <!-- 비밀번호 변경 -->
                <div class="mp-card">
                    <div class="mp-section-title">🔒 비밀번호 변경</div>
                    <div class="mp-field">
                        <div>
                            <label>현재 비밀번호</label>
                            <input id="cp-current" type="password" placeholder="현재 비밀번호 입력"/>
                        </div>
                        <div>
                            <label>새 비밀번호</label>
                            <input id="cp-new" type="password" placeholder="8자 이상, 영어+숫자+특수문자"/>
                        </div>
                        <div>
                            <label>새 비밀번호 확인</label>
                            <input id="cp-confirm" type="password" placeholder="새 비밀번호 다시 입력"/>
                        </div>
                        <div class="mp-btn-row">
                            <button class="mp-btn green" onclick="changePassword()">변경하기</button>
                        </div>
                    </div>
                </div>

                <!-- 회원 탈퇴 -->
                <div class="danger-card">
                    <div class="mp-section-title" style="color:#e74c3c">🚪 회원 탈퇴</div>
                    <p style="font-size:.82rem;color:var(--mid);line-height:1.75;margin-bottom:18px">
                        탈퇴 시 계정 정보 및 모든 활동 내역이 비활성화됩니다.<br/>
                        탈퇴 후에는 복구가 어려우니 신중하게 진행해주세요.
                    </p>
                    <div class="mp-field">
                        <div>
                            <label>비밀번호 확인</label>
                            <input id="wd-pw" type="password" placeholder="현재 비밀번호를 입력해주세요"/>
                        </div>
                        <div>
                            <label>탈퇴 사유 <span style="color:var(--muted);font-size:.7rem">*선택</span></label>
                            <textarea id="wd-reason" rows="3" placeholder="탈퇴 사유를 입력해주세요 (선택)"></textarea>
                        </div>
                        <div class="mp-btn-row">
                            <button class="mp-btn red" onclick="withdrawAccount()">탈퇴하기</button>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </div>
</div>

<div th:replace="footer :: footer"></div>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/auth/mypage.js}"></script>

</body>
</html>
