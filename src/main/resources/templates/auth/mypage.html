<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>못난이 농작물 - 마이페이지</title>
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div th:replace="nav :: nav"></div>

<div class="page active" id="page-mypage">
    <div style="display:grid;grid-template-columns:220px 1fr;min-height:100vh;background:var(--beige2)">

        <!-- 왼쪽 사이드바 -->
        <div style="background:#fff;border-right:1.5px solid var(--sand);padding:32px 0">
            <div style="padding:0 20px;margin-bottom:28px">
                <div style="width:64px;height:64px;border-radius:50%;background:var(--gp);display:flex;align-items:center;justify-content:center;font-size:2rem;margin-bottom:10px">👤</div>
                <div id="mp-display-name" style="font-family:Gaegu,cursive;font-size:1.1rem;font-weight:700;color:var(--dark)">로딩 중...</div>
                <div id="mp-display-email" style="font-size:.74rem;color:var(--muted);margin-top:2px"></div>
            </div>
            <div id="my-tab-orders"  onclick="switchMyTab('orders')"
                 style="padding:12px 20px;font-size:.82rem;color:var(--mid);cursor:pointer;border-left:3px solid transparent;display:flex;align-items:center;gap:8px">
                📦 주문 내역
            </div>
            <div id="my-tab-wishlist" onclick="switchMyTab('wishlist')"
                 style="padding:12px 20px;font-size:.82rem;color:var(--mid);cursor:pointer;border-left:3px solid transparent;display:flex;align-items:center;gap:8px">
                🤍 찜 목록
            </div>
            <div id="my-tab-coupon"  onclick="switchMyTab('coupon')"
                 style="padding:12px 20px;font-size:.82rem;color:var(--mid);cursor:pointer;border-left:3px solid transparent;display:flex;align-items:center;gap:8px">
                🎟️ 쿠폰
            </div>
            <div id="my-tab-review"  onclick="switchMyTab('myreview')"
                 style="padding:12px 20px;font-size:.82rem;color:var(--mid);cursor:pointer;border-left:3px solid transparent;display:flex;align-items:center;gap:8px">
                ✍️ 내 리뷰
            </div>
            <div id="my-tab-profile" onclick="switchMyTab('profile')"
                 style="padding:12px 20px;font-size:.82rem;color:var(--mid);cursor:pointer;border-left:3px solid transparent;display:flex;align-items:center;gap:8px;background:var(--gp);border-left:3px solid var(--green)">
                ⚙️ 프로필 설정
            </div>
        </div>

        <!-- 오른쪽 컨텐츠 -->
        <div style="padding:32px">

            <!-- 주문 내역 -->
            <div id="mycontent-orders" style="display:none">
                <div style="font-family:Gaegu,cursive;font-size:1.3rem;font-weight:700;color:var(--dark);margin-bottom:20px">📦 주문 내역</div>
                <div style="background:#fff;border:1.5px solid var(--sand);border-radius:14px;padding:40px;text-align:center;color:var(--muted);font-size:.84rem">
                    주문 내역이 없어요 🌿
                </div>
            </div>

            <!-- 찜 목록 -->
            <div id="mycontent-wishlist" style="display:none">
                <div style="font-family:Gaegu,cursive;font-size:1.3rem;font-weight:700;color:var(--dark);margin-bottom:20px">🤍 찜 목록</div>
                <div style="background:#fff;border:1.5px solid var(--sand);border-radius:14px;padding:40px;text-align:center;color:var(--muted);font-size:.84rem">
                    찜한 상품이 없어요 🌿
                </div>
            </div>

            <!-- 쿠폰 -->
            <div id="mycontent-coupon" style="display:none">
                <div style="font-family:Gaegu,cursive;font-size:1.3rem;font-weight:700;color:var(--dark);margin-bottom:20px">🎟️ 쿠폰</div>
                <div style="background:#fff;border:1.5px solid var(--sand);border-radius:14px;padding:40px;text-align:center;color:var(--muted);font-size:.84rem">
                    보유한 쿠폰이 없어요 🌿
                </div>
            </div>

            <!-- 내 리뷰 -->
            <div id="mycontent-myreview" style="display:none">
                <div style="font-family:Gaegu,cursive;font-size:1.3rem;font-weight:700;color:var(--dark);margin-bottom:20px">✍️ 내 리뷰</div>
                <div style="background:#fff;border:1.5px solid var(--sand);border-radius:14px;padding:40px;text-align:center;color:var(--muted);font-size:.84rem">
                    작성한 리뷰가 없어요 🌿
                </div>
            </div>

            <!-- 프로필 설정 -->
            <div id="mycontent-profile" style="display:block">
                <div style="font-family:Gaegu,cursive;font-size:1.3rem;font-weight:700;color:var(--dark);margin-bottom:20px">⚙️ 프로필 설정</div>
                <div style="background:#fff;border:1.5px solid var(--sand);border-radius:14px;padding:28px;max-width:520px">
                    <div style="display:flex;flex-direction:column;gap:16px">
                        <div>
                            <label style="font-size:.74rem;color:var(--muted);display:block;margin-bottom:5px">이름</label>
                            <input id="mp-name" type="text" style="width:100%;border:1.5px solid var(--sand);border-radius:9px;padding:10px 13px;font-size:.84rem;font-family:inherit;outline:none"/>
                        </div>
                        <div>
                            <label style="font-size:.74rem;color:var(--muted);display:block;margin-bottom:5px">닉네임</label>
                            <input id="mp-nickname" type="text" style="width:100%;border:1.5px solid var(--sand);border-radius:9px;padding:10px 13px;font-size:.84rem;font-family:inherit;outline:none"/>
                        </div>
                        <div>
                            <label style="font-size:.74rem;color:var(--muted);display:block;margin-bottom:5px">이메일</label>
                            <input id="mp-email" type="email" readonly style="width:100%;border:1.5px solid var(--sand);border-radius:9px;padding:10px 13px;font-size:.84rem;font-family:inherit;outline:none;background:var(--beige2);color:var(--muted)"/>
                        </div>
                        <div>
                            <label style="font-size:.74rem;color:var(--muted);display:block;margin-bottom:5px">전화번호</label>
                            <input id="mp-phone" type="tel" style="width:100%;border:1.5px solid var(--sand);border-radius:9px;padding:10px 13px;font-size:.84rem;font-family:inherit;outline:none"/>
                        </div>
                        <div>
                            <label style="font-size:.74rem;color:var(--muted);display:block;margin-bottom:5px">주소</label>
                            <input id="mp-address" type="text" style="width:100%;border:1.5px solid var(--sand);border-radius:9px;padding:10px 13px;font-size:.84rem;font-family:inherit;outline:none"/>
                        </div>
                        <button onclick="saveMyProfile()"
                                style="background:var(--green);color:#fff;border:none;border-radius:10px;padding:12px;font-size:.88rem;font-weight:600;cursor:pointer;font-family:inherit">
                            저장하기
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<div th:replace="footer :: footer"></div>
<script th:src="@{/js/auth/mypage.js}"></script>

</body>
</html>
