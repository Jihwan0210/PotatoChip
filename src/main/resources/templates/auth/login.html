<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>못난이 농작물</title>
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <style>
        .fg input, .fg select { border: 1.5px solid var(--sand); border-radius: 8px; }
        .fg.error input, .fg.error select { border-color: #e74c3c; }
        .fg-err { color: #e74c3c; font-size: .76rem; margin-top: 4px; display: none; }
        .fg.error .fg-err { display: block; }
    </style>
</head>
<body>

<div th:replace="nav :: nav"></div>

<div class="page active" id="page-login">
    <div class="login-bg">
        <div class="login-box">
            <div style="font-family:Gaegu,cursive;font-size:1.5rem;font-weight:700;text-align:center;margin-bottom:4px">
                못<span style="color:var(--green)">난이</span> <span style="color:var(--amber)">농</span>작물
            </div>
            <div style="font-size:.76rem;color:var(--muted);text-align:center;margin-bottom:22px">
                폐기될 뻔한 농산물을 한 상으로 담다 🌿
            </div>

            <div class="l-tabs">
                <div class="l-tab on" id="tab-l" onclick="swTab('login')">로그인</div>
                <div class="l-tab" id="tab-s" onclick="swTab('signup')">회원가입</div>
            </div>

            <!-- 로그인 폼 -->
            <div id="lf">
                <div class="fg">
                    <label>이메일</label>
                    <input id="le" placeholder="이메일을 입력해주세요" type="email"/>
                </div>
                <div class="fg">
                    <label>비밀번호</label>
                    <input id="lp" onkeydown="if(event.key==='Enter')doLogin()" placeholder="비밀번호를 입력해주세요" type="password"/>
                </div>
                <div class="f-extra">
                    <label class="f-rem"><input type="checkbox"/> 로그인 상태 유지</label>
                    <span class="f-forgot">비밀번호 찾기</span>
                </div>
                <button class="btn-submit" onclick="doLogin()">로그인 →</button>

                <div class="l-divider">또는</div>

                <div class="soc-btns">
                    <button class="soc-btn kakao" onclick="alert('카카오 로그인은 준비 중이에요!')">💬 카카오</button>
                    <button class="soc-btn naver" onclick="alert('네이버 로그인은 준비 중이에요!')">N 네이버</button>
                </div>

                <p class="sw-txt">아직 계정이 없으신가요? <a onclick="swTab('signup')">회원가입</a></p>
            </div>

            <!-- 회원가입 폼 -->
            <div id="sf" style="display:none">
                <div class="name-row">
                    <div class="fg">
                        <label>이름</label>
                        <input name="name" placeholder="이름" type="text" onblur="filterKorean(this)"/>
                        <div class="fg-err"></div>
                    </div>
                    <div class="fg">
                        <label>역할</label>
                        <select name="role" onchange="toggleRoleFields(this)">
                            <option>구매자</option>
                            <option>판매자(농가)</option>
                        </select>
                    </div>
                </div>
                <div class="fg">
                    <label>이메일</label>
                    <input name="email" placeholder="이메일을 입력해주세요" type="text" oninput="filterEmailChars(this)"/>
                    <div class="fg-err"></div>
                </div>
                <div class="fg">
                    <label>비밀번호</label>
                    <input name="password" placeholder="8자 이상 입력해주세요" type="password" oninput="filterPasswordChars(this)"/>
                    <div class="fg-err"></div>
                </div>
                <div class="fg">
                    <label>비밀번호 확인</label>
                    <input name="passwordConfirm" placeholder="비밀번호를 다시 입력해주세요" type="password"/>
                    <div class="fg-err"></div>
                </div>
                <div class="fg">
                    <label>전화번호</label>
                    <input name="phone" placeholder="숫자만 입력해주세요" type="tel" maxlength="11" oninput="filterDigits(this)"/>
                    <div class="fg-err"></div>
                </div>
                <div class="fg" id="addressGroup">
                    <label>주소</label>
                    <input name="address" placeholder="배송받을 주소를 입력해주세요" type="text"/>
                    <div class="fg-err"></div>
                </div>
                <div class="fg" id="nicknameGroup">
                    <label>닉네임 <span style="color:var(--muted);font-size:.72rem">*선택</span></label>
                    <input name="nickname" placeholder="닉네임을 입력해주세요" type="text" onblur="filterNicknameChars(this)"/>
                    <div class="fg-err"></div>
                </div>
                <button class="btn-submit" onclick="doSignup()">가입하기 →</button>
                <p class="sw-txt" style="margin-top:10px">
                    <a onclick="swTab('login')">← 로그인으로 돌아가기</a>
                </p>
            </div>

            <!-- 성공 화면 -->
            <div class="success-view" id="sv">
                <span class="success-ico">🎉</span>
                <h3 id="sv-t" style="font-family:Gaegu,cursive;font-size:1.3rem;color:var(--dark);margin-bottom:8px">로그인 성공!</h3>
                <p id="sv-m" style="font-size:.82rem;color:var(--mid);line-height:1.7;margin-bottom:20px">
                    못난이 농작물에 오신 것을 환영해요! 🌿
                </p>
                <button class="btn-submit" onclick="location.href='/'">
                    메인으로 가기 →
                </button>
            </div>

        </div>
    </div>
</div>

<div th:replace="footer :: footer"></div>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/auth/auth.js}"></script>

</body>
</html>
