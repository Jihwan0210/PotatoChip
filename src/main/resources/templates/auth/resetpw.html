<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>비밀번호 재설정 - 못난이 농작물</title>
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" th:href="@{/css/auth/resetpw.css}"/>
</head>
<body>

<div th:replace="nav :: nav"></div>

<div class="login-bg">
    <div class="login-box">
        <div style="font-family:Gaegu,cursive;font-size:1.5rem;font-weight:700;text-align:center;margin-bottom:4px">
            못<span style="color:var(--green)">난이</span> <span style="color:var(--amber)">농</span>작물
        </div>
        <div style="font-size:.76rem;color:var(--muted);text-align:center;margin-bottom:22px">
            새로운 비밀번호를 설정해주세요 🔒
        </div>

        <!-- 비밀번호 재설정 폼 -->
        <div id="rpf">
            <div class="fg" id="rp-fg1">
                <label>새 비밀번호</label>
                <div class="pw-wrap">
                    <input id="rp1" placeholder="8자 이상, 영어+숫자+특수문자" type="password"/>
                    <button type="button" class="pw-eye" onclick="togglePw(this)"><i class="ti ti-eye"></i></button>
                </div>
                <div class="fg-err" id="rp1-err"></div>
            </div>
            <div class="fg" id="rp-fg2">
                <label>비밀번호 확인</label>
                <div class="pw-wrap">
                    <input id="rp2" placeholder="비밀번호를 다시 입력해주세요" type="password"/>
                    <button type="button" class="pw-eye" onclick="togglePw(this)"><i class="ti ti-eye"></i></button>
                </div>
                <div class="fg-err" id="rp2-err"></div>
            </div>
            <button class="btn-submit" onclick="doResetPw()">변경하기 →</button>
        </div>

        <!-- 완료 화면 -->
        <div id="rpv" style="display:none;text-align:center;padding:16px 0">
            <span style="font-size:3rem;display:block;margin-bottom:12px">✅</span>
            <h3 style="font-family:Gaegu,cursive;font-size:1.3rem;color:var(--dark);margin-bottom:8px">비밀번호 변경 완료!</h3>
            <p style="font-size:.82rem;color:var(--mid);line-height:1.7;margin-bottom:20px">
                새 비밀번호로 로그인해주세요 🌿
            </p>
            <button class="btn-submit" onclick="location.href='/login'">로그인하러 가기 →</button>
        </div>
    </div>
</div>

<div th:replace="footer :: footer"></div>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/auth/resetpw.js}"></script>

</body>
</html>
