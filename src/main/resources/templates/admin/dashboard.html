<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>관리자 대시보드 | 못난이 농작물</title>
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" href="/css/style.css" rel="stylesheet"/>
    <style>
        .admin-page{min-height:100vh;padding-top:64px;background:linear-gradient(160deg,var(--beige2) 0%,var(--beige3) 48%,var(--gp) 100%)}
        .admin-head{background:#fff;border-bottom:1.5px solid var(--beige);padding:34px 6% 26px;display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
        .admin-kicker{font-size:.68rem;color:var(--green);letter-spacing:1px;font-weight:700;margin-bottom:8px}
        .admin-title{font-family:'Gaegu',cursive;font-size:clamp(1.8rem,3vw,2.5rem);font-weight:700;color:var(--dark)}
        .admin-desc{color:var(--light);font-size:.84rem;line-height:1.7;margin-top:8px;max-width:680px}
        .admin-wrap{max-width:1480px;margin:0 auto;padding:30px 3% 80px}
        .admin-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
        .admin-tab{border:1.5px solid var(--beige);background:#fff;color:var(--mid);border-radius:100px;padding:9px 15px;font-family:inherit;font-size:.76rem;font-weight:700;cursor:pointer}
        .admin-tab.on{background:var(--green);border-color:var(--green);color:#fff}
        .admin-section{display:none}
        .admin-section.on{display:block}
        .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
        .stat-card{background:#fff;border:1.5px solid var(--beige);border-radius:18px;padding:18px;box-shadow:0 8px 24px rgba(90,74,58,.06)}
        .stat-label{font-size:.72rem;color:var(--muted);font-weight:700;margin-bottom:7px}
        .stat-value{font-family:'Gaegu',cursive;font-size:1.8rem;font-weight:700;color:var(--dark)}
        .admin-card{background:#fff;border:1.5px solid var(--beige);border-radius:18px;padding:20px;box-shadow:0 8px 26px rgba(90,74,58,.07);margin-bottom:14px}
        .admin-card-title{font-family:'Gaegu',cursive;font-size:1.25rem;font-weight:700;color:var(--dark);margin-bottom:12px}
        .admin-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
        .admin-search{border:1.5px solid var(--beige);border-radius:100px;background:#fff;padding:9px 14px;font-family:inherit;font-size:.76rem;min-width:220px;outline:none;color:var(--dark)}
        .admin-search-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
        .admin-select{border:1.5px solid var(--beige);border-radius:100px;background:#fff;padding:9px 12px;font-family:inherit;font-size:.76rem;font-weight:700;outline:none;color:var(--mid);cursor:pointer}
        .admin-select:focus{border-color:var(--green)}
        .admin-search:focus{border-color:var(--green)}
        .admin-table-wrap{overflow-x:visible;padding-bottom:6px}
        .admin-table{width:100%;border-collapse:collapse;min-width:0;table-layout:fixed}
        .admin-table th{background:var(--beige3);color:var(--mid);font-size:.72rem;text-align:left;padding:11px;border-bottom:1px solid var(--beige);white-space:nowrap}
        .admin-table td{font-size:.76rem;color:var(--dark);padding:10px;border-bottom:1px solid var(--beige);vertical-align:top;word-break:keep-all;overflow-wrap:anywhere}
        .admin-table tr:hover td{background:#fffaf0}
        .sort-th{cursor:pointer;user-select:none}
        .sort-th:hover{color:var(--green)}
        .admin-btn{border:none;border-radius:100px;padding:7px 11px;font-size:.7rem;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap}
        .admin-btn.green{background:var(--green);color:#fff}
        .admin-btn.amber{background:var(--amber);color:#fff}
        .admin-btn.gray{background:#eee;color:#777}
        .admin-btn.red{background:#f2dddd;color:#b23b3b}
        .status-chip{display:inline-flex;border-radius:100px;padding:4px 8px;font-size:.65rem;font-weight:700;background:var(--gp);color:var(--green)}
        .status-chip.warn{background:#fff4d8;color:#b47a00}
        .status-chip.hidden{background:#eee;color:#777}
        .empty{padding:24px;text-align:center;color:var(--muted);font-size:.82rem}
        .detail-box{display:none;background:var(--beige3);border:1.5px solid var(--beige);border-radius:18px;padding:18px;margin-top:14px}
        .detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;align-items:stretch}
        .seller-detail-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
        .seller-detail-grid .mini-card{min-width:0}
        .mini-card{background:#fff;border:1px solid var(--beige);border-radius:14px;padding:12px;height:200px;max-height:200px;display:flex;flex-direction:column;min-width:0;overflow:hidden;box-sizing:border-box}
        .mini-title{font-weight:700;color:var(--dark);font-size:.8rem;margin-bottom:6px;flex-shrink:0}
        .mini-text{font-size:.72rem;color:var(--mid);line-height:1.45;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:5px;white-space:normal;word-break:keep-all;overflow-wrap:anywhere;max-width:100%;box-sizing:border-box}
        .review-table{min-width:0}
        .review-table th,.review-table td{padding:9px 8px}
        .review-table th:nth-child(1),.review-table td:nth-child(1){width:48px}
        .review-table th:nth-child(2),.review-table td:nth-child(2){width:150px}
        .review-table th:nth-child(3),.review-table td:nth-child(3){width:105px}
        .review-table th:nth-child(4),.review-table td:nth-child(4){width:88px}
        .review-table th:nth-child(5),.review-table td:nth-child(5){width:230px;line-height:1.6}
        .review-table th:nth-child(6),.review-table td:nth-child(6){width:66px}
        .review-table th:nth-child(7),.review-table td:nth-child(7){width:70px}
        .review-table th:nth-child(8),.review-table td:nth-child(8){width:84px}
        .review-table th:nth-child(9),.review-table td:nth-child(9){width:78px}
        .review-content-cell{white-space:normal;word-break:keep-all;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
        .review-thumb{width:42px;height:42px;object-fit:cover;border-radius:10px;border:1px solid var(--beige);background:var(--beige3)}
        .admin-click-row{cursor:pointer}
        .review-action-group{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
        .review-hidden-row td{background:#f7f1e8!important;color:#999}
        .cell-main{display:block;line-height:1.55;color:var(--dark);font-weight:600}
        .cell-sub{display:block;margin-top:3px;color:var(--muted);font-size:.68rem;line-height:1.3}
        .admin-pagination {display: flex;justify-content: center;align-items: center;gap: 6px;margin-top: 18px;flex-wrap: wrap;}
        .admin-pagination button {min-width: 34px;height: 34px;border: 1.5px solid var(--sand, #e8dcc7);background: #fff;color: var(--mid);border-radius: 8px;font-size: .78rem;cursor: pointer;font-family: inherit;}
        .admin-pagination button.on {background: var(--green);color: #fff;border-color: var(--green);font-weight: 700;}
        .admin-pagination button:disabled {opacity: .35;cursor: not-allowed;}

        .top-detail{margin-top:0;margin-bottom:14px}
        .detail-close-row{display:flex;justify-content:flex-end;margin-bottom:8px}
        .mini-scroll{max-height:100%;overflow-y:auto!important;overflow-x:hidden!important}
        .mini-text::-webkit-scrollbar{width:7px}
        .mini-text::-webkit-scrollbar-thumb{background:var(--beige);border-radius:100px}
        .mini-list{display:flex;flex-direction:column;gap:6px}
        .mini-list-item{padding:6px 0;border-bottom:1px dashed var(--beige);line-height:1.35}
        .mini-list-item:last-child{border-bottom:none}
        .mini-list-title{display:block;color:var(--dark);font-weight:700;margin-bottom:0}
        .mini-list-sub{display:block;color:var(--muted);font-size:.67rem;line-height:1.35}
        .mini-list{max-width:100%;overflow-x:hidden}
        .mini-list-item{min-height:34px;box-sizing:border-box;max-width:100%;overflow:hidden}
        .mini-list-title,.mini-list-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
        .mini-text::-webkit-scrollbar:horizontal{height:0}
        .mini-text{scrollbar-width:thin}

        .summary-dashboard{display:block}
        .summary-hero-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
        .summary-hero-card{background:#fff;border:1.5px solid var(--beige);border-radius:20px;padding:18px;box-shadow:0 8px 24px rgba(90,74,58,.06)}
        .summary-hero-icon{font-size:1.35rem;margin-bottom:8px}
        .summary-hero-label{font-size:.72rem;color:var(--muted);font-weight:700;margin-bottom:6px}
        .summary-hero-value{font-family:'Gaegu',cursive;font-size:2rem;font-weight:700;color:var(--dark)}
        .summary-hero-sub{margin-top:6px;font-size:.68rem;color:var(--muted);line-height:1.45}
        .summary-group-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
        .summary-group-card{background:#fff;border:1.5px solid var(--beige);border-radius:20px;padding:18px;box-shadow:0 8px 26px rgba(90,74,58,.07)}
        .summary-group-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
        .summary-group-title strong{font-family:'Gaegu',cursive;font-size:1.25rem;color:var(--dark)}
        .summary-group-title span{font-size:.68rem;color:var(--muted)}
        .summary-row{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--beige);padding:10px 0;font-size:.8rem}
        .summary-row:first-of-type{border-top:none}
        .summary-row-label{color:var(--mid);font-weight:700}
        .summary-row-value{color:var(--dark);font-weight:800}
        .summary-row-value.warn{color:#b47a00}
        
        .admin-filter-switch{display:inline-flex;background:var(--beige3);border:1.5px solid var(--beige);border-radius:100px;padding:3px;gap:3px}
        .admin-filter-switch button{border:none;background:transparent;color:var(--mid);border-radius:100px;padding:7px 12px;font-size:.72rem;font-weight:700;font-family:inherit;cursor:pointer}
        .admin-filter-switch button.on{background:var(--green);color:#fff}
        .admin-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:100000;align-items:center;justify-content:center;padding:20px}
        .admin-modal-card{width:100%;max-width:1080px;max-height:92vh;overflow-y:auto;overflow-x:hidden;background:#fff;border-radius:22px;padding:24px;box-shadow:0 18px 54px rgba(0,0,0,.22);box-sizing:border-box}
        #adminUserModal .admin-modal-card{max-width:1240px}
        #adminInquiryImageModal{z-index:100002}
        .admin-modal-card *{box-sizing:border-box;max-width:100%}
        .admin-modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
        .admin-modal-title{font-family:'Gaegu',cursive;font-size:1.45rem;font-weight:700;color:var(--dark);margin:0}
        .admin-modal-close{border:none;background:transparent;font-size:1.25rem;cursor:pointer;color:var(--muted)}
        .admin-modal-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
        .admin-modal-info-card{background:var(--beige3);border:1.5px solid var(--beige);border-radius:14px;padding:12px;min-width:0}
        .admin-modal-info-label{font-size:.67rem;color:var(--muted);font-weight:700;margin-bottom:5px}
        .admin-modal-info-value{font-size:.8rem;color:var(--dark);font-weight:700;word-break:keep-all;overflow-wrap:anywhere;line-height:1.55}
        .admin-modal-section{background:#fff;border:1.5px solid var(--beige);border-radius:16px;padding:14px;margin-top:10px}
        .admin-modal-section-title{font-size:.82rem;color:var(--dark);font-weight:800;margin-bottom:8px}
        .admin-modal-text{font-size:.82rem;color:var(--mid);line-height:1.8;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
        .admin-review-modal-image{max-width:100%;max-height:360px;object-fit:contain;border-radius:14px;border:1.5px solid var(--beige);background:#fff}
        .user-table th,.user-table td{padding:9px 8px;vertical-align:middle}
        .user-table th:nth-child(1),.user-table td:nth-child(1){width:46px}
        .user-table th:nth-child(2),.user-table td:nth-child(2){width:84px}
        .user-table th:nth-child(3),.user-table td:nth-child(3){width:220px}
        .user-table th:nth-child(4),.user-table td:nth-child(4){width:120px}
        .user-table th:nth-child(5),.user-table td:nth-child(5){width:112px}
        .user-table th:nth-child(6),.user-table td:nth-child(6),.user-table th:nth-child(7),.user-table td:nth-child(7),.user-table th:nth-child(8),.user-table td:nth-child(8){width:62px;text-align:center}
        .user-table th:nth-child(9),.user-table td:nth-child(9){width:90px}
        .user-table th:nth-child(10),.user-table td:nth-child(10){width:78px;text-align:center}
        .admin-ellipsis{display:block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .mini-list-item.clickable{cursor:pointer;border-radius:10px;padding:7px 8px;margin:0 -4px;transition:background .15s}
        .mini-list-item.clickable:hover{background:#fffaf0}
        .mini-list-row{display:flex;align-items:center;justify-content:space-between;gap:10px;line-height:1.45}
        .mini-list-row .mini-list-title{margin-bottom:0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .mini-list-row .mini-list-sub{margin-top:0;white-space:nowrap;flex-shrink:0}
        .mini-list-row.compact{min-height:20px}
        #adminUserModal{z-index:100000}
        #adminReviewModal,#adminInquiryModal,#adminOrderModal,#adminProductModal{z-index:100001}
        .admin-inquiry-table th:nth-child(1),.admin-inquiry-table td:nth-child(1){width:64px}
        .admin-inquiry-table th:nth-child(2),.admin-inquiry-table td:nth-child(2){width:108px}
        .admin-inquiry-table th:nth-child(3),.admin-inquiry-table td:nth-child(3){width:78px}
        .admin-inquiry-table th:nth-child(4),.admin-inquiry-table td:nth-child(4){width:92px}
        .admin-inquiry-table th:nth-child(5),.admin-inquiry-table td:nth-child(5){width:210px}
        .admin-inquiry-table th:nth-child(6),.admin-inquiry-table td:nth-child(6){width:110px}
        .admin-inquiry-table th:nth-child(7),.admin-inquiry-table td:nth-child(7){width:132px}
        .admin-inquiry-table th:nth-child(8),.admin-inquiry-table td:nth-child(8){width:132px}
        .admin-inquiry-table th:nth-child(9),.admin-inquiry-table td:nth-child(9){width:82px}
        .admin-inquiry-table th:nth-child(10),.admin-inquiry-table td:nth-child(10){width:88px}
        .admin-inquiry-title-cell{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
@media(max-width:900px){.summary-hero-grid,.summary-group-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.admin-modal-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
        @media(max-width:560px){.summary-hero-grid,.summary-group-grid,.admin-modal-grid{grid-template-columns:1fr}}
        @media(max-width:1100px){.seller-detail-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
        @media(max-width:860px){.detail-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
        @media(max-width:720px){.admin-head{padding:28px 6% 22px}.admin-search{width:100%}.detail-grid,.seller-detail-grid{grid-template-columns:1fr}}
    </style>
</head>
<body>
<div th:replace="~{nav :: nav}"></div>

<main class="admin-page">
    <section class="admin-head">
        <div>
            <div class="admin-kicker">Admin Dashboard</div>
            <h1 class="admin-title">관리자 대시보드 🛠️</h1>
            <p class="admin-desc">회원, 상품, 주문, 리뷰, 문의 현황을 한 번에 확인하고 운영 관리할 수 있는 관리자 전용 화면입니다.</p>
        </div>
       </section>

    <section class="admin-wrap">
        <div class="admin-tabs">
            <button class="admin-tab on" type="button" onclick="switchAdminTab('summary', this)">전체 현황</button>
            <button class="admin-tab" type="button" onclick="switchAdminTab('buyers', this)">구매자 관리</button>
            <button class="admin-tab" type="button" onclick="switchAdminTab('sellers', this)">판매자 관리</button>
            <button class="admin-tab" type="button" onclick="switchAdminTab('products', this)">상품 관리</button>
            <button class="admin-tab" type="button" onclick="switchAdminTab('orders', this)">주문 관리</button>
            <button class="admin-tab" type="button" onclick="switchAdminTab('reviews', this)">리뷰 관리</button>
            <button class="admin-tab" type="button" onclick="switchAdminTab('inquiries', this)">문의 관리</button>
        </div>

        <div id="section-summary" class="admin-section on">
            <div id="summaryGrid" class="stat-grid"></div>
        </div>

        <div id="section-buyers" class="admin-section">
            <div id="buyerDetail" class="detail-box top-detail"></div>
            <div class="admin-card">
                <div class="admin-card-title">구매자 관리</div>
                <div class="admin-tools">
                    <div class="admin-search-group"><select id="buyersSearchField" class="admin-select"><option value="all">전체</option><option value="name">이름</option><option value="email">이메일</option><option value="nickname">닉네임</option><option value="phone">전화번호</option><option value="address">주소</option></select><input id="buyersSearch" class="admin-search" type="text" placeholder="검색어 입력"></div>
                </div>
                <div id="buyersTable" class="admin-table-wrap"></div>
            </div>
        </div>

        <div id="section-sellers" class="admin-section">
            <div id="sellerDetail" class="detail-box top-detail"></div>
            <div class="admin-card">
                <div class="admin-card-title">판매자 관리</div>
                <div class="admin-tools">
                    <div class="admin-search-group"><select id="sellersSearchField" class="admin-select"><option value="all">전체</option><option value="name">이름</option><option value="email">이메일</option><option value="nickname">닉네임</option><option value="phone">전화번호</option><option value="address">주소</option></select><input id="sellersSearch" class="admin-search" type="text" placeholder="검색어 입력"></div>
                </div>
                <div id="sellersTable" class="admin-table-wrap"></div>
            </div>
        </div>

        <div id="section-products" class="admin-section">
            <div class="admin-card">
                <div class="admin-card-title">상품 관리</div>
                <div class="admin-tools">
                    <div class="admin-search-group"><select id="productsSearchField" class="admin-select"><option value="all">전체</option><option value="name">상품명</option><option value="sellerName">판매자</option><option value="category">카테고리</option><option value="statusText">상태</option><option value="origin">원산지</option></select><input id="productsSearch" class="admin-search" type="text" placeholder="검색어 입력"></div>
                </div>
                <div id="productsTable" class="admin-table-wrap"></div>
            </div>
        </div>

        <div id="section-orders" class="admin-section">
            <div class="admin-card">
                <div class="admin-card-title">주문 관리</div>
                <div class="admin-tools">
                    <div class="admin-search-group"><select id="ordersSearchField" class="admin-select"><option value="all">전체</option><option value="orderNumber">주문번호</option><option value="buyerName">구매자</option><option value="status">주문상태</option><option value="deliveryType">배송방식</option><option value="paymentMethod">결제수단</option></select><input id="ordersSearch" class="admin-search" type="text" placeholder="검색어 입력"></div>
                </div>
                <div id="ordersTable" class="admin-table-wrap"></div>
            </div>
        </div>

        <div id="section-reviews" class="admin-section">
            <div class="admin-card">
                <div class="admin-card-title">리뷰 관리</div>
                <div class="admin-tools">
                    <div class="admin-search-group"><select id="reviewsSearchField" class="admin-select"><option value="all">전체</option><option value="productName">상품명</option><option value="userName">작성자</option><option value="content">리뷰 내용</option><option value="statusText">상태</option><option value="rating">평점</option></select><input id="reviewsSearch" class="admin-search" type="text" placeholder="검색어 입력"></div>
                </div>
                <div id="reviewsTable" class="admin-table-wrap"></div>
            </div>
        </div>

        <div id="section-inquiries" class="admin-section">
            <div class="admin-card">
                <div class="admin-card-title">문의 관리</div>
                <div class="admin-tools">

<script>
    var adminData={
        buyers:[],
        sellers:[],
        products:[],
        orders:[],
        reviews:[],
        inquiries:[]
    };
    var adminCurrentUserDetail=null;

    var adminState={
        buyers:{keyword:'',searchField:'all',sortKey:'createdAt',sortDir:'desc'},
        sellers:{keyword:'',searchField:'all',sortKey:'createdAt',sortDir:'desc'},
        products:{keyword:'',searchField:'all',sortKey:'createdAt',sortDir:'desc'},
        orders:{keyword:'',searchField:'all',sortKey:'createdAt',sortDir:'desc'},
        reviews:{keyword:'',searchField:'all',sortKey:'createdAt',sortDir:'desc'},
        inquiries:{keyword:'',searchField:'all',statusFilter:'all',sortKey:'createdAt',sortDir:'desc'}
    };

    const adminPaging = {
        buyers: { page: 1, size: 10 },
        sellers: { page: 1, size: 10 },
        products: { page: 1, size: 10 },
        orders: { page: 1, size: 10 },
        reviews: { page: 1, size: 10 },
        inquiries: { page: 1, size: 10 }
    };

    document.addEventListener('DOMContentLoaded',function(){
        var initialTab=new URLSearchParams(location.search).get('tab')||'summary';
        var button=findAdminTabButton(initialTab);
        switchAdminTab(initialTab,button,true);
    });

    document.addEventListener('input',function(event){
        if(event.target.id==='buyersSearch'){
            adminState.buyers.keyword=event.target.value;
            resetAdminPage('buyers');
            renderBuyers();
        }

        if(event.target.id==='sellersSearch'){
            adminState.sellers.keyword=event.target.value;
            resetAdminPage('sellers');
            renderSellers();
        }

        if(event.target.id==='productsSearch'){
            adminState.products.keyword=event.target.value;
            resetAdminPage('products');
            renderProducts();
        }

        if(event.target.id==='ordersSearch'){
            adminState.orders.keyword=event.target.value;
            resetAdminPage('orders');
            renderOrders();
        }

        if(event.target.id==='reviewsSearch'){
            adminState.reviews.keyword=event.target.value;
            resetAdminPage('reviews');
            renderReviews();
        }

        if(event.target.id==='inquiriesSearch'){
            adminState.inquiries.keyword=event.target.value;
            resetAdminPage('inquiries');
            renderInquiries();
        }
    });

    document.addEventListener('change',function(event){
        var map={
            buyersSearchField:'buyers',
            sellersSearchField:'sellers',
            productsSearchField:'products',
            ordersSearchField:'orders',
            reviewsSearchField:'reviews',
            inquiriesSearchField:'inquiries'
        };

        var type=map[event.target.id];
        if(!type) return;

        adminState[type].searchField=event.target.value;
        resetAdminPage(type);

        if(type==='buyers')renderBuyers();
        if(type==='sellers')renderSellers();
        if(type==='products')renderProducts();
        if(type==='orders')renderOrders();
        if(type==='reviews')renderReviews();
        if(type==='inquiries')renderInquiries();
    });

    async function adminFetch(url,options){
        options=options||{};
        return await fetch(url,options);
    }

    function switchAdminTab(tab,element,skipUrl){
        document.querySelectorAll('.admin-tab').forEach(function(button){
            button.classList.remove('on');
        });

        if(!element){
            element=findAdminTabButton(tab);
        }

        if(element){
            element.classList.add('on');
        }

        document.querySelectorAll('.admin-section').forEach(function(section){
            section.classList.remove('on');
        });

        var target=document.getElementById('section-'+tab);

        if(target){
            target.classList.add('on');
        }

        if(!skipUrl){
            setAdminTabUrl(tab);
        }

        if(tab==='summary')loadSummary();
        if(tab==='buyers')loadBuyers();
        if(tab==='sellers')loadSellers();
        if(tab==='products')loadProducts();
        if(tab==='orders')loadOrders();
        if(tab==='reviews')loadReviews();
        if(tab==='inquiries')loadInquiries();
    }

    function findAdminTabButton(tab){
        var buttons=document.querySelectorAll('.admin-tab');
        for(var i=0;i<buttons.length;i++){
            var onclick=buttons[i].getAttribute('onclick')||'';
            if(onclick.indexOf("'"+tab+"'")>=0 || onclick.indexOf('"'+tab+'"')>=0){
                return buttons[i];
            }
        }
        return null;
    }

    function setAdminTabUrl(tab){
        var url=new URL(location.href);
        url.searchParams.set('tab',tab);
        history.replaceState(null,'',url.pathname+url.search+url.hash);
    }

    async function loadSummary(){
        var grid=document.getElementById('summaryGrid');
        grid.className='summary-dashboard';
        grid.innerHTML='<div class="empty">전체 현황을 불러오는 중입니다.</div>';

        try{
            var response=await adminFetch('/api/admin/dashboard/summary');
            var data=await response.json();
            var recentReviewCount=Number(data.recentReviewCount||0);

            grid.innerHTML=
                '<div class="summary-hero-grid">'
                +summaryHeroCard('👥','전체 회원',data.totalUserCount,'관리자를 제외한 구매자와 판매자 수')
                +summaryHeroCard('🥬','등록 상품',data.productCount,'마켓에 등록된 전체 상품 수')
                +summaryHeroCard('📦','전체 주문',data.orderCount,'지금까지 발생한 전체 주문 수')
                +summaryHeroCard('✍️','전체 리뷰',data.reviewCount,'사용자가 작성한 전체 리뷰 수')
                +'</div>'
                +'<div class="summary-group-grid">'
                +summaryGroupCard('👥 회원 현황','관리자 제외 집계',[
                    ['전체 회원',data.totalUserCount,'명',false],
                    ['구매자',data.buyerCount,'명',false],
                    ['판매자',data.sellerCount,'명',false]
                ])
                +summaryGroupCard('🥬 상품 / 마켓 현황','상품 운영 규모',[
                    ['등록 상품',data.productCount,'개',false],
                    ['상품 관리','상품 관리 탭에서 상세 확인','',false]
                ])
                +summaryGroupCard('📦 주문 / 운영 현황','주문 흐름',[
                    ['전체 주문',data.orderCount,'건',false],
                    ['주문 상세','주문 관리 탭에서 확인','',false]
                ])
                +summaryGroupCard('✍️ 고객 활동 현황','리뷰와 문의 활동',[
                    ['전체 리뷰',data.reviewCount,'개',false],
                    ['최근 7일 리뷰',recentReviewCount,'개',false],
                    ['문의 관리','문의 관리 탭에서 확인','',false]
                ])
                +'</div>';
        }catch(error){
            grid.innerHTML='<div class="empty">전체 현황을 불러오지 못했습니다.</div>';
        }
    }

    async function loadBuyers(){
        var box=document.getElementById('buyersTable');
        box.innerHTML='<div class="empty">구매자 목록을 불러오는 중입니다.</div>';

        try{
            var response=await adminFetch('/api/admin/dashboard/buyers');
            adminData.buyers=await response.json();
            renderBuyers();
        }catch(error){
            box.innerHTML='<div class="empty">구매자 목록을 불러오지 못했습니다.</div>';
        }
    }

    async function loadSellers(){
        var box=document.getElementById('sellersTable');
        box.innerHTML='<div class="empty">판매자 목록을 불러오는 중입니다.</div>';

        try{
            var response=await adminFetch('/api/admin/dashboard/sellers');
            adminData.sellers=await response.json();
            renderSellers();
        }catch(error){
            box.innerHTML='<div class="empty">판매자 목록을 불러오지 못했습니다.</div>';
        }
    }

    async function loadProducts(){
        var box=document.getElementById('productsTable');
        box.innerHTML='<div class="empty">상품 목록을 불러오는 중입니다.</div>';

        try{
            var response=await adminFetch('/api/admin/dashboard/products');
            adminData.products=await response.json();
            renderProducts();
        }catch(error){
            box.innerHTML='<div class="empty">상품 목록을 불러오지 못했습니다.</div>';
        }
    }

    async function loadOrders(){
        var box=document.getElementById('ordersTable');
        box.innerHTML='<div class="empty">주문 목록을 불러오는 중입니다.</div>';

        try{
            var response=await adminFetch('/api/admin/dashboard/orders');
            adminData.orders=await response.json();
            renderOrders();
        }catch(error){
            box.innerHTML='<div class="empty">주문 목록을 불러오지 못했습니다.</div>';
        }
    }

    async function loadReviews(){
        var box=document.getElementById('reviewsTable');
        box.innerHTML='<div class="empty">리뷰 목록을 불러오는 중입니다.</div>';

        try{
            var response=await adminFetch('/api/admin/dashboard/reviews');
            adminData.reviews=await response.json();
            renderReviews();
        }catch(error){
            box.innerHTML='<div class="empty">리뷰 목록을 불러오지 못했습니다.</div>';
        }
    }

    async function loadInquiries(){
        var box=document.getElementById('inquiriesTable');
        box.innerHTML='<div class="empty">문의 목록을 불러오는 중입니다.</div>';

        try{
            var response=await adminFetch('/api/admin/dashboard/inquiries');
            adminData.inquiries=await response.json();
            renderInquiries();
        }catch(error){
            box.innerHTML='<div class="empty">문의 목록을 불러오지 못했습니다.</div>';
        }
    }

    function renderBuyers(){
        var box=document.getElementById('buyersTable');
        var keyword=adminState.buyers.keyword;
        var fields=getSearchFields('buyers',['name','email','nickname','phone','address']);

        var data=adminData.buyers.filter(function(item){
            return includesKeyword(item,keyword,fields);
        });

        data=applySort('buyers',data);
        var pagedData=getPagedData('buyers',data);

        box.innerHTML=renderUserTable(pagedData,'buyer')
            +renderPagination('buyers',data.length,'renderBuyers');
    }

    function renderSellers(){
        var box=document.getElementById('sellersTable');
        var keyword=adminState.sellers.keyword;
        var fields=getSearchFields('sellers',['name','email','nickname','phone','address']);

        var data=adminData.sellers.filter(function(item){
            return includesKeyword(item,keyword,fields);
        });

        data=applySort('sellers',data);
        var pagedData=getPagedData('sellers',data);

        box.innerHTML=renderUserTable(pagedData,'seller')
            +renderPagination('sellers',data.length,'renderSellers');
    }

    function renderProducts(){
        var box=document.getElementById('productsTable');
        var keyword=adminState.products.keyword;
        var fields=getSearchFields('products',['name','sellerName','category','statusText','origin']);

        var data=adminData.products.filter(function(item){
            return includesKeyword(item,keyword,fields);
        });

        data=applySort('products',data);

        if(!data.length){
            box.innerHTML='<div class="empty">등록된 상품이 없습니다.</div>';
            return;
        }

        var pagedData=getPagedData('products',data);

        box.innerHTML='<table class="admin-table"><thead><tr>'
            +'<th class="sort-th" onclick="sortAdminTable(\'products\',\'id\')">ID '+sortIcon('products','id')+'</th>'
            +'<th class="sort-th" onclick="sortAdminTable(\'products\',\'name\')">상품명 '+sortIcon('products','name')+'</th>'
            +'<th class="sort-th" onclick="sortAdminTable(\'products\',\'sellerName\')">판매자 '+sortIcon('products','sellerName')+'</th>'
            +'<th class="sort-th" onclick="sortAdminTable(\'products\',\'category\')">카테고리 '+sortIcon('products','category')+'</th>'
            +'<th class="sort-th" onclick="sortAdminTable(\'products\',\'displayPrice\')">가격 '+sortIcon('products','displayPrice')+'</th>'
            +'<th class="sort-th" onclick="sortAdminTable(\'products\',\'stockQuantity\')">재고 '+sortIcon('products','stockQuantity')+'</th>'
            +'<th class="sort-th" onclick="sortAdminTable(\'products\',\'statusText\')">상태 '+sortIcon('products','statusText')+'</th>'
            +'<th class="sort-th" onclick="sortAdminTable(\'products\',\'createdAt\')">등록일 '+sortIcon('products','createdAt')+'</th>'
            +'<th>상세</th>'
            +'</tr></thead><tbody>'
            +pagedData.map(function(item){
                item.displayPrice=item.discountPrice||item.price;
                return '<tr>'
                    +'<td>'+escapeHtml(item.id)+'</td>'
                    +'<td><span class="cell-main">'+escapeHtml(item.name)+'</span><span class="cell-sub">'+escapeHtml(item.origin||'-')+'</span></td>'
                    +'<td>'+escapeHtml(item.sellerName||'-')+'<br><span class="cell-sub">ID '+escapeHtml(item.sellerId||'-')+'</span></td>'
                    +'<td>'+escapeHtml(item.category)+'</td>'
                    +'<td>'+formatMoney(item.discountPrice||item.price)+'</td>'
                    +'<td>'+escapeHtml(item.stockQuantity)+'</td>'
                    +'<td><span class="status-chip">'+escapeHtml(item.statusText)+'</span></td>'
                    +'<td>'+formatDate(item.createdAt)+'</td>'
                    +'<td><button type="button" class="admin-btn green" onclick="openAdminProductModal('+item.id+')">상세</button></td>'
                    +'</tr>';
            }).join('')
            +'</tbody></table>'
            +renderPagination('products',data.length,'renderProducts');
    }

    function renderOrders(){
        var box=document.getElementById('ordersTable');
        var keyword=adminState.orders.keyword;
        var fields=getSearchFields('orders',['orderNumber','buyerName','status','deliveryType','paymentMethod']);

        var data=adminData.orders.filter(function(item){
            return includesKeyword(item,keyword,fields);
        });

        data=applySort('orders',data);

        if(!data.length){
            box.innerHTML='<div class="empty">주문 내역이 없습니다.</div>';
            return;
        }

        var pagedData=getPagedData('orders',data);

        box.innerHTML='<table class="admin-table"><thead><tr>'
            +'<th class="sort-th" onclick="sortAdminTable(\'orders\',\'id\')">ID '+sortIcon('orders','id')+'</th>'
            +'<th class="sort-th" onclick="sortAdminTable(\'orders\',\'orderNumber\')">주문번호 '+sortIcon('orders','orderNumber')+'</th>'
            +'<th class="sort-th" onclick="sortAdminTable(\'orders\',\'buyerName\')">구매자 '+sortIcon('orders','buyerName')+'</th>'
            +'<th class="sort-th" onclick="sortAdminTable(\'orders\',\'itemCount\')">상품수 '+sortIcon('orders','itemCount')+'</th>'
            +'<th class="sort-th" onclick="sortAdminTable(\'orders\',\'totalAmount\')">금액 '+sortIcon('orders','totalAmount')+'</th>'
            +'<th class="sort-th" onclick="sortAdminTable(\'orders\',\'status\')">상태 '+sortIcon('orders','status')+'</th>'
            +'<th class="sort-th" onclick="sortAdminTable(\'orders\',\'createdAt\')">주문일 '+sortIcon('orders','createdAt')+'</th>'
            +'<th>상세</th>'
            +'</tr></thead><tbody>'
            +pagedData.map(function(item){
                return '<tr>'
                    +'<td>'+escapeHtml(item.id)+'</td>'
                    +'<td><span class="cell-main">'+escapeHtml(item.orderNumber||'-')+'</span><span class="cell-sub">'+escapeHtml(item.deliveryType||'-')+'</span></td>'
                    +'<td>'+escapeHtml(item.buyerName||'-')+'<br><span class="cell-sub">ID '+escapeHtml(item.buyerId||'-')+'</span></td>'
                    +'<td>'+escapeHtml(item.itemCount||0)+'개<br>'+renderOrderItems(item.items)+'</td>'
                    +'<td>'+formatMoney(item.totalAmount)+'</td>'
                    +'<td><span class="status-chip">'+escapeHtml(item.status||'-')+'</span></td>'
                    +'<td>'+formatDate(item.createdAt)+'</td>'
                    +'<td><button type="button" class="admin-btn green" onclick="openAdminOrderModal('+item.id+')">상세</button></td>'
                    +'</tr>';
            }).join('')
            +'</tbody></table>'
            +renderPagination('orders',data.length,'renderOrders');
    }

    function renderReviews(){
        var box=document.getElementById('reviewsTable');
        var keyword=adminState.reviews.keyword;
        var fields=getSearchFields('reviews',['productName','userName','content','statusText','rating']);

        var data=adminData.reviews.filter(function(item){
            item.statusText=item.hidden?'숨김':'노출';
            return includesKeyword(item,keyword,fields);
        });

        data=applySort('reviews',data);

        if(!data.length){
            box.innerHTML='<div class="empty">등록된 리뷰가 없습니다.</div>';
            return;
        }

        var pagedData=getPagedData('reviews',data);

        box.innerHTML='<table class="admin-table review-table"><thead><tr>'
            +'<th class="sort-th" onclick="sortAdminTable(\'reviews\',\'reviewId\')">ID '+sortIcon('reviews','reviewId')+'</th>'
            +'<th class="sort-th" onclick="sortAdminTable(\'reviews\',\'productName\')">상품 '+sortIcon('reviews','productName')+'</th>'
            +'<th class="sort-th" onclick="sortAdminTable(\'reviews\',\'userName\')">작성자 '+sortIcon('reviews','userName')+'</th>'
            +'<th class="sort-th" onclick="sortAdminTable(\'reviews\',\'rating\')">평점 '+sortIcon('reviews','rating')+'</th>'
            +'<th>내용</th>'
            +'<th class="sort-th" onclick="sortAdminTable(\'reviews\',\'hasImage\')">이미지 '+sortIcon('reviews','hasImage')+'</th>'
            +'<th class="sort-th" onclick="sortAdminTable(\'reviews\',\'hidden\')">상태 '+sortIcon('reviews','hidden')+'</th>'
            +'<th class="sort-th" onclick="sortAdminTable(\'reviews\',\'createdAt\')">작성일 '+sortIcon('reviews','createdAt')+'</th>'
            +'<th>관리</th>'
            +'</tr></thead><tbody>'
            +pagedData.map(function(item){

                var imageHtml=item.imageUrl
                    ? '<img class="review-thumb" src="'+escapeHtml(item.imageUrl)+'" alt="리뷰 이미지" onerror="this.style.display=\'none\'">'
                    : '<span class="cell-sub">없음</span>';

                return '<tr id="review-row-'+item.reviewId+'" class="admin-click-row '+(item.hidden?'review-hidden-row':'')+'" onclick="openAdminReviewModal('+item.reviewId+')">'
                    +'<td>'+escapeHtml(item.reviewId)+'</td>'
                    +'<td><span class="cell-main">'+escapeHtml(item.productName||'-')+'</span><span class="cell-sub">ID '+escapeHtml(item.productId||'-')+'</span></td>'
                    +'<td><span class="cell-main">'+escapeHtml(item.userName||'-')+'</span><span class="cell-sub">ID '+escapeHtml(item.userId||'-')+'</span></td>'

    function renderInquiries(){
        var box=document.getElementById('inquiriesTable');
        var keyword=adminState.inquiries.keyword;
        var fields=getSearchFields('inquiries',['title','content','userName','userRoleText','status','category','categoryText']);
        var statusFilter=adminState.inquiries.statusFilter||'all';

        var data=adminData.inquiries.filter(function(item){
            item.userRoleText=item.userRoleText||getRoleText(item.userRole);
            item.categoryText=getInquiryCategoryText(item);
            var status=String(item.status||'').toLowerCase();

            if(statusFilter!=='all' && status!==statusFilter){
                return false;
            }

            return includesKeyword(item,keyword,fields);
        });

        if(adminState.inquiries.sortKey==='createdAt'){
            data=data.slice().sort(function(a,b){
                var aPending=String(a.status||'').toLowerCase()==='pending'?0:1;
                var bPending=String(b.status||'').toLowerCase()==='pending'?0:1;

                if(aPending!==bPending){
                    return aPending-bPending;
                }

                var aTime=getTimeValue(a.createdAt);
                var bTime=getTimeValue(b.createdAt);

                return adminState.inquiries.sortDir==='asc'
                    ? aTime-bTime
                    : bTime-aTime;
            });
        }else{
            data=sortInquiryList(data);

            if(adminState.inquiries.sortKey){
                data=applySort('inquiries',data);
            }
        }

        if(!data.length){
            box.innerHTML='<div class="empty">등록된 문의가 없습니다.</div>';
            return;

        var pagedData=getPagedData('inquiries',data);

    function sortAdminTable(type,key){
        var state=adminState[type];

        if(state.sortKey===key){
            state.sortDir=state.sortDir==='desc'?'asc':'desc';
        }else{
            state.sortKey=key;
            state.sortDir='desc';
        }

        resetAdminPage(type);

        if(type==='buyers')renderBuyers();
        if(type==='sellers')renderSellers();
        if(type==='products')renderProducts();
        if(type==='orders')renderOrders();
        if(type==='reviews')renderReviews();
        if(type==='inquiries')renderInquiries();
    }

    function sortIcon(type,key){
        var state=adminState[type];

        if(state.sortKey!==key){
            return '↕';
        }

        return state.sortDir==='desc'?'▼':'▲';
    }

    function applySort(type,data){
        var state=adminState[type];
        var key=state.sortKey;
        var dir=state.sortDir==='desc'?-1:1;

        return data.slice().sort(function(a,b){
            var av=getSortValue(a,key);
            var bv=getSortValue(b,key);

            if(av>bv)return dir;
            if(av<bv)return -dir;
            return 0;
        });
    }

    function getSortValue(item,key){
        if(key==='displayPrice'){
            return Number(item.discountPrice||item.price||0);
        }

        var value=item[key];

        if(key==='createdAt'||key==='updatedAt'||key==='answeredAt'){
            return value?new Date(value).getTime():0;
        }

        if(typeof value==='boolean'){
            return value?1:0;
        }

        if(typeof value==='number'){
            return value;
        }

        if(value===null||value===undefined){
            return '';
        }

        if(!isNaN(value) && value !== ''){
            return Number(value);
        }

        return String(value).toLowerCase();
    }

function getSearchFields(type, defaultFields){
        var selected=(adminState[type]&&adminState[type].searchField)||'all';
        return selected==='all'?defaultFields:[selected];
    }

            +'<div class="admin-modal-section"><div class="admin-modal-section-title">문의 내용</div><div class="admin-modal-text">'+escapeHtml(inquiry.content||'-')+'</div></div>'
            +imageHtml
            +'<div class="admin-modal-section"><div class="admin-modal-section-title">관리자 답변</div><div class="admin-modal-text">'+escapeHtml(inquiry.answer||'아직 답변이 등록되지 않았습니다.')+'</div></div>'
            +'<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">'
            +answerButton
            +'<button type="button" class="admin-btn gray" onclick="closeAdminModal(\'adminInquiryModal\')">닫기</button>'
            +'</div>';

        document.getElementById('adminInquiryModal').style.display='flex';
    }

    function openAdminOrderModal(orderId){
        var order=findAdminOrder(orderId);
        if(!order){ alert('주문 정보를 찾을 수 없습니다.'); return; }
        renderAdminOrderModal(order);
    }

    function openAdminOrderModalFromDetail(orderId){
        openAdminOrderModal(orderId);
    }

    function renderAdminOrderModal(order){
        var body=document.getElementById('adminOrderModalBody');
        var itemsHtml='등록된 주문 상품이 없습니다.';
        if(order.items&&order.items.length){
            itemsHtml='<div class="mini-list">'+order.items.map(function(item){
                return '<div class="mini-list-item">'
                    +'<span class="mini-list-title">'+safe(item.productName||('상품 '+item.productId))+'</span>'
                    +'<span class="mini-list-sub">수량 '+safe(item.quantity)+'개 / 가격 '+formatMoney(item.price)+' / 상태 '+safe(item.status)+'</span>'
                    +'<span class="mini-list-sub">판매자 '+safe(item.sellerName||'-')+' / 상품 ID '+safe(item.productId||'-')+'</span>'
                    +'</div>';
            }).join('')+'</div>';
        }

        body.innerHTML='<div class="admin-modal-grid">'
            +modalInfoCard('주문 ID',order.id)
            +modalInfoCard('주문번호',order.orderNumber||'-')
            +modalInfoCard('구매자',order.buyerName||'-')
            +modalInfoCard('구매자 ID',order.buyerId||'-')
            +modalInfoCard('주문 상태',order.status||'-')
            +modalInfoCard('결제수단',order.paymentMethod||'-')
            +modalInfoCard('배송방식',order.deliveryType||'-')
            +modalInfoCard('상품 수',order.itemCount||0)
            +modalInfoCard('주문일',formatDate(order.createdAt))
            +modalInfoCard('상품 금액',formatMoney(order.totalAmount))
            +modalInfoCard('배송비',formatMoney(order.totalShippingFee))
            +modalInfoCard('총액',formatMoney(Number(order.totalAmount||0)+Number(order.totalShippingFee||0)))
            +'</div>'
            +'<div class="admin-modal-section"><div class="admin-modal-section-title">배송지</div><div class="admin-modal-text">'+escapeHtml(order.shippingAddress||'-')+'</div></div>'
            +'<div class="admin-modal-section"><div class="admin-modal-section-title">주문 상품</div><div class="admin-modal-text">'+itemsHtml+'</div></div>'
            +'<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">'
            +'<button type="button" class="admin-btn gray" onclick="closeAdminModal(\'adminOrderModal\')">닫기</button>'
            +'</div>';

        document.getElementById('adminOrderModal').style.display='flex';
    }

    function findAdminOrder(orderId){
        var id=Number(orderId);
        var sources=[];
        if(adminCurrentUserDetail&&adminCurrentUserDetail.orders) sources=sources.concat(adminCurrentUserDetail.orders);
        sources=sources.concat(adminData.orders||[]);
        return sources.find(function(item){ return Number(item.id)===id; });
    }

    function findAdminReview(reviewId){
        var id=Number(reviewId);
        var sources=[];
        if(adminCurrentUserDetail){
            sources=sources.concat(adminCurrentUserDetail.writtenReviews||[]);
            sources=sources.concat(adminCurrentUserDetail.productReviews||[]);
        }
        sources=sources.concat(adminData.reviews||[]);
        return sources.find(function(item){ return Number(item.reviewId)===id; });
    }

    function findAdminInquiry(inquiryId){
        var id=Number(inquiryId);
        var sources=[];
        if(adminCurrentUserDetail&&adminCurrentUserDetail.inquiries) sources=sources.concat(adminCurrentUserDetail.inquiries);
        sources=sources.concat(adminData.inquiries||[]);
        return sources.find(function(item){ return Number(item.id)===id; });
    }

    function openAdminProductModal(productId){
        var product=findAdminProduct(productId);
        if(!product){ alert('상품 정보를 찾을 수 없습니다.'); return; }
        renderAdminProductModal(product);
    }

    function openAdminProductModalFromDetail(productId){
        openAdminProductModal(productId);
    }

    function renderAdminProductModal(product){
        var body=document.getElementById('adminProductModalBody');
        if(!body) return;

        body.innerHTML='<div class="admin-modal-grid">'
            +modalInfoCard('상품 ID',product.id)
            +modalInfoCard('상품명',product.name||'-')
            +modalInfoCard('판매자',product.sellerName||'-')
            +modalInfoCard('판매자 ID',product.sellerId||'-')
            +modalInfoCard('카테고리',product.category||'-')
            +modalInfoCard('상태',product.statusText||'-')
            +modalInfoCard('가격',formatMoney(product.price))
            +modalInfoCard('할인가',product.discountPrice?formatMoney(product.discountPrice):'-')
            +modalInfoCard('재고',product.stockQuantity==null?'-':String(product.stockQuantity)+'개')
            +modalInfoCard('원산지',product.origin||'-')
            +modalInfoCard('픽업 가능',product.pickupAvailable?'가능':'불가')
            +modalInfoCard('소비기한',product.expiryDate||'-')
            +modalInfoCard('등록일',formatDate(product.createdAt))
            +'</div>'
            +'<div class="admin-modal-section"><div class="admin-modal-section-title">상품 요약</div>'
            +'<div class="admin-modal-text">'
            +'상품명: '+escapeHtml(product.name||'-')+'\n'
            +'카테고리: '+escapeHtml(product.category||'-')+'\n'
            +'판매자: '+escapeHtml(product.sellerName||'-')+'\n'
            +'상태: '+escapeHtml(product.statusText||'-')
            +'</div></div>'
            +'<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">'
            +'<button type="button" class="admin-btn gray" onclick="closeAdminModal(\'adminProductModal\')">닫기</button>'
            +'</div>';

        document.getElementById('adminProductModal').style.display='flex';
    }

    function findAdminProduct(productId){
        var id=Number(productId);
        var sources=[];
        if(adminCurrentUserDetail&&adminCurrentUserDetail.products) sources=sources.concat(adminCurrentUserDetail.products);
        sources=sources.concat(adminData.products||[]);
        return sources.find(function(item){ return Number(item.id)===id; });
    }

    function summaryHeroCard(icon,label,value,subText){
        return '<div class="summary-hero-card">'
            +'<div class="summary-hero-icon">'+icon+'</div>'
            +'<div class="summary-hero-label">'+escapeHtml(label)+'</div>'
            +'<div class="summary-hero-value">'+summaryValue(value)+'</div>'
            +'<div class="summary-hero-sub">'+escapeHtml(subText||'')+'</div>'
            +'</div>';
    }

    function summaryGroupCard(title,desc,rows){
        return '<div class="summary-group-card">'
            +'<div class="summary-group-title"><strong>'+escapeHtml(title)+'</strong><span>'+escapeHtml(desc||'')+'</span></div>'
            +rows.map(function(row){ return summaryRow(row[0],row[1],row[2],row[3]); }).join('')
            +'</div>';
    }

    function summaryRow(label,value,suffix,warn){
        return '<div class="summary-row">'
            +'<span class="summary-row-label">'+escapeHtml(label)+'</span>'
            +'<span class="summary-row-value '+(warn?'warn':'')+'">'+summaryValue(value)+escapeHtml(suffix||'')+'</span>'
            +'</div>';
    }

    function summaryValue(value){
        if(typeof value==='number') return value.toLocaleString('ko-KR');
        if(!isNaN(Number(value))&&value!==null&&value!=='') return Number(value).toLocaleString('ko-KR');
        return escapeHtml(value||'-');
    }

        function includesKeyword(item,keyword,fields){
        if(!keyword){
            return true;
        }

        var lower=keyword.toLowerCase();

        return fields.some(function(field){
            var value=item[field];

            if(value===null||value===undefined){
                return false;
            }

            return String(value).toLowerCase().includes(lower);
        });
    }

    function statCard(label,value){
        return '<div class="stat-card"><div class="stat-label">'+escapeHtml(label)+'</div><div class="stat-value">'+escapeHtml(value||0)+'</div></div>';
    }

    function miniCard(title, content, scrollable){
        return '<div class="mini-card">'
            + '<div class="mini-title">'+escapeHtml(title)+'</div>'
            + '<div class="mini-text '+(scrollable ? 'mini-scroll' : '')+'">'+content+'</div>'
            + '</div>';
    }

    function renderSimpleList(items,type){
        if(!items||!items.length){
            return '내역이 없습니다.';
        }

        return '<div class="mini-list">'+items.map(function(item){
            if(type==='order'){
                return '<div class="mini-list-item clickable" onclick="openAdminOrderModalFromDetail('+Number(item.id||0)+')">'
                    + '<div class="mini-list-row compact">'
                    + '<span class="mini-list-title">주문 '+safe(item.orderNumber||item.id)+'</span>'
                    + '<span class="mini-list-sub">'+safe(getOrderStatusText(item.status))+'</span>'
                    + '</div>'
                    + '</div>';
            }

            if(type==='review'){
                return '<div class="mini-list-item clickable" onclick="openAdminReviewModalFromDetail('+Number(item.reviewId||0)+')">'
                    + '<div class="mini-list-row compact">'
                    + '<span class="mini-list-title">'+safe(item.productName)+'</span>'
                    + '<span class="mini-list-sub">상품 ID '+safe(item.productId||'-')+'</span>'
                    + '</div>'
                    + '</div>';
            }

            if(type==='inquiry'){
                return '<div class="mini-list-item clickable" onclick="openAdminInquiryModalFromDetail('+Number(item.id||0)+')">'
                    + '<div class="mini-list-row compact">'
                    + '<span class="mini-list-title">'+safe(item.title||'-')+'</span>'
                    + '<span class="mini-list-sub">'+safe(getInquiryStatusText(item.status))+'</span>'
                    + '</div>'
                    + '</div>';
            }

            if(type==='product'){
                return '<div class="mini-list-item clickable" onclick="openAdminProductModalFromDetail('+Number(item.id||0)+')">'
                    + '<div class="mini-list-row compact">'
                    + '<span class="mini-list-title">'+safe(item.name)+'</span>'
                    + '<span class="mini-list-sub">상품 ID '+safe(item.id||'-')+'</span>'
                    + '</div>'
                    + '</div>';
            }

            return '<div class="mini-list-item">'+safe(item.id)+'</div>';
        }).join('')+'</div>';
    }

    function renderOrderItems(items){
        if(!items||!items.length){
            return '-';
        }

        return items.slice(0,2).map(function(item){
            return escapeHtml(item.productName||'상품 '+item.productId)+' x '+escapeHtml(item.quantity);
        }).join('<br>')+(items.length>2?'<br><span class="cell-sub">외 '+(items.length-2)+'개</span>':'');
    }

    function renderStars(rating){
        var count=Number(rating||0);
        var result='';

        for(var i=1;i<=5;i++){
            result+=i<=count?'⭐':'☆';
        }

        return result;
    }

    function formatMoney(value){
        if(value===null||value===undefined||value===''){
            return '-';
        }

        return Number(value).toLocaleString('ko-KR')+'원';
    }


    function sortInquiryList(list){
        return list.slice().sort(function(a,b){
            var aPending=String(a.status||'').toLowerCase()==='pending'?0:1;
            var bPending=String(b.status||'').toLowerCase()==='pending'?0:1;

            if(aPending!==bPending){
                return aPending-bPending;
            }

            return getTimeValue(b.createdAt)-getTimeValue(a.createdAt);
        });
    }

    function getInquiryCategoryText(item){
        var categoryText=item.categoryText;

        if(categoryText){
            return categoryText;
        }

        switch(String(item.category||'').toLowerCase()){
            case 'delivery':return '배송 문의';
            case 'refund':return '환불/교환 문의';
            case 'product':return '상품 문의';
            case 'order':return '주문/결제 문의';
            case 'etc':return '기타 문의';
            default:return item.category||'기타 문의';
        }
    }

    function getInquiryTargetLabel(item){
        var role=String(item.userRole||item.userRoleText||'').toUpperCase();

        if(role.indexOf('SELLER')>=0||role.indexOf('판매자')>=0){
            return '상품 ID';
        }

        if(role.indexOf('BUYER')>=0||role.indexOf('구매자')>=0){
            return '주문 ID';
        }

        if(item.productId){
            return '상품 ID';
        }

        return '주문 ID';
    }

    function getInquiryTargetValue(item){
        return getInquiryTargetLabel(item)==='상품 ID'
            ? (item.productId||'-')
            : (item.orderId||'-');
    }

    function getInquiryAnsweredDate(item){
        return String(item.status||'').toLowerCase()==='answered'
            ? formatDateTimeMinute(item.answeredAt)
            : '-';
    }

    function formatDateTimeMinute(value){
        if(!value){
            return '-';
        }

        var text=String(value).replace('T',' ');

        if(text.length>=16){
            return text.substring(0,16);
        }

        return text;
    }

    function getTimeValue(value){
        if(!value){
            return 0;
        }

        var time=new Date(value).getTime();
        return isNaN(time)?0:time;
    }

    function formatDate(value){
        if(!value){
            return '-';
        }

        return String(value).replace('T',' ').substring(0,10);
    }

    function boolText(value){
        return value?'있음':'없음';
    }

    function shortText(value,length){
        if(value===null||value===undefined){
            return '';
        }

        var text=String(value);

        if(text.length<=length){
            return text;
        }

        return text.substring(0,length)+'...';
    }

    function safe(value){
        if(value===null||value===undefined||value===''){
            return '-';
        }

        return escapeHtml(value);
    }

    function escapeHtml(value){
        if(value===null||value===undefined){
            return '';
        }

        return String(value)
            .replaceAll('&','&amp;')
            .replaceAll('<','&lt;')
            .replaceAll('>','&gt;')
            .replaceAll('"','&quot;')
            .replaceAll("'","&#039;");
    }

    function getPagedData(type, data) {
        const paging = adminPaging[type];

        if (!paging) {
            return data;
        }

        const start = (paging.page - 1) * paging.size;
        const end = start + paging.size;

        return data.slice(start, end);
    }

    function renderPagination(type, totalCount, renderFunctionName) {
        const paging = adminPaging[type];

        if (!paging) {
            return '';
        }

        const totalPage = Math.ceil(totalCount / paging.size);

        if (totalPage <= 1) {
            return '';
        }

        const blockSize = 10;
        const currentBlock = Math.floor((paging.page - 1) / blockSize);
        const startPage = currentBlock * blockSize + 1;
        const endPage = Math.min(startPage + blockSize - 1, totalPage);

        let html = '<div class="admin-pagination">';

        html += '<button type="button" onclick="changeAdminPage(\'' + type + '\', ' + (startPage - 1) + ', \'' + renderFunctionName + '\')" ' + (startPage <= 1 ? 'disabled' : '') + '>이전 10</button>';
        html += '<button type="button" onclick="changeAdminPage(\'' + type + '\', ' + (paging.page - 1) + ', \'' + renderFunctionName + '\')" ' + (paging.page <= 1 ? 'disabled' : '') + '>이전</button>';

        for (let i = startPage; i <= endPage; i++) {
            html += '<button type="button" class="' + (paging.page === i ? 'on' : '') + '" onclick="changeAdminPage(\'' + type + '\', ' + i + ', \'' + renderFunctionName + '\')">' + i + '</button>';
        }

        html += '<button type="button" onclick="changeAdminPage(\'' + type + '\', ' + (paging.page + 1) + ', \'' + renderFunctionName + '\')" ' + (paging.page >= totalPage ? 'disabled' : '') + '>다음</button>';
        html += '<button type="button" onclick="changeAdminPage(\'' + type + '\', ' + (endPage + 1) + ', \'' + renderFunctionName + '\')" ' + (endPage >= totalPage ? 'disabled' : '') + '>다음 10</button>';
        html += '</div>';

        return html;
    }

    function changeAdminPage(type, page, renderFunctionName) {
        const paging = adminPaging[type];

        if (!paging) {
            return;
        }

        var totalCount = Array.isArray(adminData[type]) ? adminData[type].length : 0;
        var totalPage = Math.max(1, Math.ceil(totalCount / paging.size));
        paging.page = Math.min(Math.max(1, page), totalPage);

        if (typeof window[renderFunctionName] === 'function') {
            window[renderFunctionName]();
        }
    }

    function resetAdminPage(type) {
        if (adminPaging[type]) {
            adminPaging[type].page = 1;
        }
    }
    function openAdminInquiryImageModal(imageUrl){
        var modal=document.getElementById('adminInquiryImageModal');
        var image=document.getElementById('adminInquiryImageModalImg');

        if(!modal||!image){
            return;
        }

        image.src=imageUrl;
        modal.style.display='flex';
    }

    function closeAdminInquiryImageModal(){
        var modal=document.getElementById('adminInquiryImageModal');
        var image=document.getElementById('adminInquiryImageModalImg');

        if(image){
            image.src='';
        }

        if(modal){
            modal.style.display='none';
        }
    }

    function escapeJsString(value){
        if(value===null||value===undefined){
            return '';
        }

        return String(value)
            .replaceAll('\\','\\\\')
            .replaceAll("'","\\'")
            .replaceAll('"','&quot;')
            .replaceAll('\n',' ')
            .replaceAll('\r',' ');
    }
</script>
</body>
