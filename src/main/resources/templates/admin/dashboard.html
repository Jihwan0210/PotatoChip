<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>관리자 대시보드 | 못난이 농작물</title>
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" href="/css/style.css" rel="stylesheet"/>
    <style>
        .admin-page{min-height:100vh;padding-top:64px;background:linear-gradient(160deg,var(--beige2) 0%,var(--beige3) 48%,var(--gp) 100%)}
        .admin-head{background:#fff;border-bottom:1.5px solid var(--beige);padding:34px 6% 26px;display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
        .admin-kicker{font-size:.68rem;color:var(--green);letter-spacing:1px;font-weight:700;margin-bottom:8px}
        .admin-title{font-family:'Gaegu',cursive;font-size:clamp(1.8rem,3vw,2.5rem);font-weight:700;color:var(--dark)}
        .admin-desc{color:var(--light);font-size:.84rem;line-height:1.7;margin-top:8px;max-width:680px}
        .admin-wrap{max-width:1180px;margin:0 auto;padding:30px 6% 80px}
        .admin-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
        .admin-tab{border:1.5px solid var(--beige);background:#fff;color:var(--mid);border-radius:100px;padding:9px 15px;font-family:inherit;font-size:.76rem;font-weight:700;cursor:pointer}
        .admin-tab.on{background:var(--green);border-color:var(--green);color:#fff}
        .admin-section{display:none}
        .admin-section.on{display:block}
        .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
        .stat-card{background:#fff;border:1.5px solid var(--beige);border-radius:18px;padding:18px;box-shadow:0 8px 24px rgba(90,74,58,.06)}
        .stat-label{font-size:.72rem;color:var(--muted);font-weight:700;margin-bottom:7px}
        .stat-value{font-family:'Gaegu',cursive;font-size:1.8rem;font-weight:700;color:var(--dark)}
        .admin-card{background:#fff;border:1.5px solid var(--beige);border-radius:18px;padding:20px;box-shadow:0 8px 26px rgba(90,74,58,.07);margin-bottom:14px}
        .admin-card-title{font-family:'Gaegu',cursive;font-size:1.25rem;font-weight:700;color:var(--dark);margin-bottom:12px}
        .admin-table-wrap{overflow-x:auto}
        .admin-table{width:100%;border-collapse:collapse;min-width:760px}
        .admin-table th{background:var(--beige3);color:var(--mid);font-size:.72rem;text-align:left;padding:11px;border-bottom:1px solid var(--beige);white-space:nowrap}
        .admin-table td{font-size:.76rem;color:var(--dark);padding:11px;border-bottom:1px solid var(--beige);vertical-align:top}
        .admin-table tr:hover td{background:#fffaf0}
        .admin-btn{border:none;border-radius:100px;padding:7px 11px;font-size:.7rem;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap}
        .admin-btn.green{background:var(--green);color:#fff}
        .admin-btn.amber{background:var(--amber);color:#fff}
        .admin-btn.gray{background:#eee;color:#777}
        .admin-btn.red{background:#f2dddd;color:#b23b3b}
        .status-chip{display:inline-flex;border-radius:100px;padding:4px 8px;font-size:.65rem;font-weight:700;background:var(--gp);color:var(--green)}
        .empty{padding:24px;text-align:center;color:var(--muted);font-size:.82rem}
        .detail-box{display:none;background:var(--beige3);border:1.5px solid var(--beige);border-radius:18px;padding:18px;margin-top:14px}
        .detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
        .mini-card{background:#fff;border:1px solid var(--beige);border-radius:14px;padding:13px}
        .mini-title{font-weight:700;color:var(--dark);font-size:.82rem;margin-bottom:6px}
        .mini-text{font-size:.74rem;color:var(--mid);line-height:1.6}
        @media(max-width:720px){.admin-head{padding:28px 6% 22px}.admin-table{min-width:640px}}
    </style>
</head>
<body>
<div th:replace="~{nav :: nav}"></div>

<main class="admin-page">
    <section class="admin-head">
        <div>
            <div class="admin-kicker">Admin Dashboard</div>
            <h1 class="admin-title">관리자 대시보드 🛠️</h1>
            <p class="admin-desc">회원, 상품, 주문, 리뷰, 문의 현황을 한 번에 확인하고 운영 관리할 수 있는 관리자 전용 화면입니다.</p>
        </div>
        <button class="admin-btn amber" type="button" onclick="location.href='/admin/inquiries'">문의 답변하기 →</button>
    </section>

    <section class="admin-wrap">
        <div class="admin-tabs">
            <button class="admin-tab on" type="button" onclick="switchAdminTab('summary', this)">전체 현황</button>
            <button class="admin-tab" type="button" onclick="switchAdminTab('buyers', this)">구매자 관리</button>
            <button class="admin-tab" type="button" onclick="switchAdminTab('sellers', this)">판매자 관리</button>
            <button class="admin-tab" type="button" onclick="switchAdminTab('products', this)">상품 관리</button>
            <button class="admin-tab" type="button" onclick="switchAdminTab('orders', this)">주문 관리</button>
            <button class="admin-tab" type="button" onclick="switchAdminTab('reviews', this)">리뷰 관리</button>
            <button class="admin-tab" type="button" onclick="location.href='/admin/inquiries'">문의 관리</button>
        </div>

        <div id="section-summary" class="admin-section on">
            <div id="summaryGrid" class="stat-grid"></div>
        </div>

        <div id="section-buyers" class="admin-section">
            <div class="admin-card">
                <div class="admin-card-title">구매자 관리</div>
                <div id="buyersTable" class="admin-table-wrap"></div>
            </div>
            <div id="buyerDetail" class="detail-box"></div>
        </div>

        <div id="section-sellers" class="admin-section">
            <div class="admin-card">
                <div class="admin-card-title">판매자 관리</div>
                <div id="sellersTable" class="admin-table-wrap"></div>
            </div>
            <div id="sellerDetail" class="detail-box"></div>
        </div>

        <div id="section-products" class="admin-section">
            <div class="admin-card">
                <div class="admin-card-title">상품 관리</div>
                <div id="productsTable" class="admin-table-wrap"></div>
            </div>
        </div>

        <div id="section-orders" class="admin-section">
            <div class="admin-card">
                <div class="admin-card-title">주문 관리</div>
                <div id="ordersTable" class="admin-table-wrap"></div>
            </div>
        </div>

        <div id="section-reviews" class="admin-section">
            <div class="admin-card">
                <div class="admin-card-title">리뷰 관리</div>
                <div id="reviewsTable" class="admin-table-wrap"></div>
            </div>
        </div>
    </section>
</main>

<div th:replace="~{footer :: footer}"></div>

<script>
    document.addEventListener('DOMContentLoaded',function(){
        if(!isAdminLoggedIn()){
            alert('관리자 로그인이 필요합니다.');
            location.href='/login';
            return;
        }

        loadSummary();
    });

    function getAdminToken(){
        return localStorage.getItem('token')||sessionStorage.getItem('token');
    }

    function getAdminRole(){
        return localStorage.getItem('role')||sessionStorage.getItem('role')||'';
    }

    function isAdminLoggedIn(){
        var token=getAdminToken();
        var role=getAdminRole();

        if(!token){
            return false;
        }

        if(!role){
            return true;
        }

        return role.toUpperCase()==='ADMIN';
    }

    function getAdminHeaders(){
        return {
            'Authorization':'Bearer '+getAdminToken()
        };
    }

    async function adminFetch(url, options){
        options=options||{};
        options.headers=Object.assign({}, options.headers||{}, getAdminHeaders());

        var response=await fetch(url, options);

        if(response.status===401||response.status===403){
            alert('관리자 권한이 필요합니다.');
            location.href='/login';
            throw new Error('unauthorized');
        }

        return response;
    }

    function switchAdminTab(tab, element){
        document.querySelectorAll('.admin-tab').forEach(function(button){
            button.classList.remove('on');
        });

        if(element){
            element.classList.add('on');
        }

        document.querySelectorAll('.admin-section').forEach(function(section){
            section.classList.remove('on');
        });

        var target=document.getElementById('section-'+tab);

        if(target){
            target.classList.add('on');
        }

        if(tab==='summary')loadSummary();
        if(tab==='buyers')loadBuyers();
        if(tab==='sellers')loadSellers();
        if(tab==='products')loadProducts();
        if(tab==='orders')loadOrders();
        if(tab==='reviews')loadReviews();
    }

    async function loadSummary(){
        var grid=document.getElementById('summaryGrid');
        grid.innerHTML='<div class="empty">전체 현황을 불러오는 중입니다.</div>';

        try{
            var response=await adminFetch('/api/admin/dashboard/summary');
            var data=await response.json();

            grid.innerHTML=[
                statCard('전체 회원 수',data.totalUserCount),
                statCard('구매자 수',data.buyerCount),
                statCard('판매자 수',data.sellerCount),
                statCard('등록 상품 수',data.productCount),
                statCard('전체 주문 수',data.orderCount),
                statCard('답변 대기 문의',data.pendingInquiryCount),
                statCard('전체 리뷰 수',data.reviewCount),
                statCard('최근 7일 리뷰',data.recentReviewCount)
            ].join('');
        }catch(error){
            grid.innerHTML='<div class="empty">전체 현황을 불러오지 못했습니다.</div>';
        }
    }

    async function loadBuyers(){
        var box=document.getElementById('buyersTable');
        box.innerHTML='<div class="empty">구매자 목록을 불러오는 중입니다.</div>';

        try{
            var response=await adminFetch('/api/admin/dashboard/buyers');
            var data=await response.json();

            box.innerHTML=renderUserTable(data,'buyer');
        }catch(error){
            box.innerHTML='<div class="empty">구매자 목록을 불러오지 못했습니다.</div>';
        }
    }

    async function loadSellers(){
        var box=document.getElementById('sellersTable');
        box.innerHTML='<div class="empty">판매자 목록을 불러오는 중입니다.</div>';

        try{
            var response=await adminFetch('/api/admin/dashboard/sellers');
            var data=await response.json();

            box.innerHTML=renderUserTable(data,'seller');
        }catch(error){
            box.innerHTML='<div class="empty">판매자 목록을 불러오지 못했습니다.</div>';
        }
    }

    async function loadProducts(){
        var box=document.getElementById('productsTable');
        box.innerHTML='<div class="empty">상품 목록을 불러오는 중입니다.</div>';

        try{
            var response=await adminFetch('/api/admin/dashboard/products');
            var data=await response.json();

            if(!data.length){
                box.innerHTML='<div class="empty">등록된 상품이 없습니다.</div>';
                return;
            }

            box.innerHTML='<table class="admin-table"><thead><tr>'
                +'<th>ID</th><th>상품명</th><th>판매자</th><th>카테고리</th><th>가격</th><th>재고</th><th>픽업</th><th>상태</th><th>등록일</th>'
                +'</tr></thead><tbody>'
                +data.map(function(item){
                    return '<tr>'
                        +'<td>'+escapeHtml(item.id)+'</td>'
                        +'<td>'+escapeHtml(item.name)+'</td>'
                        +'<td>'+escapeHtml(item.sellerName||'-')+'<br><span style="color:var(--muted)">ID '+escapeHtml(item.sellerId||'-')+'</span></td>'
                        +'<td>'+escapeHtml(item.category)+'</td>'
                        +'<td>'+formatMoney(item.discountPrice||item.price)+'</td>'
                        +'<td>'+escapeHtml(item.stockQuantity)+'</td>'
                        +'<td>'+boolText(item.pickupAvailable)+'</td>'
                        +'<td><span class="status-chip">'+escapeHtml(item.statusText)+'</span></td>'
                        +'<td>'+formatDate(item.createdAt)+'</td>'
                        +'</tr>';
                }).join('')
                +'</tbody></table>';
        }catch(error){
            box.innerHTML='<div class="empty">상품 목록을 불러오지 못했습니다.</div>';
        }
    }

    async function loadOrders(){
        var box=document.getElementById('ordersTable');
        box.innerHTML='<div class="empty">주문 목록을 불러오는 중입니다.</div>';

        try{
            var response=await adminFetch('/api/admin/dashboard/orders');
            var data=await response.json();

            if(!data.length){
                box.innerHTML='<div class="empty">주문 내역이 없습니다.</div>';
                return;
            }

            box.innerHTML='<table class="admin-table"><thead><tr>'
                +'<th>ID</th><th>주문번호</th><th>구매자</th><th>주문상품</th><th>금액</th><th>방식</th><th>상태</th><th>주문일</th>'
                +'</tr></thead><tbody>'
                +data.map(function(item){
                    return '<tr>'
                        +'<td>'+escapeHtml(item.id)+'</td>'
                        +'<td>'+escapeHtml(item.orderNumber||'-')+'</td>'
                        +'<td>'+escapeHtml(item.buyerName||'-')+'<br><span style="color:var(--muted)">ID '+escapeHtml(item.buyerId||'-')+'</span></td>'
                        +'<td>'+renderOrderItems(item.items)+'</td>'
                        +'<td>'+formatMoney(item.totalAmount)+'</td>'
                        +'<td>'+escapeHtml(item.deliveryType||'-')+'</td>'
                        +'<td><span class="status-chip">'+escapeHtml(item.status||'-')+'</span></td>'
                        +'<td>'+formatDate(item.createdAt)+'</td>'
                        +'</tr>';
                }).join('')
                +'</tbody></table>';
        }catch(error){
            box.innerHTML='<div class="empty">주문 목록을 불러오지 못했습니다.</div>';
        }
    }

    async function loadReviews(){
        var box=document.getElementById('reviewsTable');
        box.innerHTML='<div class="empty">리뷰 목록을 불러오는 중입니다.</div>';

        try{
            var response=await adminFetch('/api/admin/dashboard/reviews');
            var data=await response.json();

            if(!data.length){
                box.innerHTML='<div class="empty">등록된 리뷰가 없습니다.</div>';
                return;
            }

            box.innerHTML='<table class="admin-table"><thead><tr>'
                +'<th>ID</th><th>상품</th><th>작성자</th><th>평점</th><th>내용</th><th>이미지</th><th>작성일</th><th>관리</th>'
                +'</tr></thead><tbody>'
                +data.map(function(item){
                    return '<tr id="review-row-'+item.reviewId+'">'
                        +'<td>'+escapeHtml(item.reviewId)+'</td>'
                        +'<td>'+escapeHtml(item.productName||'-')+'<br><span style="color:var(--muted)">ID '+escapeHtml(item.productId||'-')+'</span></td>'
                        +'<td>'+escapeHtml(item.userName||'-')+'<br><span style="color:var(--muted)">ID '+escapeHtml(item.userId||'-')+'</span></td>'
                        +'<td>'+renderStars(item.rating)+'</td>'
                        +'<td>'+escapeHtml(shortText(item.content,80))+'</td>'
                        +'<td>'+boolText(item.hasImage)+'</td>'
                        +'<td>'+formatDate(item.createdAt)+'</td>'
                        +'<td><button type="button" class="admin-btn red" onclick="hideReview('+item.reviewId+')">숨김/삭제</button></td>'
                        +'</tr>';
                }).join('')
                +'</tbody></table>';
        }catch(error){
            box.innerHTML='<div class="empty">리뷰 목록을 불러오지 못했습니다.</div>';
        }
    }

    function renderUserTable(data,type){
        if(!data.length){
            return '<div class="empty">회원 목록이 없습니다.</div>';
        }

        return '<table class="admin-table"><thead><tr>'
            +'<th>ID</th><th>이름</th><th>이메일</th><th>닉네임</th><th>전화번호</th><th>주소</th><th>활동 요약</th><th>상세</th>'
            +'</tr></thead><tbody>'
            +data.map(function(user){
                var summary=type==='buyer'
                    ? '주문 '+(user.orderCount||0)+'건 / 리뷰 '+(user.reviewCount||0)+'건 / 문의 '+(user.inquiryCount||0)+'건'
                    : '상품 '+(user.productCount||0)+'개 / 작성리뷰 '+(user.writtenReviewCount||0)+'건 / 상품리뷰 '+(user.productReviewCount||0)+'건 / 문의 '+(user.inquiryCount||0)+'건';

                return '<tr>'
                    +'<td>'+escapeHtml(user.id)+'</td>'
                    +'<td>'+escapeHtml(user.name||'-')+'</td>'
                    +'<td>'+escapeHtml(user.email||'-')+'</td>'
                    +'<td>'+escapeHtml(user.nickname||'-')+'</td>'
                    +'<td>'+escapeHtml(user.phone||'-')+'</td>'
                    +'<td>'+escapeHtml(user.address||'-')+'</td>'
                    +'<td>'+escapeHtml(summary)+'</td>'
                    +'<td><button type="button" class="admin-btn green" onclick="loadUserDetail('+user.id+',\''+type+'\')">상세보기</button></td>'
                    +'</tr>';
            }).join('')
            +'</tbody></table>';
    }

    async function loadUserDetail(userId,type){
        var detailBox=document.getElementById(type==='buyer'?'buyerDetail':'sellerDetail');
        detailBox.style.display='block';
        detailBox.innerHTML='<div class="empty">회원 상세 정보를 불러오는 중입니다.</div>';

        try{
            var response=await adminFetch('/api/admin/dashboard/users/'+userId);
            var data=await response.json();

            detailBox.innerHTML=renderUserDetail(data,type);
        }catch(error){
            detailBox.innerHTML='<div class="empty">회원 상세 정보를 불러오지 못했습니다.</div>';
        }
    }

    function renderUserDetail(data,type){
        var user=data.user||{};

        return '<div class="admin-card-title">'+escapeHtml(user.name||'-')+' 상세 정보</div>'
            +'<div class="detail-grid">'
            +miniCard('회원정보','이메일: '+safe(user.email)+'<br>전화번호: '+safe(user.phone)+'<br>주소: '+safe(user.address)+'<br>가입일: '+formatDate(user.createdAt))
            +miniCard('구매내역',renderSimpleList(data.orders,'order'))
            +miniCard('작성 리뷰',renderSimpleList(data.writtenReviews,'review'))
            +miniCard('작성 문의',renderSimpleList(data.inquiries,'inquiry'))
            +(type==='seller'?miniCard('등록 상품',renderSimpleList(data.products,'product')):'')
            +(type==='seller'?miniCard('판매 상품 리뷰',renderSimpleList(data.productReviews,'review')):'')
            +'</div>';
    }

    async function hideReview(reviewId){
        if(!confirm('해당 리뷰를 숨김/삭제 처리할까요?')){
            return;
        }

        try{
            var response=await adminFetch('/api/admin/dashboard/reviews/'+reviewId+'/hide',{
                method:'PATCH'
            });

            if(!response.ok){
                alert('리뷰 처리에 실패했습니다.');
                return;
            }

            var row=document.getElementById('review-row-'+reviewId);

            if(row){
                row.remove();
            }

            alert('리뷰가 숨김 처리되었습니다.');
        }catch(error){
            alert('리뷰 처리 중 오류가 발생했습니다.');
        }
    }

    function statCard(label,value){
        return '<div class="stat-card"><div class="stat-label">'+escapeHtml(label)+'</div><div class="stat-value">'+escapeHtml(value||0)+'</div></div>';
    }

    function miniCard(title,content){
        return '<div class="mini-card"><div class="mini-title">'+escapeHtml(title)+'</div><div class="mini-text">'+content+'</div></div>';
    }

    function renderSimpleList(items,type){
        if(!items||!items.length){
            return '내역이 없습니다.';
        }

        return items.slice(0,5).map(function(item){
            if(type==='order'){
                return '주문 '+safe(item.orderNumber||item.id)+' / '+formatMoney(item.totalAmount)+' / '+safe(item.status);
            }

            if(type==='review'){
                return safe(item.productName)+' / '+safe(item.rating)+'점 / '+safe(shortText(item.content,35));
            }

            if(type==='inquiry'){
                return '['+safe(item.status)+'] '+safe(item.title);
            }

            if(type==='product'){
                return safe(item.name)+' / 재고 '+safe(item.stockQuantity)+' / '+safe(item.statusText);
            }

            return safe(item.id);
        }).join('<br>');
    }

    function renderOrderItems(items){
        if(!items||!items.length){
            return '-';
        }

        return items.map(function(item){
            return escapeHtml(item.productName||'상품 '+item.productId)+' x '+escapeHtml(item.quantity);
        }).join('<br>');
    }

    function renderStars(rating){
        var count=Number(rating||0);
        var result='';

        for(var i=1;i<=5;i++){
            result+=i<=count?'⭐':'☆';
        }

        return result;
    }

    function formatMoney(value){
        if(value===null||value===undefined||value===''){
            return '-';
        }

        return Number(value).toLocaleString('ko-KR')+'원';
    }

    function formatDate(value){
        if(!value){
            return '-';
        }

        return String(value).replace('T',' ').substring(0,10);
    }

    function boolText(value){
        return value?'있음':'없음';
    }

    function shortText(value,length){
        if(value===null||value===undefined){
            return '';
        }

        var text=String(value);

        if(text.length<=length){
            return text;
        }

        return text.substring(0,length)+'...';
    }

    function safe(value){
        if(value===null||value===undefined||value===''){
            return '-';
        }

        return escapeHtml(value);
    }

    function escapeHtml(value){
        if(value===null||value===undefined){
            return '';
        }

        return String(value)
            .replaceAll('&','&amp;')
            .replaceAll('<','&lt;')
            .replaceAll('>','&gt;')
            .replaceAll('"','&quot;')
            .replaceAll("'","&#039;");
    }
</script>
</body>
</html>
