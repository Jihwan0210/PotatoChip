<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>관리자 대시보드 | 못난이 농작물</title>
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" href="/css/style.css" rel="stylesheet"/>
    <style>
        .admin-page{min-height:100vh;padding-top:64px;background:linear-gradient(160deg,var(--beige2) 0%,var(--beige3) 48%,var(--gp) 100%)}
        .admin-head{background:#fff;border-bottom:1.5px solid var(--beige);padding:34px 6% 26px;display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
        .admin-kicker{font-size:.68rem;color:var(--green);letter-spacing:1px;font-weight:700;margin-bottom:8px}
        .admin-title{font-family:'Gaegu',cursive;font-size:clamp(1.8rem,3vw,2.5rem);font-weight:700;color:var(--dark)}
        .admin-desc{color:var(--light);font-size:.84rem;line-height:1.7;margin-top:8px;max-width:680px}
        .admin-wrap{max-width:1180px;margin:0 auto;padding:30px 6% 80px}
        .admin-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
        .admin-tab{border:1.5px solid var(--beige);background:#fff;color:var(--mid);border-radius:100px;padding:9px 15px;font-family:inherit;font-size:.76rem;font-weight:700;cursor:pointer}
        .admin-tab.on{background:var(--green);border-color:var(--green);color:#fff}
        .admin-section{display:none}
        .admin-section.on{display:block}
        .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
        .stat-card{background:#fff;border:1.5px solid var(--beige);border-radius:18px;padding:18px;box-shadow:0 8px 24px rgba(90,74,58,.06)}
        .stat-label{font-size:.72rem;color:var(--muted);font-weight:700;margin-bottom:7px}
        .stat-value{font-family:'Gaegu',cursive;font-size:1.8rem;font-weight:700;color:var(--dark)}
        .admin-card{background:#fff;border:1.5px solid var(--beige);border-radius:18px;padding:20px;box-shadow:0 8px 26px rgba(90,74,58,.07);margin-bottom:14px}
        .admin-card-title{font-family:'Gaegu',cursive;font-size:1.25rem;font-weight:700;color:var(--dark);margin-bottom:12px}
        .admin-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
        .admin-search{border:1.5px solid var(--beige);border-radius:100px;background:#fff;padding:9px 14px;font-family:inherit;font-size:.76rem;min-width:220px;outline:none;color:var(--dark)}
        .admin-search:focus{border-color:var(--green)}
        .admin-table-wrap{overflow-x:auto;padding-bottom:6px}
        .admin-table{width:100%;border-collapse:collapse;min-width:900px;table-layout:auto}
        .admin-table th{background:var(--beige3);color:var(--mid);font-size:.72rem;text-align:left;padding:11px;border-bottom:1px solid var(--beige);white-space:nowrap}
        .admin-table td{font-size:.76rem;color:var(--dark);padding:11px;border-bottom:1px solid var(--beige);vertical-align:top;word-break:keep-all}
        .admin-table tr:hover td{background:#fffaf0}
        .sort-th{cursor:pointer;user-select:none}
        .sort-th:hover{color:var(--green)}
        .admin-btn{border:none;border-radius:100px;padding:7px 11px;font-size:.7rem;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap}
        .admin-btn.green{background:var(--green);color:#fff}
        .admin-btn.amber{background:var(--amber);color:#fff}
        .admin-btn.gray{background:#eee;color:#777}
        .admin-btn.red{background:#f2dddd;color:#b23b3b}
        .status-chip{display:inline-flex;border-radius:100px;padding:4px 8px;font-size:.65rem;font-weight:700;background:var(--gp);color:var(--green)}
        .status-chip.warn{background:#fff4d8;color:#b47a00}
        .status-chip.hidden{background:#eee;color:#777}
        .empty{padding:24px;text-align:center;color:var(--muted);font-size:.82rem}
        .detail-box{display:none;background:var(--beige3);border:1.5px solid var(--beige);border-radius:18px;padding:18px;margin-top:14px}
        .detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
        .mini-card{background:#fff;border:1px solid var(--beige);border-radius:14px;padding:13px}
        .mini-title{font-weight:700;color:var(--dark);font-size:.82rem;margin-bottom:6px}
        .mini-text{font-size:.74rem;color:var(--mid);line-height:1.6}
        .review-table{min-width:1120px}
        .review-table th:nth-child(5),.review-table td:nth-child(5){width:360px;line-height:1.7}
        .review-content-cell{white-space:normal;word-break:keep-all;overflow-wrap:anywhere}
        .review-action-group{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
        .review-hidden-row td{background:#f7f1e8!important;color:#999}
        .cell-main{display:block;line-height:1.55;color:var(--dark);font-weight:600}
        .cell-sub{display:block;margin-top:3px;color:var(--muted);font-size:.68rem;line-height:1.3}
        @media(max-width:720px){.admin-head{padding:28px 6% 22px}.admin-table{min-width:760px}.admin-search{width:100%}}
    </style>
</head>
<body>
<div th:replace="~{nav :: nav}"></div>

<main class="admin-page">
    <section class="admin-head">
        <div>
            <div class="admin-kicker">Admin Dashboard</div>
            <h1 class="admin-title">관리자 대시보드 🛠️</h1>
            <p class="admin-desc">회원, 상품, 주문, 리뷰, 문의 현황을 한 번에 확인하고 운영 관리할 수 있는 관리자 전용 화면입니다.</p>
        </div>
       </section>

    <section class="admin-wrap">
        <div class="admin-tabs">
            <button class="admin-tab on" type="button" onclick="switchAdminTab('summary', this)">전체 현황</button>
            <button class="admin-tab" type="button" onclick="switchAdminTab('buyers', this)">구매자 관리</button>
            <button class="admin-tab" type="button" onclick="switchAdminTab('sellers', this)">판매자 관리</button>
            <button class="admin-tab" type="button" onclick="switchAdminTab('products', this)">상품 관리</button>
            <button class="admin-tab" type="button" onclick="switchAdminTab('orders', this)">주문 관리</button>
            <button class="admin-tab" type="button" onclick="switchAdminTab('reviews', this)">리뷰 관리</button>
            <button class="admin-tab" type="button" onclick="switchAdminTab('inquiries', this)">문의 관리</button>
        </div>

        <div id="section-summary" class="admin-section on">
            <div id="summaryGrid" class="stat-grid"></div>
        </div>

        <div id="section-buyers" class="admin-section">
            <div class="admin-card">
                <div class="admin-card-title">구매자 관리</div>
                <div class="admin-tools">
                    <input id="buyersSearch" class="admin-search" type="text" placeholder="이름, 이메일, 닉네임 검색">
                </div>
                <div id="buyersTable" class="admin-table-wrap"></div>
            </div>
            <div id="buyerDetail" class="detail-box"></div>
        </div>

        <div id="section-sellers" class="admin-section">
            <div class="admin-card">
                <div class="admin-card-title">판매자 관리</div>
                <div class="admin-tools">
                    <input id="sellersSearch" class="admin-search" type="text" placeholder="이름, 이메일, 닉네임 검색">
                </div>
                <div id="sellersTable" class="admin-table-wrap"></div>
            </div>
            <div id="sellerDetail" class="detail-box"></div>
        </div>

        <div id="section-products" class="admin-section">
            <div class="admin-card">
                <div class="admin-card-title">상품 관리</div>
                <div class="admin-tools">
                    <input id="productsSearch" class="admin-search" type="text" placeholder="상품명, 판매자, 카테고리, 상태 검색">
                </div>
                <div id="productsTable" class="admin-table-wrap"></div>
            </div>
        </div>

        <div id="section-orders" class="admin-section">
            <div class="admin-card">
                <div class="admin-card-title">주문 관리</div>
                <div class="admin-tools">
                    <input id="ordersSearch" class="admin-search" type="text" placeholder="주문번호, 구매자, 주문상태, 배송방식 검색">
                </div>
                <div id="ordersTable" class="admin-table-wrap"></div>
            </div>
        </div>

        <div id="section-reviews" class="admin-section">
            <div class="admin-card">
                <div class="admin-card-title">리뷰 관리</div>
                <div class="admin-tools">
                    <input id="reviewsSearch" class="admin-search" type="text" placeholder="상품명, 작성자, 리뷰 내용, 상태 검색">
                </div>
                <div id="reviewsTable" class="admin-table-wrap"></div>
            </div>
        </div>

        <div id="section-inquiries" class="admin-section">
            <div class="admin-card">
                <div class="admin-card-title">문의 관리</div>
                <div class="admin-tools">
                    <input id="inquiriesSearch" class="admin-search" type="text" placeholder="제목, 내용, 작성자, 상태, 카테고리 검색">
                    <button class="admin-btn amber" type="button" onclick="location.href='/admin/inquiries'">문의 답변 페이지 →</button>
                </div>
                <div id="inquiriesTable" class="admin-table-wrap"></div>
            </div>
        </div>
    </section>
</main>

<div th:replace="~{footer :: footer}"></div>

<script>
    var adminData={
        buyers:[],
        sellers:[],
        products:[],
        orders:[],
        reviews:[],
        inquiries:[]
    };

    var adminState={
        buyers:{keyword:'',sortKey:'createdAt',sortDir:'desc'},
        sellers:{keyword:'',sortKey:'createdAt',sortDir:'desc'},
        products:{keyword:'',sortKey:'createdAt',sortDir:'desc'},
        orders:{keyword:'',sortKey:'createdAt',sortDir:'desc'},
        reviews:{keyword:'',sortKey:'createdAt',sortDir:'desc'},
        inquiries:{keyword:'',sortKey:'createdAt',sortDir:'desc'}
    };

    document.addEventListener('DOMContentLoaded',function(){
        loadSummary();
    });

    document.addEventListener('input',function(event){
        if(event.target.id==='buyersSearch'){
            adminState.buyers.keyword=event.target.value;
            renderBuyers();
        }

        if(event.target.id==='sellersSearch'){
            adminState.sellers.keyword=event.target.value;
            renderSellers();
        }

        if(event.target.id==='productsSearch'){
            adminState.products.keyword=event.target.value;
            renderProducts();
        }

        if(event.target.id==='ordersSearch'){
            adminState.orders.keyword=event.target.value;
            renderOrders();
        }

        if(event.target.id==='reviewsSearch'){
            adminState.reviews.keyword=event.target.value;
            renderReviews();
        }

        if(event.target.id==='inquiriesSearch'){
            adminState.inquiries.keyword=event.target.value;
            renderInquiries();
        }
    });

    async function adminFetch(url,options){
        options=options||{};
        return await fetch(url,options);
    }

    function switchAdminTab(tab,element){
        document.querySelectorAll('.admin-tab').forEach(function(button){
            button.classList.remove('on');
        });

        if(element){
            element.classList.add('on');
        }

        document.querySelectorAll('.admin-section').forEach(function(section){
            section.classList.remove('on');
        });

        var target=document.getElementById('section-'+tab);

        if(target){
            target.classList.add('on');
        }

        if(tab==='summary')loadSummary();
        if(tab==='buyers')loadBuyers();
        if(tab==='sellers')loadSellers();
        if(tab==='products')loadProducts();
        if(tab==='orders')loadOrders();
        if(tab==='reviews')loadReviews();
        if(tab==='inquiries')loadInquiries();
    }

    async function loadSummary(){
        var grid=document.getElementById('summaryGrid');
        grid.innerHTML='<div class="empty">전체 현황을 불러오는 중입니다.</div>';

        try{
            var response=await adminFetch('/api/admin/dashboard/summary');
            var data=await response.json();

            grid.innerHTML=[
                statCard('전체 회원 수',data.totalUserCount),
                statCard('구매자 수',data.buyerCount),
                statCard('판매자 수',data.sellerCount),
                statCard('등록 상품 수',data.productCount),
                statCard('전체 주문 수',data.orderCount),
                statCard('답변 대기 문의',data.pendingInquiryCount),
                statCard('전체 리뷰 수',data.reviewCount),
                statCard('최근 7일 리뷰',data.recentReviewCount)
            ].join('');
        }catch(error){
            grid.innerHTML='<div class="empty">전체 현황을 불러오지 못했습니다.</div>';
        }
    }

    async function loadBuyers(){
        var box=document.getElementById('buyersTable');
        box.innerHTML='<div class="empty">구매자 목록을 불러오는 중입니다.</div>';

        try{
            var response=await adminFetch('/api/admin/dashboard/buyers');
            adminData.buyers=await response.json();
            renderBuyers();
        }catch(error){
            box.innerHTML='<div class="empty">구매자 목록을 불러오지 못했습니다.</div>';
        }
    }

    async function loadSellers(){
        var box=document.getElementById('sellersTable');
        box.innerHTML='<div class="empty">판매자 목록을 불러오는 중입니다.</div>';

        try{
            var response=await adminFetch('/api/admin/dashboard/sellers');
            adminData.sellers=await response.json();
            renderSellers();
        }catch(error){
            box.innerHTML='<div class="empty">판매자 목록을 불러오지 못했습니다.</div>';
        }
    }

    async function loadProducts(){
        var box=document.getElementById('productsTable');
        box.innerHTML='<div class="empty">상품 목록을 불러오는 중입니다.</div>';

        try{
            var response=await adminFetch('/api/admin/dashboard/products');
            adminData.products=await response.json();
            renderProducts();
        }catch(error){
            box.innerHTML='<div class="empty">상품 목록을 불러오지 못했습니다.</div>';
        }
    }

    async function loadOrders(){
        var box=document.getElementById('ordersTable');
        box.innerHTML='<div class="empty">주문 목록을 불러오는 중입니다.</div>';

        try{
            var response=await adminFetch('/api/admin/dashboard/orders');
            adminData.orders=await response.json();
            renderOrders();
        }catch(error){
            box.innerHTML='<div class="empty">주문 목록을 불러오지 못했습니다.</div>';
        }
    }

    async function loadReviews(){
        var box=document.getElementById('reviewsTable');
        box.innerHTML='<div class="empty">리뷰 목록을 불러오는 중입니다.</div>';

        try{
            var response=await adminFetch('/api/admin/dashboard/reviews');
            adminData.reviews=await response.json();
            renderReviews();
        }catch(error){
            box.innerHTML='<div class="empty">리뷰 목록을 불러오지 못했습니다.</div>';
        }
    }

    async function loadInquiries(){
        var box=document.getElementById('inquiriesTable');
        box.innerHTML='<div class="empty">문의 목록을 불러오는 중입니다.</div>';

        try{
            var response=await adminFetch('/api/admin/dashboard/inquiries');
            adminData.inquiries=await response.json();
            renderInquiries();
        }catch(error){
            box.innerHTML='<div class="empty">문의 목록을 불러오지 못했습니다.</div>';
        }
    }

    function renderBuyers(){
        var box=document.getElementById('buyersTable');
        var keyword=adminState.buyers.keyword;

        var data=adminData.buyers.filter(function(item){
            return includesKeyword(item,keyword,['name','email','nickname','phone','address']);
        });

        data=applySort('buyers',data);
        box.innerHTML=renderUserTable(data,'buyer');
    }

    function renderSellers(){
        var box=document.getElementById('sellersTable');
        var keyword=adminState.sellers.keyword;

        var data=adminData.sellers.filter(function(item){
            return includesKeyword(item,keyword,['name','email','nickname','phone','address']);
        });

        data=applySort('sellers',data);
        box.innerHTML=renderUserTable(data,'seller');
    }

    function renderProducts(){
        var box=document.getElementById('productsTable');
        var keyword=adminState.products.keyword;

        var data=adminData.products.filter(function(item){
            return includesKeyword(item,keyword,['name','sellerName','category','statusText','origin']);
        });

        data=applySort('products',data);

        if(!data.length){
            box.innerHTML='<div class="empty">등록된 상품이 없습니다.</div>';
            return;
        }

        box.innerHTML='<table class="admin-table"><thead><tr>'
            +'<th class="sort-th" onclick="sortAdminTable(\'products\',\'id\')">ID '+sortIcon('products','id')+'</th>'
            +'<th class="sort-th" onclick="sortAdminTable(\'products\',\'name\')">상품명 '+sortIcon('products','name')+'</th>'
            +'<th class="sort-th" onclick="sortAdminTable(\'products\',\'sellerName\')">판매자 '+sortIcon('products','sellerName')+'</th>'
            +'<th class="sort-th" onclick="sortAdminTable(\'products\',\'category\')">카테고리 '+sortIcon('products','category')+'</th>'
            +'<th class="sort-th" onclick="sortAdminTable(\'products\',\'displayPrice\')">가격 '+sortIcon('products','displayPrice')+'</th>'
            +'<th class="sort-th" onclick="sortAdminTable(\'products\',\'stockQuantity\')">재고 '+sortIcon('products','stockQuantity')+'</th>'
            +'<th class="sort-th" onclick="sortAdminTable(\'products\',\'pickupAvailable\')">픽업 '+sortIcon('products','pickupAvailable')+'</th>'
            +'<th class="sort-th" onclick="sortAdminTable(\'products\',\'statusText\')">상태 '+sortIcon('products','statusText')+'</th>'
            +'<th class="sort-th" onclick="sortAdminTable(\'products\',\'createdAt\')">등록일 '+sortIcon('products','createdAt')+'</th>'
            +'</tr></thead><tbody>'
            +data.map(function(item){
                item.displayPrice=item.discountPrice||item.price;

                return '<tr>'
                    +'<td>'+escapeHtml(item.id)+'</td>'
                    +'<td>'+escapeHtml(item.name)+'</td>'
                    +'<td>'+escapeHtml(item.sellerName||'-')+'<br><span class="cell-sub">ID '+escapeHtml(item.sellerId||'-')+'</span></td>'
                    +'<td>'+escapeHtml(item.category)+'</td>'
                    +'<td>'+formatMoney(item.discountPrice||item.price)+'</td>'
                    +'<td>'+escapeHtml(item.stockQuantity)+'</td>'
                    +'<td>'+boolText(item.pickupAvailable)+'</td>'
                    +'<td><span class="status-chip">'+escapeHtml(item.statusText)+'</span></td>'
                    +'<td>'+formatDate(item.createdAt)+'</td>'
                    +'</tr>';
            }).join('')
            +'</tbody></table>';
    }

    function renderOrders(){
        var box=document.getElementById('ordersTable');
        var keyword=adminState.orders.keyword;

        var data=adminData.orders.filter(function(item){
            return includesKeyword(item,keyword,['orderNumber','buyerName','status','deliveryType','paymentMethod']);
        });

        data=applySort('orders',data);

        if(!data.length){
            box.innerHTML='<div class="empty">주문 내역이 없습니다.</div>';
            return;
        }

        box.innerHTML='<table class="admin-table"><thead><tr>'
            +'<th class="sort-th" onclick="sortAdminTable(\'orders\',\'id\')">ID '+sortIcon('orders','id')+'</th>'
            +'<th class="sort-th" onclick="sortAdminTable(\'orders\',\'orderNumber\')">주문번호 '+sortIcon('orders','orderNumber')+'</th>'
            +'<th class="sort-th" onclick="sortAdminTable(\'orders\',\'buyerName\')">구매자 '+sortIcon('orders','buyerName')+'</th>'
            +'<th class="sort-th" onclick="sortAdminTable(\'orders\',\'itemCount\')">상품수 '+sortIcon('orders','itemCount')+'</th>'
            +'<th class="sort-th" onclick="sortAdminTable(\'orders\',\'totalAmount\')">금액 '+sortIcon('orders','totalAmount')+'</th>'
            +'<th class="sort-th" onclick="sortAdminTable(\'orders\',\'deliveryType\')">방식 '+sortIcon('orders','deliveryType')+'</th>'
            +'<th class="sort-th" onclick="sortAdminTable(\'orders\',\'status\')">상태 '+sortIcon('orders','status')+'</th>'
            +'<th class="sort-th" onclick="sortAdminTable(\'orders\',\'createdAt\')">주문일 '+sortIcon('orders','createdAt')+'</th>'
            +'</tr></thead><tbody>'
            +data.map(function(item){
                return '<tr>'
                    +'<td>'+escapeHtml(item.id)+'</td>'
                    +'<td>'+escapeHtml(item.orderNumber||'-')+'</td>'
                    +'<td>'+escapeHtml(item.buyerName||'-')+'<br><span class="cell-sub">ID '+escapeHtml(item.buyerId||'-')+'</span></td>'
                    +'<td>'+escapeHtml(item.itemCount||0)+'개<br>'+renderOrderItems(item.items)+'</td>'
                    +'<td>'+formatMoney(item.totalAmount)+'</td>'
                    +'<td>'+escapeHtml(item.deliveryType||'-')+'</td>'
                    +'<td><span class="status-chip">'+escapeHtml(item.status||'-')+'</span></td>'
                    +'<td>'+formatDate(item.createdAt)+'</td>'
                    +'</tr>';
            }).join('')
            +'</tbody></table>';
    }

    function renderReviews(){
        var box=document.getElementById('reviewsTable');
        var keyword=adminState.reviews.keyword;

        var data=adminData.reviews.filter(function(item){
            var statusText=item.hidden?'숨김':'노출';
            item.statusText=statusText;

            return includesKeyword(item,keyword,['productName','userName','content','statusText']);
        });

        data=applySort('reviews',data);

        if(!data.length){
            box.innerHTML='<div class="empty">등록된 리뷰가 없습니다.</div>';
            return;
        }

        box.innerHTML='<table class="admin-table review-table"><thead><tr>'

    function renderInquiries(){

            +'<th>전화번호</th>'

            +'</tr></thead><tbody>'
            +data.map(function(user){
                return '<tr>'
                    +'<td>'+escapeHtml(user.id)+'</td>'
                    +'<td>'+escapeHtml(user.name||'-')+'</td>'

    async function loadUserDetail(userId,type){
        var detailBox=document.getElementById(type==='buyer'?'buyerDetail':'sellerDetail');
        detailBox.style.display='block';
        detailBox.innerHTML='<div class="empty">회원 상세 정보를 불러오는 중입니다.</div>';

        try{
            var response=await adminFetch('/api/admin/dashboard/users/'+userId);
            var data=await response.json();
            detailBox.innerHTML=renderUserDetail(data,type);
        }catch(error){
            detailBox.innerHTML='<div class="empty">회원 상세 정보를 불러오지 못했습니다.</div>';
        }
    }

    function renderUserDetail(data,type){
        var user=data.user||{};

        return '<div class="admin-card-title">'+escapeHtml(user.name||'-')+' 상세 정보</div>'
            +'<div class="detail-grid">'
            +miniCard('회원정보','이메일: '+safe(user.email)+'<br>전화번호: '+safe(user.phone)+'<br>주소: '+safe(user.address)+'<br>가입일: '+formatDate(user.createdAt))
            +miniCard('구매내역',renderSimpleList(data.orders,'order'))
            +miniCard('작성 리뷰',renderSimpleList(data.writtenReviews,'review'))
            +miniCard('작성 문의',renderSimpleList(data.inquiries,'inquiry'))
            +(type==='seller'?miniCard('등록 상품',renderSimpleList(data.products,'product')):'')
            +(type==='seller'?miniCard('판매 상품 리뷰',renderSimpleList(data.productReviews,'review')):'')
            +'</div>';
    }

    async function hideReview(reviewId){
        if(!confirm('해당 리뷰를 숨김 처리할까요?')){
            return;
        }

        try{
            var response=await adminFetch('/api/admin/dashboard/reviews/'+reviewId+'/hide',{
                method:'PATCH'
            });

            if(!response.ok){
                alert('리뷰 숨김 처리에 실패했습니다.');
                return;
            }

            alert('리뷰가 숨김 처리되었습니다.');
            await loadReviews();
        }catch(error){
            alert('리뷰 숨김 처리 중 오류가 발생했습니다.');
        }
    }

    async function deleteReview(reviewId){
        if(!confirm('해당 리뷰를 삭제 처리할까요?')){
            return;
        }

        try{
            var response=await adminFetch('/api/admin/dashboard/reviews/'+reviewId,{
                method:'DELETE'
            });

            if(!response.ok){
                alert('리뷰 삭제 처리에 실패했습니다.');
                return;
            }

            alert('리뷰가 삭제 처리되었습니다.');
            await loadReviews();
        }catch(error){
            alert('리뷰 삭제 처리 중 오류가 발생했습니다.');
        }
    }

    function sortAdminTable(type,key){
        var state=adminState[type];

        if(state.sortKey===key){
            state.sortDir=state.sortDir==='desc'?'asc':'desc';
        }else{
            state.sortKey=key;
            state.sortDir='desc';
        }

        if(type==='buyers')renderBuyers();
        if(type==='sellers')renderSellers();
        if(type==='products')renderProducts();
        if(type==='orders')renderOrders();
        if(type==='reviews')renderReviews();
        if(type==='inquiries')renderInquiries();
    }

    function sortIcon(type,key){
        var state=adminState[type];

        if(state.sortKey!==key){
            return '↕';
        }

        return state.sortDir==='desc'?'▼':'▲';
    }

    function applySort(type,data){
        var state=adminState[type];
        var key=state.sortKey;
        var dir=state.sortDir==='desc'?-1:1;

        return data.slice().sort(function(a,b){
            var av=getSortValue(a,key);
            var bv=getSortValue(b,key);

            if(av>bv)return dir;
            if(av<bv)return -dir;
            return 0;
        });
    }

    function getSortValue(item,key){
        if(key==='displayPrice'){
            return Number(item.discountPrice||item.price||0);
        }

        var value=item[key];

        if(key==='createdAt'||key==='updatedAt'||key==='answeredAt'){
            return value?new Date(value).getTime():0;
        }

        if(typeof value==='boolean'){
            return value?1:0;
        }

        if(typeof value==='number'){
            return value;
        }

        if(value===null||value===undefined){
            return '';
        }

        if(!isNaN(value) && value !== ''){
            return Number(value);
        }

        return String(value).toLowerCase();
    }

    function includesKeyword(item,keyword,fields){
        if(!keyword){
            return true;
        }

        var lower=keyword.toLowerCase();

        return fields.some(function(field){
            var value=item[field];

            if(value===null||value===undefined){
                return false;
            }

            return String(value).toLowerCase().includes(lower);
        });
    }

    function statCard(label,value){
        return '<div class="stat-card"><div class="stat-label">'+escapeHtml(label)+'</div><div class="stat-value">'+escapeHtml(value||0)+'</div></div>';
    }

    function miniCard(title,content){
        return '<div class="mini-card"><div class="mini-title">'+escapeHtml(title)+'</div><div class="mini-text">'+content+'</div></div>';
    }

    function renderSimpleList(items,type){
        if(!items||!items.length){
            return '내역이 없습니다.';
        }

        return items.slice(0,5).map(function(item){
            if(type==='order'){
                return '주문 '+safe(item.orderNumber||item.id)+' / '+formatMoney(item.totalAmount)+' / '+safe(item.status);
            }

            if(type==='review'){
                return safe(item.productName)+' / '+safe(item.rating)+'점 / '+safe(shortText(item.content,35));
            }

            if(type==='inquiry'){
                return '['+safe(item.status)+'] '+safe(item.title);
            }

            if(type==='product'){
                return safe(item.name)+' / 재고 '+safe(item.stockQuantity)+' / '+safe(item.statusText);
            }

            return safe(item.id);
        }).join('<br>');
    }

    function renderOrderItems(items){
        if(!items||!items.length){
            return '-';
        }

        return items.slice(0,2).map(function(item){
            return escapeHtml(item.productName||'상품 '+item.productId)+' x '+escapeHtml(item.quantity);
        }).join('<br>')+(items.length>2?'<br><span class="cell-sub">외 '+(items.length-2)+'개</span>':'');
    }

    function renderStars(rating){
        var count=Number(rating||0);
        var result='';

        for(var i=1;i<=5;i++){
            result+=i<=count?'⭐':'☆';
        }

        return result;
    }

    function formatMoney(value){
        if(value===null||value===undefined||value===''){
            return '-';
        }

        return Number(value).toLocaleString('ko-KR')+'원';
    }

    function formatDate(value){
        if(!value){
            return '-';
        }

        return String(value).replace('T',' ').substring(0,10);
    }

    function boolText(value){
        return value?'있음':'없음';
    }

    function shortText(value,length){
        if(value===null||value===undefined){
            return '';
        }

        var text=String(value);

        if(text.length<=length){
            return text;
        }

        return text.substring(0,length)+'...';
    }

    function safe(value){
        if(value===null||value===undefined||value===''){
            return '-';
        }

        return escapeHtml(value);
    }

    function escapeHtml(value){
        if(value===null||value===undefined){
            return '';
        }

        return String(value)
            .replaceAll('&','&amp;')
            .replaceAll('<','&lt;')
            .replaceAll('>','&gt;')
            .replaceAll('"','&quot;')
            .replaceAll("'","&#039;");
    }
</script>
