<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>문의하기 | 못난이 농작물</title>
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" href="/css/style.css" rel="stylesheet"/>
    <style>
        .inquiry-page{min-height:100vh;padding-top:64px;background:linear-gradient(160deg,var(--beige2) 0%,var(--beige3) 46%,var(--gp) 100%)}
        .inquiry-head{background:var(--white);border-bottom:1.5px solid var(--beige);padding:34px 6% 26px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
        .inquiry-kicker{font-size:.68rem;color:var(--green);letter-spacing:1px;font-weight:700;margin-bottom:8px}
        .inquiry-head-title{font-family:'Gaegu',cursive;font-size:clamp(1.8rem,3vw,2.5rem);font-weight:700;color:var(--dark)}
        .inquiry-head-desc{color:var(--light);font-size:.84rem;line-height:1.7;margin-top:8px;max-width:620px}
        .inquiry-head-btn{background:var(--amber);color:#fff;border:none;border-radius:100px;padding:12px 24px;font-family:'Gaegu',cursive;font-size:1.08rem;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(240,168,62,.25);transition:all .2s}
        .inquiry-layout{max-width:760px;margin:0 auto;padding:34px 6% 80px}
        .inquiry-card{background:var(--white);border:1.5px solid var(--beige);border-radius:20px;padding:26px;box-shadow:0 8px 28px rgba(90,74,58,.08)}
        .inquiry-form-group{margin-bottom:15px}
        .inquiry-form-group label{display:block;font-size:.73rem;color:var(--mid);font-weight:700;margin-bottom:7px}
        .inquiry-form-group input,.inquiry-form-group select,.inquiry-form-group textarea{width:100%;padding:12px 13px;border:1.5px solid var(--beige);border-radius:12px;font-family:inherit;color:var(--dark);outline:none;background:var(--beige3)}
        .inquiry-form-group textarea{resize:none;min-height:190px}
        .inquiry-guide{background:var(--gp);border:1.5px solid rgba(123,191,69,.18);border-radius:16px;padding:15px 16px;color:var(--mid);font-size:.8rem;line-height:1.7;margin-bottom:18px}
        .inquiry-guide strong{color:var(--green)}
        .inquiry-actions{display:flex;gap:10px;margin-top:20px}
        .inquiry-btn{border:none;border-radius:13px;padding:13px 18px;font-family:'Gaegu',cursive;font-size:1.05rem;font-weight:700;cursor:pointer}
        .inquiry-btn.primary{background:var(--green);color:#fff;flex:1;box-shadow:0 6px 18px rgba(123,191,69,.22)}
        .inquiry-btn.secondary{background:var(--beige);color:var(--mid)}
        .inquiry-target-box{display:none;background:#fffaf0;border:1.5px solid var(--beige);border-radius:14px;padding:14px;margin-bottom:15px}
        .inquiry-target-title{font-size:.78rem;color:var(--dark);font-weight:800;margin-bottom:8px}
        .inquiry-target-desc{font-size:.72rem;color:var(--muted);line-height:1.6;margin-bottom:10px}

        .inquiry-target-box select{width:100%;height:44px;padding:0 13px;border:1.5px solid var(--beige);border-radius:12px;font-family:inherit;font-size:.82rem;color:var(--dark);outline:none;background:#fff;box-sizing:border-box;appearance:auto}
        .inquiry-target-box select:focus{border-color:var(--green);background:#fff}
        .inquiry-image-preview{display:none;margin-top:10px;background:#fff;border:1.5px solid var(--beige);border-radius:14px;padding:12px;text-align:center}
        .inquiry-image-preview img{max-width:100%;max-height:180px;object-fit:contain;border-radius:10px}
        @media(max-width:720px){.inquiry-actions{flex-direction:column}.inquiry-head{padding:28px 6% 22px}}
    </style>
</head>
<body>
<div th:replace="~{nav :: nav}"></div>

<main class="inquiry-page">
    <section class="inquiry-head">
        <div>
            <div class="inquiry-kicker">Customer Inquiry</div>
            <h1 class="inquiry-head-title">문의하기 💬</h1>
            <p class="inquiry-head-desc">구매자는 주문을 먼저 선택한 뒤 그 주문에 포함된 상품을 골라 문의할 수 있고, 판매자는 기타 문의만 작성할 수 있습니다.</p>
        </div>
        <button class="inquiry-head-btn" type="button" onclick="goMyInquiry()">내 문의보기 →</button>
    </section>

    <section class="inquiry-layout">
        <div class="inquiry-card">
            <div class="inquiry-guide" id="inquiryGuide">
                <strong>문의 전 확인해주세요.</strong><br/>
                구매자는 주문 관련 문의를 남길 수 있습니다. 상품 문의는 주문 선택 후 해당 주문의 상품을 선택해주세요.<br/>
                판매자는 관리자에게 전달할 기타 문의만 작성할 수 있습니다.
            </div>

            <div class="inquiry-form-group">
                <label for="inquiryCategory">문의 유형</label>
                <select id="inquiryCategory" onchange="onInquiryCategoryChange()">
                    <option value="delivery">배송 문의</option>
                    <option value="refund">환불/교환 문의</option>
                    <option value="product">상품 문의</option>
                    <option value="order">주문/결제 문의</option>
                    <option value="etc">기타 문의</option>
                </select>
            </div>

            <div id="buyerOrderBox" class="inquiry-target-box">
                <div class="inquiry-target-title">관련 주문 선택</div>
                <div class="inquiry-target-desc">문의와 관련된 주문을 먼저 선택해주세요.</div>
                <select id="inquiryOrderSelect" onchange="onInquiryOrderChange()">
                    <option value="">선택 안 함</option>
                </select>
            </div>

            <div id="buyerProductBox" class="inquiry-target-box">
                <div class="inquiry-target-title">주문 상품 선택</div>
                <div class="inquiry-target-desc">선택한 주문에 포함된 상품만 고를 수 있습니다.</div>
                <select id="inquiryProductSelect">
                    <option value="">상품을 선택해주세요</option>
                </select>
            </div>

            <div class="inquiry-form-group">
                <label for="inquiryTitle">제목</label>
                <input id="inquiryTitle" type="text" placeholder="문의 제목을 입력해주세요."/>
            </div>

            <div class="inquiry-form-group">
                <label for="inquiryContent">문의 내용</label>
                <textarea id="inquiryContent" placeholder="문의 내용을 자세히 입력해주세요."></textarea>
            </div>

            <div class="inquiry-form-group">
                <label for="inquiryImageFile">사진 첨부</label>
                <input id="inquiryImageFile" type="file" accept="image/*"/>
                <div id="inquiryImagePreview" class="inquiry-image-preview"></div>
            </div>

            <div class="inquiry-actions">
                <button type="button" class="inquiry-btn secondary" onclick="location.href='/faq'">FAQ로 돌아가기</button>
                <button type="button" class="inquiry-btn primary" onclick="submitInquiry()">문의 등록하기</button>
            </div>
        </div>
    </section>
</main>

<div th:replace="~{footer :: footer}"></div>

<script>
    var selectedInquiryRole=null;
    var cachedBuyerOrders=[];

    document.addEventListener('DOMContentLoaded',function(){
        if(!isInquiryLoggedIn()){
            showInquiryToast('로그인 후 문의를 작성할 수 있어요.');
            setTimeout(function(){location.href='/login'},900);
            return;
        }
        loadInquiryUserRole();
        var imageInput=document.getElementById('inquiryImageFile');
        if(imageInput) imageInput.addEventListener('change',previewInquiryImage);
    });

    async function loadInquiryUserRole(){
        try{
            var response=await fetch('/mypage/info',{headers:getInquiryAuthOnlyHeaders()});
            if(response.status===401||response.status===403){handleInquiryUnauthorized();return;}
            var info=await response.json();
            selectedInquiryRole=String(info.role||'').toUpperCase();
            setupInquiryFormByRole();
        }catch(error){
            selectedInquiryRole='';
            setupInquiryFormByRole();
        }
    }

    async function setupInquiryFormByRole(){
        var category=document.getElementById('inquiryCategory');
        var guide=document.getElementById('inquiryGuide');

        if(selectedInquiryRole==='SELLER'){
            category.innerHTML='<option value="etc">기타 문의</option>';
            category.value='etc';
            guide.innerHTML='<strong>판매자 문의 안내</strong><br/>판매자는 상품, 배송, 환불 문의가 아닌 관리자에게 전달할 기타 문의만 작성할 수 있습니다.';
            hideBuyerTargetBoxes();
            return;
        }

        category.innerHTML=''
            +'<option value="delivery">배송 문의</option>'
            +'<option value="refund">환불/교환 문의</option>'
            +'<option value="product">상품 문의</option>'
            +'<option value="order">주문/결제 문의</option>'
            +'<option value="etc">기타 문의</option>';

        await loadBuyerOrders();
        onInquiryCategoryChange();
    }

    async function loadBuyerOrders(){
        var orderSelect=document.getElementById('inquiryOrderSelect');
        if(!orderSelect)return;
        orderSelect.innerHTML='<option value="">주문을 불러오는 중입니다.</option>';

        try{
            var response=await fetch('/api/inquiries/my-orders',{headers:getInquiryAuthOnlyHeaders()});
            if(response.status===401||response.status===403){handleInquiryUnauthorized();return;}
            var orders=await response.json();
            cachedBuyerOrders=Array.isArray(orders)?orders:[];

            if(cachedBuyerOrders.length===0){
                orderSelect.innerHTML='<option value="">선택 가능한 주문이 없습니다</option>';
                return;
            }

            orderSelect.innerHTML='<option value="">선택 안 함</option>';
            cachedBuyerOrders.forEach(function(order){
                var items=getOrderItems(order);
                var itemNames=items.map(function(item){return item.productName||('상품 '+item.productId)}).join(', ');
                var option=document.createElement('option');
                option.value=order.id;
                option.textContent='주문번호 '+(order.orderNumber||order.id)+' · '+getInquiryOrderStatusText(order.status)+' · '+shortInquiryText(itemNames,42);
                orderSelect.appendChild(option);
            });
        }catch(error){
            orderSelect.innerHTML='<option value="">주문을 불러오지 못했습니다</option>';
        }
    }

    function onInquiryCategoryChange(){
        if(selectedInquiryRole==='SELLER'){hideBuyerTargetBoxes();return;}

        var category=document.getElementById('inquiryCategory').value;
        var needsOrder=category==='delivery'||category==='refund'||category==='product'||category==='order';
        var needsProduct=category==='delivery'||category==='refund'||category==='product';

        document.getElementById('buyerOrderBox').style.display=needsOrder?'block':'none';
        document.getElementById('buyerProductBox').style.display=needsProduct?'block':'none';

        if(!needsOrder){
            document.getElementById('inquiryOrderSelect').value='';
            resetProductSelect();
            return;
        }
        onInquiryOrderChange();
    }

    function onInquiryOrderChange(){
        var category=document.getElementById('inquiryCategory').value;
        var needsProduct=category==='delivery'||category==='refund'||category==='product';
        var orderId=Number(document.getElementById('inquiryOrderSelect').value||0);
        resetProductSelect();
        if(!needsProduct||!orderId)return;

        var order=cachedBuyerOrders.find(function(item){return Number(item.id)===orderId});
        var items=getOrderItems(order);
        var select=document.getElementById('inquiryProductSelect');

        if(items.length===0){
            select.innerHTML='<option value="">이 주문에 상품 정보가 없습니다</option>';
            return;
        }

        select.innerHTML='<option value="">선택 안 함</option>';
        items.forEach(function(item){
            var option=document.createElement('option');
            option.value=String(item.productId||'');
            option.dataset.orderItemId=item.orderItemId||'';
            option.textContent=(item.productName||('상품 '+item.productId))+' · '+(item.quantity||0)+'개';
            select.appendChild(option);
        });
    }

    function resetProductSelect(){
        var select=document.getElementById('inquiryProductSelect');
        if(select) select.innerHTML='<option value="">선택 안 함</option>';
    }

    function hideBuyerTargetBoxes(){
        document.getElementById('buyerOrderBox').style.display='none';
        document.getElementById('buyerProductBox').style.display='none';
    }

    function getOrderItems(order){
        if(!order)return[];
        return Array.isArray(order.orderItems)?order.orderItems:(Array.isArray(order.items)?order.items:[]);
    }

    function previewInquiryImage(){
        var fileInput=document.getElementById('inquiryImageFile');
        var preview=document.getElementById('inquiryImagePreview');
        if(!fileInput||!preview)return;
        var file=fileInput.files&&fileInput.files[0];
        if(!file){preview.style.display='none';preview.innerHTML='';return;}
        var url=URL.createObjectURL(file);
        preview.style.display='block';
        preview.innerHTML='<img src="'+url+'" alt="문의 이미지 미리보기">';
    }

    async function uploadInquiryImageIfExists(){
        var fileInput=document.getElementById('inquiryImageFile');
        if(!fileInput||!fileInput.files||fileInput.files.length===0) return null;
        var formData=new FormData();
        formData.append('image',fileInput.files[0]);
        var response=await fetch('/api/inquiries/upload-image',{method:'POST',headers:getInquiryAuthOnlyHeaders(),body:formData});
        var data=await response.json();
        if(!response.ok) throw new Error(data.message||'이미지 업로드에 실패했습니다.');
        return data.imageUrl;
    }

    function getSelectedInquiryTarget(){
        if(selectedInquiryRole==='SELLER') return {productId:null,orderId:null,orderItemId:null};

        var category=document.getElementById('inquiryCategory').value;
        var needsOrder=category==='delivery'||category==='refund'||category==='product'||category==='order';
        var needsProduct=category==='delivery'||category==='refund'||category==='product';
        var orderId=Number(document.getElementById('inquiryOrderSelect').value||0)||null;
        var productSelect=document.getElementById('inquiryProductSelect');
        var productId=productSelect&&productSelect.value?Number(productSelect.value):null;
        var orderItemId=productSelect&&productSelect.selectedOptions[0]?Number(productSelect.selectedOptions[0].dataset.orderItemId||0)||null:null;

        // 주문/상품 선택은 선택사항입니다.
        // 주문을 선택하지 않으면 일반 문의처럼 저장하고, 상품을 선택하지 않으면 주문 단위 문의로 저장합니다.
        if(!needsOrder) return {productId:null,orderId:null,orderItemId:null};
        if(!orderId) return {productId:null,orderId:null,orderItemId:null};
        return {
            productId:needsProduct?productId:null,
            orderId:orderId,
            orderItemId:(needsProduct&&productId)?orderItemId:null
        };
    }

    function getInquiryOrderStatusText(status){
        switch(status){
            case 'PAYMENT_COMPLETE':return '결제 완료';
            case 'PREPARING':return '배송 준비';
            case 'SHIPPING':return '배송 중';
            case 'DELIVERED':return '배송 완료';
            case 'CANCELLED':return '취소';
            case 'REFUNDED':return '환불';
            default:return status||'-';
        }
    }

    function shortInquiryText(value,length){var text=String(value||'');return text.length<=length?text:text.substring(0,length)+'...';}
    function isInquiryLoggedIn(){return !!getInquiryAuthToken();}
    function getInquiryCookieValue(name){var cookies=document.cookie?document.cookie.split('; '):[];for(var i=0;i<cookies.length;i++){var parts=cookies[i].split('=');var key=decodeURIComponent(parts.shift());if(key===name)return decodeURIComponent(parts.join('='));}return null;}
    function getInquiryAuthToken(){return localStorage.getItem('token')||sessionStorage.getItem('token')||getInquiryCookieValue('jwt');}
    function getInquiryAuthOnlyHeaders(){var token=getInquiryAuthToken();var headers={};if(token)headers.Authorization='Bearer '+token;return headers;}
    function getInquiryAuthJsonHeaders(){var headers={'Content-Type':'application/json'};var token=getInquiryAuthToken();if(token)headers.Authorization='Bearer '+token;return headers;}
    function handleInquiryUnauthorized(){showInquiryToast('로그인이 필요합니다. 다시 로그인해주세요.');setTimeout(function(){location.href='/login'},900);}
    function goMyInquiry(){if(!isInquiryLoggedIn()){handleInquiryUnauthorized();return;}location.href='/my';}

    async function submitInquiry(){
        if(!isInquiryLoggedIn()){handleInquiryUnauthorized();return;}
        var category=document.getElementById('inquiryCategory').value;
        var title=document.getElementById('inquiryTitle').value.trim();
        var content=document.getElementById('inquiryContent').value.trim();
        if(!title){showInquiryToast('문의 제목을 입력해주세요.');return;}
        if(!content){showInquiryToast('문의 내용을 입력해주세요.');return;}

        var target;
        try{target=getSelectedInquiryTarget();}catch(error){showInquiryToast(error.message);return;}
        var imageUrl=null;
        try{imageUrl=await uploadInquiryImageIfExists();}catch(error){showInquiryToast(error.message||'이미지 업로드에 실패했습니다.');return;}

        var body={productId:target.productId,orderId:target.orderId,orderItemId:target.orderItemId,category:category,title:title,content:content,imageUrl:imageUrl};

        try{
            var response=await fetch('/api/inquiries',{method:'POST',headers:getInquiryAuthJsonHeaders(),body:JSON.stringify(body)});
            if(response.status===401||response.status===403){handleInquiryUnauthorized();return;}
            var data=await response.json();
            if(!response.ok){showInquiryToast(data.message||'문의 등록에 실패했습니다.');return;}
            showInquiryToast('문의가 등록되었습니다.');
            setTimeout(function(){location.href='/my'},700);
        }catch(error){showInquiryToast('서버 연결에 실패했습니다.');}
    }

    function showInquiryToast(message){if(typeof showToast==='function'){showToast(message);return;}alert(message);}
</script>
</body>
</html>
