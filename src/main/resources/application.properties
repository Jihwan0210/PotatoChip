spring.application.name=PotatoChip


spring.datasource.url=jdbc:mysql://localhost:3306/potatochip?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=1234
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.ai.openai.api-key=dummy

# JWT
jwt.secret=potatochip-secret-key-must-be-at-least-32-characters
jwt.expiration=86400000